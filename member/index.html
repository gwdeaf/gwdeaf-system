<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회원관리</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

  body { font-family: 'Malgun Gothic', sans-serif; margin: 0; background: #f5f7fa; font-size: 16px; color: #222; }
  header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; background: #2f5bd6; color: #fff; padding: 12px 16px; }
  header h1 { font-size: 18px; margin: 0 0 4px; }
  #who { font-size: 13px; opacity: .9; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px; background: #fff; border-bottom: 1px solid #ddd; }
  button { font-size: 15px; padding: 10px 14px; border: 0; border-radius: 6px; background: #2f5bd6; color: #fff; cursor: pointer; }
  button.sub { background: #e6e9ef; color: #222; }
  button.danger { background: #c0392b; }
  main { padding: 12px 16px; }
  .card { background: #fff; border-radius: 8px; padding: 12px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.08); cursor: pointer; }
  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #e6e9ef; }
  .badge.ok { background: #d4efdf; }
  .badge.cancel { background: #f5b7b1; }
  label { display: block; margin-top: 10px; font-weight: bold; font-size: 14px; }
  input, select, textarea { width: 100%; box-sizing: border-box; font-size: 16px; padding: 10px; margin-top: 4px; border: 1px solid #bbb; border-radius: 6px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px dotted #ddd; }
  .row span:first-child { color: #666; white-space: nowrap; }
  .msg { padding: 10px; border-radius: 6px; margin: 10px 0; display: none; }
  .msg.err { background: #fdecea; color: #922; display: block; }
  .msg.ok { background: #e9f7ef; color: #1e6b3b; display: block; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

  body.embed header, body.embed #logoutBtn { display: none; }
  @media (max-width: 640px) { nav button { flex: 1 1 auto; } main { padding: 10px; } table { font-size: 12px; } }

  table.t { width:100%; border-collapse:collapse; background:#fff; font-size:14px; }
  table.t th, table.t td { border-bottom:1px solid #e5e7eb; padding:8px 6px; text-align:left; vertical-align:top; }
  table.t th { background:#f1f5f9; font-size:13px; white-space:nowrap; }
  table.t tr.click { cursor:pointer; } table.t tr.click:hover { background:#f8fafc; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; } @media (max-width:640px){ .grid2 { grid-template-columns:1fr; } }
  .hint { color:#64748b; font-size:13px; margin-top:4px; }
  .chip { display:inline-block; background:#eef2ff; color:#3730a3; border-radius:12px; padding:3px 10px; margin:3px 4px 0 0; font-size:13px; cursor:pointer; }
  .tbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; } .tbar input, .tbar select { width:auto; flex:1 1 140px; margin:0; }
</style>
<link rel="stylesheet" href="/ui.css?v=1">
</head>
<body>
<header>
  <div><h1 style="margin:0">회원관리</h1><div id="who">불러오는 중…</div></div>
</header>
<nav id="topNav" data-sub style="display:none">
  <button data-tab="list" onclick="showList()">회원명단</button>
  <button data-tab="fees" class="sub" onclick="showFees()">회비 내역</button>
  <button data-tab="unpaid" class="sub" onclick="showUnpaid()">미납자</button>
  <button data-tab="import" id="btnImport" class="sub" onclick="showImport()" style="display:none">명단 가져오기</button>
  <button data-tab="sum" id="btnSum" class="sub" onclick="showSummary()" style="display:none">지회별 요약</button>
  <button id="logoutBtn" class="sub" onclick="logout()">로그아웃</button>
</nav>
<main>
  <div id="msg" class="msg"></div>
  <div id="view"></div>
</main>
<script>
const SUPABASE_URL = 'https://uamlualqqcqmpdkprjfs.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhbWx1YWxxcWNxbXBka3ByamZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwNjE0OTMsImV4cCI6MjExMDYzNzQ5M30._f4p4pfcKaYbmjKRXOPpkMo7Ydcc26oVVI6lRFYsLkY';
const EMBED = new URLSearchParams(location.search).get('embed') === '1';
if (EMBED) document.body.classList.add('embed');
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
async function rpc(name, a) { const { data, error } = await sb.rpc(name, a || {}); if (error) throw new Error(error.message || '오류가 났습니다.'); return data; }
const $ = id => document.getElementById(id);

// 화면 순서 지키기: 메뉴를 빨리 바꿔 누르면, 늦게 도착한 이전 화면이 지금 화면을 덮어쓰지 않게 함
let VTK = 0; function vtok() { return ++VTK; } function vw(t) { return t === VTK ? $('view') : document.createElement('div'); }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const won = n => Number(n || 0).toLocaleString('ko-KR') + '원';
function msg(text, type) { const m = $('msg'); m.textContent = text || ''; m.className = 'msg ' + (type || ''); if (text) window.scrollTo(0, 0); }
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
async function loginGoogle() {
  const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname, queryParams: { hd: 'gwdeaf.or.kr', prompt: 'select_account' } } });
  if (error) alert(error.message);
}
async function logout() { await sb.auth.signOut(); location.href = location.origin + location.pathname; }
function needLogin() {
  $('topNav').style.display = 'none';
  $('view').innerHTML = '<div class="card" style="cursor:default"><h2>로그인</h2><p>업무용 구글 계정(@gwdeaf.or.kr)으로 로그인하세요.</p><button onclick="loginGoogle()">구글 계정으로 로그인</button></div>';
}
function cannotUse(e) {
  $('topNav').style.display = 'none'; $('who').textContent = '';
  $('view').innerHTML = `<div class="card" style="cursor:default"><h2>사용할 수 없습니다</h2><p>${esc(e.message)}</p><button class="sub" onclick="logout()">다른 계정으로 로그인</button></div>`;
}
function setTab(id) { document.querySelectorAll('#topNav button[data-tab]').forEach(b => b.classList.toggle('sub', b.dataset.tab !== id)); }

// ===== 회원관리 =====
let ME = null, LIST = [];
const STATUS = ['활동', '휴회', '탈퇴'];
const HEAD_MAP = { '회원번호': 'member_no', '번호': 'member_no', '이름': 'name', '성명': 'name', '생년월일': 'birth', '성별': 'gender', '연락처': 'phone', '전화': 'phone', '전화번호': 'phone', '휴대폰': 'phone',
  '주소': 'address', '구분': 'category', '회원구분': 'category', '가입일': 'join_date', '입회일': 'join_date', '상태': 'status', '비고': 'note' };

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return needLogin();
  try {
    ME = await rpc('member_me');
    $('who').textContent = `${ME.chapter_name} · ${ME.name || ME.email}`;
    $('btnImport').style.display = ME.can_write ? '' : 'none';
    $('btnSum').style.display = ME.is_hq ? '' : 'none';
    if (!ME.can_view && !ME.is_hq) throw new Error('회원 권한이 없습니다. 지회 담당자에게 요청하세요.');
    $('topNav').style.display = 'flex';
    ME.can_view ? showList() : showSummary();
  } catch (e) { cannotUse(e); }
}
sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_IN' && !ME) init(); });

// ---- 회원명단 ----
async function showList(q, st) { const VT = vtok();
  setTab('list'); msg('');
  vw(VT).innerHTML = `<div class="tbar">
    <input id="mQ" placeholder="이름·연락처·회원번호" value="${esc(q || '')}" onkeydown="if(event.key==='Enter')showList(this.value,$('mSt').value)">
    <select id="mSt" onchange="showList($('mQ').value,this.value)"><option value="">전체 상태</option>${STATUS.map(s => `<option ${s === st ? 'selected' : ''}>${s}</option>`).join('')}</select>
    <button onclick="showList($('mQ').value,$('mSt').value)">검색</button>
    ${ME.can_write ? '<button onclick="editMember()">+ 회원 등록</button>' : ''}
    <button class="sub" onclick="downloadMembers()">엑셀(CSV) 받기</button></div><div id="mBody"><p>불러오는 중…</p></div>`;
  try {
    LIST = await rpc('member_list', { p_q: q || null, p_status: st || null });
    const cnt = s => LIST.filter(m => m.status === s).length;
    $('mBody').innerHTML = `<div class="hint" style="margin-bottom:6px">총 ${LIST.length}명 · 활동 ${cnt('활동')} · 휴회 ${cnt('휴회')} · 탈퇴 ${cnt('탈퇴')}</div>` + (!LIST.length ? '<p>회원이 없습니다.</p>' :
      `<div style="overflow-x:auto"><table class="t"><thead><tr><th>회원번호</th><th>이름</th><th>생년월일</th><th>연락처</th><th>구분</th><th>가입일</th><th>상태</th><th>입회비</th><th>올해 납부</th></tr></thead><tbody>${
      LIST.map(m => `<tr class="click" onclick="showMember(${m.id})"><td>${esc(m.member_no)}</td><td><b>${esc(m.name)}</b></td><td>${esc(m.birth)}</td><td>${esc(m.phone)}</td><td>${esc(m.category)}</td><td>${esc(m.join_date || '')}</td>
        <td><span class="badge ${m.status === '활동' ? 'ok' : (m.status === '탈퇴' ? 'cancel' : '')}">${esc(m.status)}</span></td><td>${m.joined_fee ? '✅' : '-'}</td><td>${m.paid_this_year ? won(m.paid_this_year) : '-'}</td></tr>`).join('')}</tbody></table></div>`);
  } catch (e) { $('mBody').innerHTML = `<p>${esc(e.message)}</p>`; }
}
function downloadMembers() {
  const rows = [['회원번호', '이름', '생년월일', '성별', '연락처', '주소', '구분', '가입일', '상태', '탈퇴일', '비고']].concat(LIST.map(m => [m.member_no, m.name, m.birth, m.gender, m.phone, m.address, m.category, m.join_date, m.status, m.leave_date, m.note]));
  const csv = '﻿' + rows.map(r => r.map(c => '"' + String(c ?? '').replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = '회원명단.csv'; a.click();
}
async function showMember(id) { const VT = vtok();
  const m = LIST.find(x => x.id === id); if (!m) return;
  msg('');
  const rows = [['회원번호', m.member_no], ['이름', m.name], ['생년월일', m.birth], ['성별', m.gender], ['연락처', m.phone], ['주소', m.address], ['구분', m.category], ['가입일', m.join_date], ['상태', m.status], ['탈퇴일', m.leave_date], ['비고', m.note]];
  vw(VT).innerHTML = `<div class="card" style="cursor:default">${rows.map(r => `<div class="row"><span>${r[0]}</span><span>${esc(r[1] || '')}</span></div>`).join('')}
    <div class="actions">${ME.can_write ? `<button onclick="editMember(${id})">수정</button>` : ''}<button class="sub" onclick="openPrint(${id}, 'cert')">🧾 회비 납부 증명서</button><button class="sub" onclick="openPrint(${id}, 'card')">🪪 회원관리카드</button><button class="sub" onclick="showList()">목록</button></div></div>
    <div class="card" style="cursor:default"><b>입회비·회비 납부</b>
    ${ME.can_write ? `<div class="grid2">
      <div><label>종류</label><select id="fKind"><option>회비</option><option>입회비</option><option>기타</option></select></div>
      <div><label>해당 연도</label><input id="fYear" type="number" value="${ME.year}"></div>
      <div><label>금액(원)</label><input id="fAmt" type="number" min="1" placeholder="예) 50000"></div>
      <div><label>납부일</label><input id="fDate" type="date" value="${todayStr()}"></div>
      <div><label>납부 방법</label><select id="fMethod"><option>계좌이체</option><option>현금</option><option>카드</option><option>기타</option></select></div>
      <div><label>메모</label><input id="fNote"></div></div>
      <div class="actions"><button onclick="addFee(${id})">납부 기록</button></div>` : ''}
    <div id="fList" style="margin-top:10px"><p>불러오는 중…</p></div></div>
    <div class="card" style="cursor:default"><b>📈 사업 참여 이력</b> <span class="hint">사업실적에 참여자로 기록된 사업 · 행사 (모든 연도)</span>
      <div class="tbar" style="margin-top:8px"><input id="hQ" placeholder="사업명 · 장소 · 내용 검색" oninput="drawHist()"><select id="hY" onchange="drawHist()"><option value="">전체 연도</option></select></div>
      <div id="hList"><p>불러오는 중…</p></div></div>`;
  loadFees(id); loadHist(id);
}
// ── 출력: 회비 납부 증명서 · 회원관리카드 (member/print.html 이 이 자료를 읽어서 그림) ──
window.MEMBER_PRINT = null;
async function openPrint(id, doc) {
  const w = window.open('', '_blank'); if (!w) return msg('팝업이 막혀 있습니다. 브라우저에서 팝업을 허용해 주세요.', 'err');
  try { window.MEMBER_PRINT = await rpc('member_doc_info', { p_member: id, p_kind: doc }); }
  catch (e) { w.close(); return msg(e.message, 'err'); }
  w.location.href = 'print.html?doc=' + doc;
}

// 회원별 사업 참여 이력 (사업실적과 같은 자료)
let HIST = [];
async function loadHist(id) {
  try { HIST = await rpc('member_perf_history', { p_member: id }); }
  catch (e) { $('hList').innerHTML = `<p class="hint">${esc(e.message)}</p>`; return; }
  const ys = [...new Set(HIST.map(h => String(h.held_on).slice(0, 4)))].sort().reverse();
  $('hY').innerHTML = '<option value="">전체 연도</option>' + ys.map(y => `<option value="${y}">${y}년 (${HIST.filter(h => String(h.held_on).startsWith(y)).length}회)</option>`).join('');
  drawHist();
}
function drawHist() {
  const q = ($('hQ').value || '').trim(), y = $('hY').value;
  const list = HIST.filter(h => (!y || String(h.held_on).startsWith(y)) && (!q || [h.project_name, h.place, h.content, h.category].some(v => String(v || '').includes(q))));
  if (!HIST.length) { $('hList').innerHTML = '<p class="hint">참여 기록이 없습니다. 사업실적 → 사업실적 등록에서 이 회원을 참여자로 체크하면 여기에 나옵니다.</p>'; return; }
  const nP = new Set(list.map(h => h.project_name)).size;
  $('hList').innerHTML = `<p class="hint" style="margin:4px 0 8px">참여 <b>${list.length}회</b> · 사업 <b>${nP}개</b>${y || q ? ' (골라 본 결과)' : ''}</p>
    <div style="overflow-x:auto"><table class="t"><thead><tr><th>날짜</th><th>사업 · 행사</th><th>분류</th><th>회차</th><th>장소</th><th>내용</th></tr></thead><tbody>${
    list.map(h => `<tr><td style="white-space:nowrap">${esc(h.held_on)}${h.start_time ? ' ' + esc(h.start_time) : ''}</td><td><b>${esc(h.project_name)}</b></td><td>${esc(h.category || '-')}</td><td>${h.round_no}회</td><td>${esc(h.place || '-')}</td><td>${esc(h.content || '-')}</td></tr>`).join('') || '<tr><td colspan="6" class="hint">찾는 기록이 없습니다.</td></tr>'}</tbody></table></div>`;
}
async function loadFees(id) {
  try {
    const f = await rpc('member_fee_list', { p_member: id, p_year: null });
    $('fList').innerHTML = !f.length ? '<p>납부 내역이 없습니다.</p>' : feeTable(f, false);
  } catch (e) { $('fList').innerHTML = `<p>${esc(e.message)}</p>`; }
}
function feeTable(f, withName) {
  return `<div style="overflow-x:auto"><table class="t"><thead><tr><th>납부일</th>${withName ? '<th>이름</th>' : ''}<th>종류</th><th>연도</th><th>금액</th><th>방법</th><th>메모</th><th>상태</th>${ME.can_write ? '<th></th>' : ''}</tr></thead><tbody>${
    f.map(x => `<tr><td>${esc(x.paid_date)}</td>${withName ? `<td>${esc(x.name)}</td>` : ''}<td>${esc(x.kind)}</td><td>${x.year}</td><td style="text-align:right">${won(x.amount)}</td><td>${esc(x.method)}</td><td>${esc(x.note)}</td>
      <td><span class="badge ${x.status === '취소' ? 'cancel' : 'ok'}">${esc(x.status)}</span></td>${ME.can_write ? `<td>${x.status === '납부' ? `<button class="sub" style="padding:4px 8px;font-size:13px" onclick="cancelFee(${x.id},${withName ? 'null' : x.member_id})">취소</button>` : ''}</td>` : ''}</tr>`).join('')}</tbody></table></div>`;
}
async function addFee(id) {
  try {
    await rpc('member_fee_add', { p_member: id, p_kind: $('fKind').value, p_year: Number($('fYear').value) || null, p_amount: Number($('fAmt').value) || 0, p_date: $('fDate').value, p_method: $('fMethod').value, p_note: $('fNote').value });
    msg('✅ 기록했습니다.', 'ok'); $('fAmt').value = ''; $('fNote').value = ''; loadFees(id);
  } catch (e) { msg(e.message, 'err'); }
}
async function cancelFee(fid, memberId) {
  const r = prompt('취소 사유를 입력하세요. (취소해도 기록은 남습니다)'); if (r === null) return;
  try { await rpc('member_fee_cancel', { p_id: fid, p_reason: r }); msg('취소했습니다.', 'ok'); memberId ? loadFees(memberId) : showFees(); } catch (e) { msg(e.message, 'err'); }
}
function editMember(id) {
  vtok();
  const m = LIST.find(x => x.id === id) || { status: '활동', category: '정회원' };
  const inp = (k, label, type, ph) => `<div><label>${label}</label><input id="e_${k}" type="${type || 'text'}" value="${esc(m[k] || '')}" placeholder="${ph || ''}"></div>`;
  $('view').innerHTML = `<div class="card" style="cursor:default"><b>${id ? '회원 수정' : '회원 등록'}</b><div class="grid2">
    ${inp('name', '이름 *')}${inp('member_no', '회원번호')}${inp('birth', '생년월일', 'text', '예) 1980-05-01')}
    <div><label>성별</label><select id="e_gender">${['', '남', '여'].map(v => `<option ${v === (m.gender || '') ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
    ${inp('phone', '연락처')}${inp('category', '구분', 'text', '정회원 / 준회원 / 후원회원')}${inp('join_date', '가입일', 'date')}
    <div><label>상태</label><select id="e_status">${STATUS.map(v => `<option ${v === m.status ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
    ${inp('leave_date', '탈퇴일', 'date')}</div>
    <label>주소</label><input id="e_address" value="${esc(m.address || '')}">
    <label>비고</label><textarea id="e_note" rows="2">${esc(m.note || '')}</textarea>
    <div class="hint">주민등록번호는 적지 마세요.</div>
    <div class="actions"><button onclick="saveMember(${id || 'null'})">저장</button><button class="sub" onclick="${id ? `showMember(${id})` : 'showList()'}">취소</button></div></div>`;
}
async function saveMember(id) {
  const p = { id: id || '' };
  ['name', 'member_no', 'birth', 'gender', 'phone', 'category', 'join_date', 'status', 'leave_date', 'address', 'note'].forEach(k => p[k] = $('e_' + k).value);
  try { const rid = await rpc('member_save', { p }); msg('✅ 저장했습니다.', 'ok'); LIST = await rpc('member_list', {}); showMember(rid); } catch (e) { msg(e.message, 'err'); }
}

// ---- 회비 내역 ----
async function showFees(y) { const VT = vtok();
  setTab('fees'); msg(''); y = y || ME.year;
  vw(VT).innerHTML = `<div class="tbar"><select id="feeY" onchange="showFees(this.value)">${[0, 1, 2, 3].map(i => { const v = ME.year - i; return `<option ${String(v) === String(y) ? 'selected' : ''} value="${v}">${v}년</option>`; }).join('')}</select></div><div id="feeBody"><p>불러오는 중…</p></div>`;
  try {
    const f = await rpc('member_fee_list', { p_member: null, p_year: Number(y) });
    const ok = f.filter(x => x.status === '납부'), sum = k => ok.filter(x => !k || x.kind === k).reduce((a, x) => a + Number(x.amount), 0);
    $('feeBody').innerHTML = `<div class="card" style="cursor:default">합계 <b>${won(sum())}</b> · 입회비 ${won(sum('입회비'))} · 회비 ${won(sum('회비'))} · 기타 ${won(sum('기타'))}</div>` + (!f.length ? '<p>내역이 없습니다.</p>' : feeTable(f, true));
  } catch (e) { $('feeBody').innerHTML = `<p>${esc(e.message)}</p>`; }
}
// ---- 미납자 ----
async function showUnpaid(y) { const VT = vtok();
  setTab('unpaid'); msg(''); y = y || ME.year;
  vw(VT).innerHTML = `<div class="tbar"><select onchange="showUnpaid(this.value)">${[0, 1, 2].map(i => { const v = ME.year - i; return `<option ${String(v) === String(y) ? 'selected' : ''} value="${v}">${v}년</option>`; }).join('')}</select><span class="hint">활동 회원 중 이 해 '회비' 납부 기록이 없는 사람</span></div><div id="uBody"><p>불러오는 중…</p></div>`;
  try {
    const u = await rpc('member_unpaid', { p_year: Number(y) });
    if (!LIST.length) LIST = await rpc('member_list', {});
    $('uBody').innerHTML = !u.length ? '<p>미납자가 없습니다. 👍</p>' : `<div class="hint">${u.length}명</div><table class="t"><thead><tr><th>이름</th><th>연락처</th><th>구분</th></tr></thead><tbody>${u.map(m => `<tr class="click" onclick="showMember(${m.id})"><td>${esc(m.name)}</td><td>${esc(m.phone)}</td><td>${esc(m.category)}</td></tr>`).join('')}</tbody></table>`;
  } catch (e) { $('uBody').innerHTML = `<p>${esc(e.message)}</p>`; }
}
// ---- 명단 가져오기 ----
function showImport() {
  vtok();
  setTab('import'); msg('');
  $('view').innerHTML = `<div class="card" style="cursor:default"><b>엑셀·구글 시트 명단 가져오기</b>
    <div class="hint">1) 엑셀에서 <b>제목 줄을 포함해</b> 표를 복사(Ctrl+C) → 2) 아래 칸에 붙여넣기(Ctrl+V) → 3) [확인]<br>
    알아듣는 제목: 회원번호, 이름(성명), 생년월일, 성별, 연락처(전화번호), 주소, 구분, 가입일(입회일), 상태, 비고 — 다른 제목의 열은 무시합니다.<br>
    같은 이름+연락처가 이미 있으면 건너뜁니다. 주민등록번호 열은 빼고 복사하세요.</div>
    <textarea id="imp" rows="10" placeholder="여기에 붙여넣기"></textarea>
    <div class="actions"><button onclick="checkImport()">확인</button></div><div id="impPrev"></div></div>`;
}
let IMP = [];
function checkImport() {
  const lines = $('imp').value.replace(/\r/g, '').split('\n').filter(l => l.trim());
  if (lines.length < 2) return msg('제목 줄과 명단을 함께 붙여넣으세요.', 'err');
  const head = lines[0].split('\t').map(h => HEAD_MAP[h.replace(/\s/g, '')] || '');
  if (head.indexOf('name') < 0) return msg("제목 줄에 '이름' 또는 '성명' 열이 있어야 합니다.", 'err');
  if (lines[0].indexOf('주민') >= 0) return msg('주민등록번호 열은 빼고 다시 복사해 주세요.', 'err');
  IMP = lines.slice(1).map(l => { const c = l.split('\t'), o = {}; head.forEach((k, i) => { if (k) o[k] = (c[i] || '').trim(); });
    if (o.join_date) o.join_date = o.join_date.replace(/[.\/]/g, '-').replace(/-$/, '').replace(/-(\d)(?=-|$)/g, '-0$1');
    return o; }).filter(o => o.name);
  msg('');
  $('impPrev').innerHTML = `<p><b>${IMP.length}명</b>을 읽었습니다. 앞 5명:</p><table class="t"><tr><th>이름</th><th>연락처</th><th>가입일</th><th>구분</th></tr>${IMP.slice(0, 5).map(o => `<tr><td>${esc(o.name)}</td><td>${esc(o.phone || '')}</td><td>${esc(o.join_date || '')}</td><td>${esc(o.category || '')}</td></tr>`).join('')}</table>
    <div class="actions"><button onclick="doImport()">${IMP.length}명 등록하기</button></div>`;
}
async function doImport() {
  try { const r = await rpc('member_import', { p_rows: IMP }); msg(`✅ ${r.added}명 등록 · 이미 있어 건너뜀 ${r.skipped}명${r.bad ? ' · 이름 없음 ' + r.bad + '줄' : ''}`, 'ok'); LIST = []; $('impPrev').innerHTML = ''; $('imp').value = ''; }
  catch (e) { msg(e.message, 'err'); }
}
// ---- 도협회: 지회별 요약 ----
async function showSummary() { const VT = vtok();
  setTab('sum'); msg('');
  try {
    const s = await rpc('member_province_summary');
    const t = k => s.reduce((a, x) => a + Number(x[k]), 0);
    vw(VT).innerHTML = `<div class="hint" style="margin-bottom:6px">지회별 인원 수와 올해 납부 합계만 보입니다. (명단·인적사항은 각 지회만 볼 수 있음)</div>
      <table class="t"><thead><tr><th>지회</th><th>활동</th><th>휴회</th><th>탈퇴</th><th>올해 납부 합계</th></tr></thead><tbody>${
      s.map(x => `<tr><td>${esc(x.chapter)}</td><td>${x.active}</td><td>${x.rest}</td><td>${x.left}</td><td style="text-align:right">${won(x.fee_year)}</td></tr>`).join('')}
      <tr style="font-weight:bold"><td>합계</td><td>${t('active')}</td><td>${t('rest')}</td><td>${t('left')}</td><td style="text-align:right">${won(t('fee_year'))}</td></tr></tbody></table>`;
  } catch (e) { vw(VT).innerHTML = `<p>${esc(e.message)}</p>`; }
}
init();
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>직원·권한 관리 · 강원특별자치도농아인협회 업무 시스템</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;background:#f4f2ee;color:#222;font-size:15px}
.wrap{max-width:860px;margin:0 auto;padding:14px}
h1{font-size:19px;margin:0}
h2{font-size:16px;margin:0 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.card{background:#fff;border:1px solid #ddd8cc;border-radius:10px;padding:12px;margin-bottom:10px}
.muted{color:#777;font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{flex:1;min-width:90px;padding:9px;border:1px solid #cfc9bb;background:#fff;border-radius:8px;font-size:14px}
.tabs button.on{background:#3b5bdb;color:#fff;border-color:#3b5bdb}
button{font:inherit;cursor:pointer}
.btn{padding:8px 12px;border:1px solid #3b5bdb;background:#3b5bdb;color:#fff;border-radius:8px}
.btn.sub{background:#fff;color:#3b5bdb}
.btn.red{background:#fff;color:#c92a2a;border-color:#c92a2a}
.btn.sm{padding:5px 9px;font-size:13px}
input,select{font:inherit;padding:8px;border:1px solid #cfc9bb;border-radius:8px;width:100%;background:#fff}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid .full{grid-column:1/3}
.badge{display:inline-block;font-size:12px;padding:2px 7px;border-radius:10px;background:#e7ecff;color:#3b5bdb;margin-left:4px}
.badge.g{background:#e6f6ea;color:#2b8a3e}.badge.x{background:#f1f1f1;color:#777}.badge.o{background:#fff1dc;color:#d9480f}
.st{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.off{opacity:.55}
.perm{background:#faf9f6;border-radius:8px;padding:8px;margin-top:8px}
.perm b{display:block;margin:6px 0 2px;font-size:13px;color:#555}
.perm label{display:flex;gap:6px;align-items:center;padding:3px 0}
.perm input{width:auto}
table.ap{border-collapse:collapse;font-size:12px;margin:6px 0}
table.ap td{border:1px solid #333;padding:3px 10px;text-align:center;min-width:56px}
table.ap td.h{background:#f0f0f0;font-weight:700;writing-mode:vertical-rl}
table.ap tr.s td{height:30px}
table.log{width:100%;border-collapse:collapse;font-size:13px}
table.log td,table.log th{border-bottom:1px solid #eee;padding:5px;text-align:left;vertical-align:top}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;display:none;max-width:90%;z-index:9}
#toast.bad{background:#c92a2a}
.center{text-align:center;padding:40px 10px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center muted">불러오는 중…</div></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===== 권한 관리 (구글 로그인 · 직원 등록 · 권한 부여 · 결재라인) ===== */
const SB_URL = "https://uamlualqqcqmpdkprjfs.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhbWx1YWxxcWNxbXBka3ByamZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwNjE0OTMsImV4cCI6MjExMDYzNzQ5M30._f4p4pfcKaYbmjKRXOPpkMo7Ydcc26oVVI6lRFYsLkY";
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SYS = {core:"관리", vehicle:"차량운행", edu:"수어교육", att:"근태"};
const ROLE = {admin:"도협회 관리자", lead:"지회 담당", staff:"직원"};
const ACT = {add_staff:"직원 등록", update_staff:"직원 정보 수정", enable_staff:"사용 재개", disable_staff:"사용 중지", grant:"권한 부여", revoke:"권한 해제",
             save_approval:"결재라인 저장", delete_approval:"결재라인 삭제", assign_lead:"지회 담당 지정", set_admin:"도협회 관리자 변경"};
const DEFAULT_AP = ["부장","사무처장","본부장"];
let me = null, tab = "staff", staff = [], catalog = [], lines = [], chapters = [], logs = [];
let openId = null, editId = null, drafts = {}, deptKeys = [];

function toast(msg, bad){ const t = $("#toast"); t.textContent = msg; t.className = bad ? "bad" : ""; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(()=>{ t.style.display = "none"; }, 2600); }
async function rpc(fn, args){ const r = await sb.rpc(fn, args || {}); if(r.error) throw new Error(r.error.message); return r.data; }
async function act(fn, args, okMsg, after){ try{ await rpc(fn, args); if(okMsg) toast(okMsg); if(after) await after(); }catch(e){ toast(e.message, true); } }

/* ---------- 시작 · 로그인 ---------- */
async function boot(){
  const s = await sb.auth.getSession();
  if(!s.data.session) return loginView();
  try{ me = await rpc("whoami"); }catch(e){ return msgView("불러오지 못했습니다", e.message, true); }
  if(!me.ok) return blockedView();
  catalog = await rpc("get_catalog");
  tab = me.can_manage ? "staff" : "me";
  if(me.can_manage) await loadStaff();
  render();
}
function loginView(){
  $("#app").innerHTML = `<div class="center"><h1>강원특별자치도농아인협회 업무 시스템</h1><p class="muted">업무용 구글 계정으로 로그인하세요.</p>
    <button class="btn" onclick="login()">구글 계정으로 로그인</button></div>`;
}
async function login(){
  const r = await sb.auth.signInWithOAuth({provider:"google", options:{redirectTo: location.origin + location.pathname}});
  if(r.error) toast(r.error.message, true);
}
async function logout(){ await sb.auth.signOut(); location.reload(); }
function msgView(title, text, bad){
  $("#app").innerHTML = `<div class="center"><h2>${esc(title)}</h2><p class="${bad?"":"muted"}">${esc(text)}</p><button class="btn sub" onclick="logout()">다른 계정으로 로그인</button></div>`;
}
function blockedView(){
  const m = {not_registered:"이 계정은 아직 등록되지 않았습니다. 지회 담당자에게 이메일 등록을 요청하세요.",
             inactive:"이 계정은 사용이 중지되어 있습니다. 지회 담당자에게 문의하세요.",
             bad_domain:"허용되지 않은 이메일 도메인입니다. 업무용 계정으로 로그인하세요."};
  msgView("접속할 수 없습니다", (m[me.reason] || "로그인 정보를 확인할 수 없습니다.") + (me.email ? "  (" + me.email + ")" : ""));
}

/* ---------- 화면 ---------- */
function render(){
  const tabs = me.can_manage ? [["staff","직원·권한"],["lines","결재라인"],["log","변경 기록"]] : [];
  if(me.role === "admin") tabs.push(["chapters","지회 담당 지정"]);
  tabs.push(["me","내 권한"]);
  $("#app").innerHTML = `<div class="top"><div><h1>${esc(me.chapter_name)} · ${esc(me.name)}</h1>
      <div class="muted">${esc(me.email)} <span class="badge">${ROLE[me.role]}</span>${me.role==="staff"&&me.can_manage?'<span class="badge o">공동 관리자</span>':""}</div></div>
      <div><a class="btn sub sm" href="/" style="text-decoration:none;display:inline-block">🏠 홈으로</a> <button class="btn sub sm" onclick="logout()">로그아웃</button></div></div>
    <div class="tabs">${tabs.map(t=>`<button class="${tab===t[0]?"on":""}" onclick="go('${t[0]}')">${t[1]}</button>`).join("")}</div>
    <div id="body"></div>`;
  ({staff:staffView, lines:linesView, log:logView, chapters:chaptersView, me:meView}[tab] || meView)();
}
async function go(t){
  tab = t;
  try{
    if(t==="staff") await loadStaff();
    else if(t==="lines"){ await loadStaff(); lines = await rpc("get_approval_lines"); drafts = {}; }
    else if(t==="log") logs = await rpc("get_access_log", {p_limit:100});
    else if(t==="chapters") chapters = await rpc("list_chapters");
  }catch(e){ toast(e.message, true); }
  render();
}
async function loadStaff(){ staff = await rpc("list_staff"); }
function permLabel(k){ const c = catalog.find(x=>x.system+"."+x.perm===k); return c ? c.label : k; }

/* 내 권한 */
function meView(){
  const by = {}; me.perms.forEach(k=>{ const s = k.split(".")[0]; (by[s] = by[s] || []).push(k); });
  $("#body").innerHTML = `<div class="card"><h2>내 정보</h2><div>${esc(me.chapter_name)} · ${esc(me.dept||"부서 없음")} · ${esc(me.position||"직위 없음")}</div></div>
    <div class="card"><h2>내 권한</h2>${me.role!=="staff"?'<div class="muted">담당자는 우리 지회의 모든 기능을 사용할 수 있습니다.</div>':""}
    ${Object.keys(by).length? Object.keys(by).map(s=>`<b>${SYS[s]||s}</b><ul>${by[s].map(k=>`<li>${esc(permLabel(k))}</li>`).join("")}</ul>`).join("") : '<div class="muted">부여된 권한이 없습니다. 필요하면 지회 담당자에게 요청하세요. (근태 본인 신청은 모든 직원이 사용할 수 있습니다.)</div>'}</div>`;
}

/* 직원·권한 */
function staffView(){
  const mgr = me.role==="admin" || me.role==="lead";
  $("#body").innerHTML = `<div class="card"><h2>직원 등록</h2><div class="muted" style="margin-bottom:6px">업무용 구글 이메일로 등록하면, 그 직원이 구글 로그인으로 들어올 수 있습니다.</div>
    <div class="grid"><input id="n_email" class="full" placeholder="이메일 (예: name@도메인)" autocomplete="off"><input id="n_name" placeholder="이름"><input id="n_dept" placeholder="부서"><input id="n_pos" class="full" placeholder="직위">
    <button class="btn full" onclick="addStaff()">등록</button></div></div>
    ${staff.map(s=>staffCard(s, mgr)).join("") || '<div class="muted center">등록된 직원이 없습니다.</div>'}`;
}
function staffCard(s, mgr){
  const self = s.email === me.email, lead = s.role !== "staff", off = !s.active;
  if(editId === s.id) return `<div class="card"><div class="grid"><input id="e_name" value="${esc(s.name)}" placeholder="이름"><input id="e_dept" value="${esc(s.dept)}" placeholder="부서"><input id="e_pos" class="full" value="${esc(s.position)}" placeholder="직위">
      <button class="btn" onclick="saveEdit(${s.id})">저장</button><button class="btn sub" onclick="editId=null;render()">취소</button></div></div>`;
  const groups = {}; catalog.forEach(c=>{ (groups[c.system] = groups[c.system] || []).push(c); });
  const panel = openId === s.id && !lead ? `<div class="perm">${Object.keys(groups).map(sys=>`<b>${SYS[sys]||sys}</b>${groups[sys].map(c=>{
      const k = c.system+"."+c.perm, on = s.grants.includes(k), dis = c.system==="core" && !mgr;
      return `<label><input type="checkbox" ${on?"checked":""} ${dis?"disabled":""} onchange="grant(${s.id},'${c.system}','${c.perm}',this.checked)">${esc(c.label)}</label>`; }).join("")}`).join("")}</div>` : "";
  return `<div class="card ${off?"off":""}"><div class="st"><div><b>${esc(s.name)}</b> <span class="muted">${esc(s.position)} ${esc(s.dept)}</span>
      <span class="badge ${lead?"":"g"}">${ROLE[s.role]}</span>${off?'<span class="badge x">사용 중지</span>':""}${s.grants.includes("core.manage_staff")?'<span class="badge o">공동 관리자</span>':""}
      <div class="muted">${esc(s.email)}</div>${lead?'<div class="muted">담당자는 모든 권한을 가집니다.</div>':`<div class="muted">부여된 권한 ${s.grants.length}개</div>`}</div>
      <div class="row">${lead?"":`<button class="btn sub sm" onclick="openId=(openId===${s.id}?null:${s.id});render()">권한</button>`}
      <button class="btn sub sm" onclick="editId=${s.id};render()">수정</button>
      ${!self && !lead ? `<button class="btn ${off?"sub":"red"} sm" onclick="toggleActive(${s.id},${off})">${off?"사용 재개":"사용 중지"}</button>`:""}
      ${me.role==="admin" && s.role==="admin" && !self ? `<button class="btn red sm" onclick="dropAdmin('${esc(s.email)}')">관리자 해제</button>`:""}</div></div>${panel}</div>`;
}
const val = id => ($("#"+id) ? $("#"+id).value.trim() : "");
function addStaff(){ act("add_staff", {p_email:val("n_email"), p_name:val("n_name"), p_dept:val("n_dept"), p_position:val("n_pos")}, "등록했습니다.", async()=>{ await loadStaff(); render(); }); }
function saveEdit(id){ act("update_staff", {p_id:id, p_name:val("e_name"), p_dept:val("e_dept"), p_position:val("e_pos")}, "수정했습니다.", async()=>{ editId = null; await loadStaff(); render(); }); }
function toggleActive(id, on){ if(!on && !confirm("이 직원의 사용을 중지할까요? 다음 접속부터 바로 막힙니다.")) return; act("set_staff_active", {p_id:id, p_active:on}, on?"사용을 재개했습니다.":"사용을 중지했습니다.", async()=>{ await loadStaff(); render(); }); }
async function grant(id, sys, perm, on){
  try{ await rpc("set_grant", {p_id:id, p_system:sys, p_perm:perm, p_on:on}); const s = staff.find(x=>x.id===id), k = sys+"."+perm;
       s.grants = on ? s.grants.concat(k) : s.grants.filter(x=>x!==k); toast(on?"권한을 부여했습니다.":"권한을 해제했습니다."); render(); }
  catch(e){ toast(e.message, true); await loadStaff(); render(); }
}
function dropAdmin(email){ if(confirm("이 사람의 도협회 관리자 권한을 해제할까요?")) act("set_admin", {p_email:email, p_name:"", p_on:false}, "해제했습니다.", async()=>{ await loadStaff(); render(); }); }

/* 결재라인 */
function linesView(){
  const set = {}; staff.forEach(s=>{ if(s.dept) set[s.dept] = 1; }); lines.forEach(l=>{ set[l.dept] = 1; }); Object.keys(drafts).forEach(d=>{ set[d] = 1; });
  deptKeys = Object.keys(set).sort();
  $("#body").innerHTML = `<div class="card"><div class="muted">부서별로 결재칸(1~5칸)의 직책 이름과 수신처를 정합니다. 휴가·출장·시간외 등 모든 신청서를 인쇄할 때 이 설정이 쓰입니다.</div>
    <div class="row" style="margin-top:8px"><input id="nd" placeholder="새 부서 이름" style="flex:1"><button class="btn sub sm" onclick="addDept()">부서 추가</button></div></div>
    ${deptKeys.map((d,i)=>deptCard(d,i)).join("") || '<div class="muted center">직원에 부서를 입력하면 여기에 나타납니다.</div>'}`;
}
function draftOf(d){
  if(!drafts[d]){ const l = lines.find(x=>x.dept===d); drafts[d] = {saved:!!l, ap:l ? l.approvers.slice() : DEFAULT_AP.slice(), to:l ? l.addressee : ""}; }
  return drafts[d];
}
function deptCard(d, i){
  const x = draftOf(d);
  return `<div class="card"><div class="st"><h2>${esc(d)} ${x.saved?'<span class="badge g">저장됨</span>':'<span class="badge o">저장 전</span>'}</h2><div class="row">
      <button class="btn sub sm" onclick="apAdd(${i})" ${x.ap.length>=5?"disabled":""}>＋ 칸 추가</button><button class="btn sub sm" onclick="apDel(${i})" ${x.ap.length<=1?"disabled":""}>－ 칸 줄이기</button></div></div>
    <div class="row" style="margin:8px 0">${x.ap.map((a,k)=>`<input style="flex:1;min-width:80px" value="${esc(a)}" placeholder="직책" oninput="drafts[deptKeys[${i}]].ap[${k}]=this.value;prev(${i})">`).join("")}</div>
    <input value="${esc(x.to)}" placeholder="수신처 (예: 강원특별자치도수어통역센터장 귀하)" oninput="drafts[deptKeys[${i}]].to=this.value">
    <div id="pv${i}">${previewHTML(x.ap)}</div>
    <div class="row"><button class="btn" onclick="apSave(${i})">저장</button>${x.saved?`<button class="btn red" onclick="apRemove(${i})">삭제</button>`:""}</div></div>`;
}
function previewHTML(ap){
  const a = ap.map(v=>v.trim()).filter(Boolean);
  return `<table class="ap"><tr><td class="h" rowspan="2">결재</td>${a.map(v=>`<td>${esc(v)}</td>`).join("")}</tr><tr class="s">${a.map(()=>"<td></td>").join("")}</tr></table>`;
}
function prev(i){ const el = $("#pv"+i); if(el) el.innerHTML = previewHTML(drafts[deptKeys[i]].ap); }
function addDept(){ const d = val("nd"); if(!d) return toast("부서 이름을 입력하세요.", true); draftOf(d); linesView(); }
function apAdd(i){ const x = drafts[deptKeys[i]]; if(x.ap.length < 5) x.ap.push(""); linesView(); }
function apDel(i){ const x = drafts[deptKeys[i]]; if(x.ap.length > 1) x.ap.pop(); linesView(); }
function apSave(i){ const d = deptKeys[i], x = drafts[d]; act("save_approval_line", {p_dept:d, p_approvers:x.ap, p_addressee:x.to}, "저장했습니다.", async()=>{ lines = await rpc("get_approval_lines"); drafts = {}; linesView(); }); }
function apRemove(i){ const d = deptKeys[i]; if(confirm(d + " 부서의 결재라인을 삭제할까요?")) act("delete_approval_line", {p_dept:d}, "삭제했습니다.", async()=>{ lines = await rpc("get_approval_lines"); drafts = {}; linesView(); }); }

/* 변경 기록 */
function logView(){
  $("#body").innerHTML = `<div class="card"><table class="log"><tr><th>일시</th><th>처리자</th><th>내용</th></tr>${logs.map(l=>`<tr><td>${esc(l.at)}</td><td>${esc(l.actor)}</td><td><b>${esc(ACT[l.action]||l.action)}</b> ${esc(l.target)}<div class="muted">${esc(l.detail)}</div></td></tr>`).join("") || '<tr><td colspan="3" class="muted">기록이 없습니다.</td></tr>'}</table></div>`;
}

/* 지회 담당 지정 (도협회 관리자) */
function chaptersView(){
  $("#body").innerHTML = `<div class="card"><h2>도협회 관리자 추가</h2><div class="grid"><input id="a_email" placeholder="이메일"><input id="a_name" placeholder="이름"><button class="btn full" onclick="addAdmin()">관리자로 지정</button></div></div>
    ${chapters.filter(c=>!c.is_hq).map(c=>`<div class="card"><div class="st"><div><b>${esc(c.name)}</b> <span class="muted">직원 ${c.staff_count}명</span>
      <div>${c.lead_email?`지회 담당: <b>${esc(c.lead_name)}</b> <span class="muted">${esc(c.lead_email)}</span>`:'<span class="badge o">담당자 없음</span>'}</div></div></div>
      <div class="grid" style="margin-top:6px"><input id="l_e${c.id}" placeholder="새 담당 이메일"><input id="l_n${c.id}" placeholder="이름 (처음 등록할 때)"><button class="btn full" onclick="setLead(${c.id})">${c.lead_email?"담당자 교체":"담당자 지정"}</button></div></div>`).join("")}`;
}
function setLead(id){ if(!confirm("지회 담당을 지정할까요? 기존 담당자는 일반 직원으로 바뀝니다.")) return;
  act("assign_lead", {p_chapter:id, p_email:val("l_e"+id), p_name:val("l_n"+id)}, "지정했습니다.", async()=>{ chapters = await rpc("list_chapters"); chaptersView(); }); }
function addAdmin(){ act("set_admin", {p_email:val("a_email"), p_name:val("a_name"), p_on:true}, "지정했습니다.", async()=>{ await loadStaff(); toast("지정했습니다."); chaptersView(); }); }

sb.auth.onAuthStateChange((ev)=>{ if(ev === "SIGNED_OUT") loginView(); });
boot();
</script>
</body>
</html>

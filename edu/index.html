<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<script>try{if(window.top!==window)document.documentElement.classList.add("embed")}catch(e){document.documentElement.classList.add("embed")}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강원 수어교육 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
html.embed #topLogout{display:none!important}
/* 홈 화면 안에 끼울 때: 초록 띠와 자체 왼쪽 메뉴는 홈 메뉴와 겹치므로 숨김 */
html.embed .tabs{display:none!important}
html.embed body:has(#tabs:not(.hidden)){padding-left:0!important}
html.embed .top{background:transparent!important;box-shadow:none!important;border:0!important;margin-left:0!important;padding:6px 16px 0!important;min-height:0!important;position:static!important}
html.embed .top h1,html.embed .top .who{display:none!important}
html.embed .top .help-btn{color:#1f4d3a;border-color:#b9cbc2}
#pwForm,#rsForm,#phForm,#sealBox{display:none!important}
:root {
  --pine: #1f4d3a;
  --pine-2: #2f6b52;
  --pine-soft: #e3ece6;
  --mist: #eef3ef;
  --paper: #ffffff;
  --ink: #17241f;
  --muted: #5b6b64;
  --line: #d3ddd7;
  --amber: #9a6512;
  --amber-soft: #f7ecd9;
  --red: #b42318;
  --red-soft: #fbe7e5;
  --gray-soft: #eceeed;
  --radius: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--mist);
  color: var(--ink);
  font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 84px;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid #f0b429; outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }

/* ---------- 상단 ---------- */
.top {
  background: var(--pine);
  color: #fff;
  padding: 14px 16px;
  position: sticky; top: 0; z-index: 20;
}
.top-inner { max-width: 960px; margin: 0 auto; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; row-gap: 6px; }
.top h1 { font-size: 19px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
.top .who { font-size: 16px; font-weight: 700; color: #cfe6d9; }
.top .help-btn:first-of-type, .top #helpBtn { margin-left: auto; }
.top .help-btn { background: transparent; color: #fff; border: 1px solid rgba(255, 255, 255, .6); border-radius: 8px; padding: 4px 12px; font-size: 14px; font-weight: 600; cursor: pointer; align-self: center; white-space: nowrap; }
.top .help-btn:hover { background: rgba(255, 255, 255, .15); }
#helpDlg { max-width: 640px; max-height: 88vh; }
#helpDlg .h-head { display: flex; align-items: center; gap: 10px; padding: 16px 20px 8px; position: sticky; top: 0; background: #fff; }
#helpDlg h2 { margin: 0; font-size: 20px; flex: 1; }
#helpDlg .h-body { padding: 0 20px 20px; }
#helpDlg details { border: 1px solid var(--line, #d5ddd8); border-radius: 10px; margin: 8px 0; background: #fff; }
#helpDlg summary { cursor: pointer; padding: 12px 14px; font-weight: 700; font-size: 16px; }
#helpDlg .hb { padding: 0 16px 12px; line-height: 1.7; }
#helpDlg .hb p { margin: 8px 0; white-space: normal; }
#helpDlg .hb ol, #helpDlg .hb ul { margin: 8px 0; padding-left: 22px; }
.progress { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; overflow: hidden; }
.progress.on::after {
  content: ''; position: absolute; height: 100%; width: 40%; background: #f0b429;
  animation: slide 1s ease-in-out infinite;
}
@keyframes slide { from { left: -40%; } to { left: 100%; } }

/* ---------- 탭 ---------- */
.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
  background: var(--paper); border-top: 1px solid var(--line);
  display: flex; justify-content: center;
}
.tabs button {
  flex: 1; max-width: 220px; border: 0; background: none; padding: 12px 8px 14px;
  font-size: 15px; font-weight: 500; color: var(--muted); border-top: 3px solid transparent;
}
.tabs button[aria-current="page"] { color: var(--pine); border-top-color: var(--pine); font-weight: 700; }
.tabs button b { font-weight: inherit; display: block; }
.tabs button small { display: none; font-size: 13px; font-weight: 400; color: var(--muted); margin-top: 2px; }
.top h1.home { cursor: pointer; }
.top h1.home:hover { text-decoration: underline; }
.top .back-btn { align-self: center; }
/* PC(넓은 화면): 메뉴를 왼쪽에 세로로 놓고, 큰 이름 아래에 작은 설명을 보여줌 */
@media (min-width: 900px) {
  body:has(#tabs:not(.hidden)) { padding-left: 220px; }
  body:has(#tabs:not(.hidden)) .top { margin-left: -220px; padding-left: 236px; }
  .tabs { top: 60px; right: auto; bottom: 0; width: 220px; flex-direction: column; justify-content: flex-start; border-top: 0; border-right: 1px solid var(--line); padding: 14px 10px; gap: 6px; overflow-y: auto; }
  .tabs button { flex: none; max-width: none; width: 100%; text-align: left; padding: 12px 14px; border-top: 0; border-left: 4px solid transparent; border-radius: 8px; font-size: 18px; font-weight: 700; color: var(--ink); }
  .tabs button small { display: block; }
  .tabs button:hover { background: rgba(0, 0, 0, .04); }
  .tabs button[aria-current="page"] { border-left-color: var(--pine); background: #e8f1ec; color: var(--pine); }
}

main { max-width: 960px; margin: 0 auto; padding: 20px 16px; }

/* ---------- 공통 요소 ---------- */
h2 { font-size: 24px; line-height: 1.3; margin: 0 0 4px; letter-spacing: -0.015em; }
h3 { font-size: 17px; margin: 0 0 10px; }
.sub { color: var(--muted); margin: 0 0 16px; font-size: 15px; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }
.btn {
  border: 1px solid var(--line); background: var(--paper); border-radius: 8px;
  padding: 10px 16px; font-weight: 500; min-height: 44px;
}
.btn:hover { border-color: var(--pine-2); }
.btn.primary { background: var(--pine); border-color: var(--pine); color: #fff; }
.btn.primary:hover { background: var(--pine-2); }
.btn.danger { color: var(--red); border-color: #e9b8b3; }
.btn.small { padding: 6px 12px; min-height: 36px; font-size: 14px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.link { border: 0; background: none; color: var(--pine); padding: 6px 0; font-weight: 500; }
label.f { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
input[type=text], input[type=tel], input[type=password], input[type=date], input[type=number], select, textarea {
  width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  background: #fff; min-height: 44px;
}
textarea { min-height: 120px; resize: vertical; }
.bk { padding: 12px 14px; margin-bottom: 10px; }
.bk-h { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.bk-h .btn { min-height: 32px; padding: 4px 12px; }
.bk-n { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 28px; border-radius: 14px; background: var(--pine, #1f4d3a); color: #fff; font-weight: 700; font-size: 14px; }
.bk-g { display: grid; grid-template-columns: repeat(12, 1fr); gap: 8px 12px; }
.bk-g > .c2 { grid-column: span 2; } .bk-g > .c3 { grid-column: span 3; } .bk-g > .c4 { grid-column: span 4; } .bk-g > .c12 { grid-column: span 12; }
.bk-g label.f { margin-bottom: 3px; font-size: 13px; }
.bk-g input[type=text], .bk-g input[type=tel], .bk-g input[type=number], .bk-g select { min-height: 40px; padding: 8px 10px; }
@media (max-width: 900px) { .bk-g > .c2, .bk-g > .c3, .bk-g > .c4 { grid-column: span 6; } }
@media (max-width: 520px) { .bk-g > .c2, .bk-g > .c3, .bk-g > .c4 { grid-column: span 12; } }
.rcpt-page { display: none; }
@media print { .rcpt-page { display: block; page-break-after: always; padding: 22mm 18mm; } .rcpt-page:last-child { page-break-after: auto; } }
.rcpt { border: 2.5px solid #222; padding: 12mm 12mm 10mm; font-size: 13pt; color: #000; }
.rcpt .no { text-align: right; font-size: 11pt; }
.rcpt h1 { text-align: center; font-size: 28pt; letter-spacing: .4em; margin: 4mm 0 1mm; }
.rcpt .sub { text-align: center; margin: 0 0 8mm; font-size: 12pt; }
.rcpt table { width: 100%; border-collapse: collapse; }
.rcpt th, .rcpt td { border: 1px solid #333; padding: 3.5mm 4mm; text-align: left; vertical-align: middle; }
.rcpt th { width: 34mm; background: #f1f1f1; font-weight: 700; }
.rcpt .msg { text-align: center; margin: 9mm 0 5mm; font-size: 14pt; }
.rcpt .by { text-align: right; line-height: 2.1; font-size: 14pt; margin: 4mm 0 0; }
.rcpt .to { text-align: left; font-size: 15pt; margin: 6mm 0 0; }
.mepair { display: flex; flex-wrap: wrap; gap: 0 16px; align-items: flex-start; }
.mepair > .panel { flex: 1 1 280px; max-width: none !important; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.full { grid-column: 1 / -1; }
.hint { font-size: 13px; color: var(--muted); margin-top: 4px; }
.course { user-select: text; -webkit-user-select: text; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
.tag { display: inline-block; padding: 2px 9px; border-radius: 6px; font-size: 13px; font-weight: 700; background: var(--pine-soft); color: var(--pine); }
.tag.k { background: var(--gray-soft); color: var(--ink); }
.tag.p { background: #fff3d6; color: #6b4a00; }
.kvs { display: flex; flex-wrap: wrap; gap: 4px 20px; margin: 8px 0 0; font-size: 14px; }
.kv i { font-style: normal; color: var(--muted); font-size: 12px; margin-right: 5px; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.b-미제출 { background: var(--gray-soft); color: var(--muted); }
.b-제출완료 { background: var(--amber-soft); color: var(--amber); }
.b-승인 { background: var(--pine-soft); color: var(--pine); }
.b-반려 { background: var(--red-soft); color: var(--red); }
.b-진행중 { background: var(--pine-soft); color: var(--pine); }
.b-종료 { background: var(--gray-soft); color: var(--muted); }
.notice { border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; font-size: 15px; }
.notice.warn { background: var(--amber-soft); color: #6b4609; }
.notice.err { background: var(--red-soft); color: var(--red); }
.notice.info { background: var(--pine-soft); color: var(--pine); }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
.empty p { margin: 0 0 14px; }

/* 숫자 요약 */
.stats { display: grid; grid-template-columns: repeat(5, 1fr); border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); margin-bottom: 16px; }
.stat { padding: 12px 14px; border-left: 1px solid var(--line); }
.stat:first-child { border-left: 0; }
.stat b { display: block; font-size: 24px; line-height: 1.2; }
.stat span { font-size: 13px; color: var(--muted); }

/* 표 */
.tbl { width: 100%; border-collapse: collapse; background: var(--paper); font-size: 15px; }
.tbl th, .tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.tbl th { font-size: 13px; color: var(--muted); font-weight: 500; background: #f7faf8; white-space: nowrap; }
.tbl td.r, .tbl th.r { text-align: right; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: #f5f9f6; }
.tbl tfoot td { font-weight: 700; background: #f7faf8; }
.tbl-wrap { border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; margin-bottom: 16px; }
.tbl-wrap .tbl tr:last-child td { border-bottom: 0; }

/* 강좌 목록 */
.course { display: block; width: 100%; text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
.course:hover { border-color: var(--pine-2); }
.course .c-title { font-size: 18px; font-weight: 700; margin-right: 8px; }
.course .meta { color: var(--muted); font-size: 14px; margin-top: 2px; }
.course .figs { display: flex; gap: 2px 18px; margin-top: 10px; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
.course .figs b { color: var(--ink); font-size: 16px; }

/* 세그먼트 */
.seg { display: flex; border-bottom: 1px solid var(--line); margin: 16px 0; gap: 4px; overflow-x: auto; }
.seg button { border: 0; background: none; padding: 10px 14px; font-weight: 500; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
.seg button[aria-selected="true"] { color: var(--pine); border-bottom-color: var(--pine); font-weight: 700; }

/* ---------- 출석 체크 (핵심 화면) ---------- */
.rail { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 10px; scrollbar-width: thin; }
.rail button {
  flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%;
  border: 2px solid var(--line); background: var(--paper); font-weight: 700; color: var(--muted);
  position: relative;
}
.rail button.done { border-color: var(--pine-2); color: var(--pine); }
.rail button.done::after {
  content: ''; position: absolute; bottom: 4px; left: 50%; width: 6px; height: 6px; margin-left: -3px;
  border-radius: 50%; background: var(--pine-2);
}
.rail button[aria-current="true"] { background: var(--pine); border-color: var(--pine); color: #fff; }
.rail button[aria-current="true"]::after { background: #fff; }
.att-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 8px 0 14px; }
.att-head .big { font-size: 34px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
.att-head .of { color: var(--muted); font-size: 16px; }
.names { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.name {
  border: 2px solid var(--line); background: var(--paper); border-radius: 12px;
  padding: 16px 14px; text-align: left; min-height: 82px; position: relative;
  transition: background-color .12s, border-color .12s, color .12s;
}
.name .n { display: block; font-size: 20px; font-weight: 700; line-height: 1.25; }
.name .c { display: block; font-size: 13px; color: var(--muted); margin-top: 4px; }
.name .mark {
  position: absolute; top: 12px; right: 12px; width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid var(--line);
}
.name[aria-pressed="true"] { background: var(--pine); border-color: var(--pine); color: #fff; }
.name[aria-pressed="true"] .c { color: #cfe0d6; }
.name[aria-pressed="true"] .mark { border-color: #fff; background: #fff; }
.name.flash { animation: qrflash 2.4s ease-out; }
@keyframes qrflash { 0% { box-shadow: 0 0 0 4px #f5b301; } 100% { box-shadow: 0 0 0 0 transparent; } }
.name[aria-pressed="true"] .mark::after {
  content: ''; position: absolute; left: 8px; top: 3px; width: 6px; height: 12px;
  border: solid var(--pine); border-width: 0 3px 3px 0; transform: rotate(45deg);
}
.name:disabled { cursor: default; }
.counter { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 18px 0 6px; }
.counter input { width: 160px; text-align: center; font-size: 44px; font-weight: 700; min-height: 76px; padding: 4px; }
.counter button { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--line); background: var(--paper); font-size: 32px; line-height: 1; color: var(--pine); }
.counter button:hover { border-color: var(--pine-2); }
.counter-label { text-align: center; color: var(--muted); font-size: 15px; margin: 0; }
/* 지회별 비교 그래프 */
.cmp-chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 14px; }
.chip { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 14px; min-height: 36px; font-weight: 500; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--pine); border-color: var(--pine); color: #fff; }
.cmp-row { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 10px; min-height: 34px; border-radius: 6px; padding: 0 4px; }
.cmp-row:hover, .cmp-row:focus-visible { background: #f2f7f4; }
.cmp-name { font-size: 14px; color: var(--ink); white-space: nowrap; }
.cmp-track { display: flex; align-items: center; gap: 8px; border-left: 1px solid var(--line); height: 34px; }
.cmp-bar { height: 20px; background: #1a8f5f; border-radius: 0 4px 4px 0; transition: filter .12s; }
.cmp-row:hover .cmp-bar, .cmp-row:focus-visible .cmp-bar { filter: brightness(1.15); }
.cmp-val { flex: none; width: 52px; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.cmp-meta { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
.tip { position: fixed; z-index: 60; pointer-events: none; background: var(--ink); color: #fff; border-radius: 8px; padding: 8px 12px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.tip b { display: block; font-size: 18px; line-height: 1.2; }
.tip span { color: #cfe0d6; }
.savebar {
  position: sticky; bottom: 64px; margin-top: 18px; background: var(--paper);
  border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px;
  display: flex; align-items: center; gap: 12px; box-shadow: 0 6px 20px rgba(31, 77, 58, .12);
}
.savebar .msg { font-size: 14px; color: var(--muted); line-height: 1.35; }
.savebar .btn { white-space: nowrap; flex: 0 0 auto; }
.savebar .msg.dirty { color: var(--amber); font-weight: 700; }

/* 보고 상태 */
.status-line { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.status-word { font-size: 28px; font-weight: 700; }
.status-word.s-제출완료 { color: var(--amber); }
.status-word.s-승인 { color: var(--pine); }
.status-word.s-반려 { color: var(--red); }
.status-word.s-미제출 { color: var(--muted); }

/* 로그인 */
.login { max-width: 380px; margin: 8vh auto 0; }
.login h2 { font-size: 26px; }
.login .panel { padding: 24px; }
.login .f-row { margin-bottom: 14px; }

/* 토스트 */
.toast {
  position: fixed; left: 50%; top: 72px; transform: translateX(-50%); z-index: 50;
  background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 8px; max-width: calc(100% - 32px);
  font-size: 15px; white-space: pre-line; box-shadow: 0 8px 24px rgba(0,0,0,.2);
}
.toast.err { background: var(--red); }

/* 대화상자 */
dialog { border: 0; border-radius: 12px; padding: 0; max-width: 460px; width: calc(100% - 32px); }
dialog::backdrop { background: rgba(23, 36, 31, .45); }
dialog .d-body { padding: 20px; }
dialog .d-body p { white-space: pre-line; margin: 0 0 12px; }
dialog .d-foot { padding: 12px 20px 20px; display: flex; gap: 8px; justify-content: flex-end; }

@media (max-width: 720px) {
  h2 { font-size: 21px; }
  .grid2, .grid3 { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(3, 1fr); }
  .stat:nth-child(4) { border-left: 0; }
  .stat:nth-child(n+4) { border-top: 1px solid var(--line); }
  .names { grid-template-columns: repeat(2, 1fr); }
  .tbl .hide-m { display: none; }
  .tbl { font-size: 14px; }
  .tbl th, .tbl td { padding: 9px 8px; }
  .savebar { padding: 10px 12px; gap: 8px; }
  .savebar .msg { font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* 수료증 (A4 세로) */
.cert { width: 210mm; height: 297mm; box-sizing: border-box; padding: 14mm; background: #fff; color: #000;
  page-break-after: always; break-after: page; font-family: 'Noto Serif KR', 'Batang', 'Malgun Gothic', serif; }
.cert:last-child { page-break-after: auto; break-after: auto; }
.cert-in { height: 100%; box-sizing: border-box; border: 2px solid #222; padding: 3mm; }
.cert-in2 { height: 100%; box-sizing: border-box; border: 1px solid #222; padding: 12mm 16mm;
  display: flex; flex-direction: column; }
.cert-no { font-size: 13pt; }
.cert h1 { font-size: 44pt; letter-spacing: .4em; text-align: center; margin: 18mm 0 14mm; font-weight: 700; }
.cert-info { font-size: 16pt; line-height: 1.9; margin: 0 8mm; }
.cert-info b { font-size: 20pt; }
.cert-body { font-size: 16pt; line-height: 1.9; margin: 10mm 8mm 0; text-align: left; word-break: keep-all; }
.cert-date { font-size: 16pt; text-align: center; margin: auto 0 14mm; }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* =========================================================
   상태
   ========================================================= */
const S = {
  token: null, init: null, tab: 'courses',
  filter: { 연도: '', 반기: '', 지회명: '' },
  detail: null, cTab: 'att', session: 1, draft: null, draftCount: null, dirty: false,
  period: null, pending: 0, sdate: null, stats: null, search: { q: '', 연도: '', 주관: '', 교육구분: '', 수준: '' }, from: ''
};
const $ = sel => document.querySelector(sel);
const view = () => $('#view');

/* 글자를 화면에 넣기 전에 항상 안전하게 바꿈 (이름에 <, > 등이 있어도 안전) */
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function n(v) { return (Number(v) || 0).toLocaleString('ko-KR'); }
/* 수료 집계를 하지 않는 강좌는 숫자 대신 '-' */
const LEVEL_LABEL = { '구분없음': '구분 없음' };
/* 지회/센터 구분 표시는 도협회, 또는 센터 주관 강좌가 있는 지회에서만 보임 */
function showOrg() { return isAdmin() || !!(S.init && S.init.hasCenter); }
function orgText(c) { return c.지회명 === '도협회' ? '도협회 강좌' : !showOrg() ? '' : (c.주관 ? c.주관 + ' 주관' : '주관 미입력'); }
function metaJoin(arr) { return arr.filter(Boolean).join(' / '); }
/* 강좌 정보를 '표지(태그)'와 '이름: 값' 칸으로 나눠 보여줌 (슬래시로 이어 붙이지 않음) */
function tagsHtml(c) {
  const t = [];
  const o = orgText(c); if (o) t.push(`<span class="tag">${esc(o)}</span>`);
  t.push(`<span class="tag k">${esc(kindText(c))}</span>`, `<span class="tag k">${esc(levelText(c))}</span>`);
  if (c.기관명) t.push(`<span class="tag p">기관 ${esc(c.기관명)}</span>`);
  if (String(c.확인서필요 || '').toUpperCase() === 'Y') t.push(`<span class="tag ${String(c.확인서수령 || '').toUpperCase() === 'Y' ? 'k' : 'p'}">${String(c.확인서수령 || '').toUpperCase() === 'Y' ? '확인서 받음' : '확인서 미수령'}</span>`);
  return `<div class="tags">${t.join('')}</div>`;
}
function kvHtml(pairs) {
  return `<div class="kvs">${pairs.filter(p => p && p[1] !== '' && p[1] != null).map(([k, v]) => `<span class="kv"><i>${esc(k)}</i>${esc(v)}</span>`).join('')}</div>`;
}
function kindText(c) { return (c.교육구분 ? c.교육구분 + ' 교육' : '구분 미입력'); }
function levelText(c) { return c.수준 ? (LEVEL_LABEL[c.수준] || c.수준) : '수준 미입력'; }
function isHead(c) { return String(c.인원만입력 || '').toUpperCase() === 'Y'; }
function doneNum(count, flag) { return flag === 'N' ? '-' : n(count); }

/* 브라우저 저장소 (막혀 있어도 동작하도록) */
const store = {
  get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { sessionStorage.removeItem(k); } catch (e) {} }
};

/* =========================================================
   서버 호출
   ========================================================= */
function call(fn, ...args) {
  const params = (fn === 'login' || fn === 'googleLogin') ? args : [S.token, ...args];
  setBusy(1);
  const handle = res => {
    if (!res) throw new Error('서버 응답이 없습니다. 다시 시도해 주세요.');
    if (res.ok) return res.data;
    const err = new Error(res.error);
    err.code = res.code;
    if (res.code === 'AUTH') {
      clearSession();
      if (fn !== 'googleLogin' && !S._retry && typeof sbc !== 'undefined' && sbc) {   // 로그인 시간이 지났으면 구글 로그인 정보로 조용히 다시 로그인
        S._retry = 1;
        googleSignIn().then(okk => { if (okk) location.reload(); else renderLogin(res.error); }, () => renderLogin(res.error));
      } else renderLogin(res.error);
    }
    throw err;
  };
  const netErr = () => new Error('서버에 연결하지 못했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.');
  if (typeof google === 'undefined' || !google.script) {      // Vercel + Supabase 버전
    return fetch('/api/call', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fn: fn, args: params }) })
      .then(r => r.json().catch(() => null), () => { throw netErr(); })
      .then(handle)
      .finally(() => setBusy(-1));
  }
  return new Promise((resolve, reject) => {                    // 구글 앱스스크립트 버전
    google.script.run
      .withSuccessHandler(res => {
        setBusy(-1);
        try { resolve(handle(res)); } catch (e) { reject(e); }
      })
      .withFailureHandler(e => { setBusy(-1); reject(netErr()); })[fn](...params);
  });
}
// 화면 위 진행 표시 없이 조용히 부르기 (자동 새로고침용, 실패해도 알리지 않음)
async function quietCall(fn, ...args) {
  if (typeof google !== 'undefined' && google.script) return null;
  try { const r = await (await fetch('/api/call', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fn: fn, args: [S.token, ...args] }) })).json(); return r && r.ok ? r.data : null; } catch (e) { return null; }
}
function setBusy(d) {
  S.pending = Math.max(0, S.pending + d);
  $('#progress').classList.toggle('on', S.pending > 0);
}
/* 버튼을 누르는 동안 잠가서 두 번 저장되는 것 방지 */
async function act(btn, work) {
  if (btn) { if (btn.disabled) return; btn.disabled = true; }
  try { return await work(); }
  catch (e) { if (e.code !== 'AUTH') toast(e.message, true); }
  finally { if (btn && btn.isConnected) btn.disabled = false; }
}

let toastTimer;
function toast(msg, isErr) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast' + (isErr ? ' err' : '');
  t.setAttribute('role', isErr ? 'alert' : 'status');
  t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), isErr ? 6000 : 2600);
}

/* 확인 창: ask('문구', { ok:'삭제', danger:true, input:'반려 사유' }) → true/false 또는 입력값 */
function ask(message, opt = {}) {
  return new Promise(resolve => {
    const d = $('#dlg');
    $('#dlgBody').innerHTML = `<p>${esc(message)}</p>` +
      (opt.input ? `<label class="f" for="dlgIn">${esc(opt.input)}</label><textarea id="dlgIn" style="min-height:90px"></textarea>` : '');
    const ok = $('#dlgOk');
    ok.textContent = opt.ok || '확인';
    ok.className = 'btn ' + (opt.danger ? 'danger' : 'primary');
    $('#dlgCancel').classList.toggle('hidden', !!opt.alertOnly);
    d.onclose = () => {
      if (d.returnValue !== 'ok') return resolve(false);
      resolve(opt.input ? ($('#dlgIn').value.trim() || false) : true);
    };
    d.returnValue = '';
    d.showModal();
    if (opt.input) setTimeout(() => $('#dlgIn').focus(), 30);
  });
}

/* =========================================================
   로그인
   ========================================================= */
function doLogout() {
  const t = S.token;
  clearSession();
  if (typeof google !== 'undefined' && google.script) google.script.run.logout(t); else fetch('/api/call', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fn: 'logout', args: [t] }) }).catch(() => {});
  if (sbc) sbc.auth.signOut().finally(goHome); else goHome();
}
function clearSession() {
  if ($('#nb')) $('#nb').innerHTML = '';
  $('#topLogout').classList.add('hidden'); $('#inqBtn').classList.add('hidden');
  $('#filesTab b').textContent = '자료요청'; S.cur = null; S.depth = 0; updateBack();
  S.token = null; S.init = null; S.detail = null; S.dirty = false;
  store.del('tok');
  $('#tabs').classList.add('hidden');
  $('#who').textContent = '';
}

const SB_URL = "https://uamlualqqcqmpdkprjfs.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhbWx1YWxxcWNxbXBka3ByamZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwNjE0OTMsImV4cCI6MjExMDYzNzQ5M30._f4p4pfcKaYbmjKRXOPpkMo7Ydcc26oVVI6lRFYsLkY";
const sbc = (window.supabase && window.supabase.createClient) ? window.supabase.createClient(SB_URL, SB_KEY) : null;
function goHome() { try { window.top.location.href = '/'; } catch (e) { location.href = '/'; } }
/* 통합 시스템 구글 로그인 정보로 교육관리에 로그인 */
async function googleSignIn() {
  if (!sbc) throw new Error('로그인 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');
  const r = await sbc.auth.getSession();
  const jwt = r && r.data && r.data.session && r.data.session.access_token;
  if (!jwt) return false;
  const d = await call('googleLogin', jwt);
  S.token = d.token; store.set('tok', d.token);
  return true;
}
function renderLogin(message) {
  view().innerHTML = `
    <div class="login">
      <h2>로그인</h2>
      <p class="sub">업무 시스템 홈에서 구글 계정으로 로그인한 뒤 들어오세요.</p>
      ${message ? `<div class="notice err">${esc(message)}</div>` : ''}
      <div class="panel">
        <button class="btn primary" style="width:100%" id="lbtn">업무 시스템 홈으로 가서 로그인</button>
      </div>
    </div>`;
  $('#lbtn').onclick = goHome;
}

async function boot() {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  S.init = await call('getInitData');
  const u = S.init.user;
  S.period = { 연도: S.init.reportPeriod.연도, 반기: S.init.reportPeriod.반기 };
  S.filter = { 연도: S.init.currentYear, 반기: '', 지회명: '' };
  $('#who').textContent = isAdmin() ? `도협회 ${u.name || u.id}` : `${u.chapter} ${u.name || ''}`;
  $('#tabs').classList.remove('hidden');
  $('#topLogout').classList.remove('hidden'); $('#inqBtn').classList.remove('hidden'); $('#inqBtn').onclick = () => {   // 업무 시스템 안에서는 공통 문의함(모든 분류·지회 간 문의)으로
    if (window.parent !== window) { try { window.parent.postMessage({ type: 'nav-go', kind: 'inq' }, location.origin); return; } catch (e) {} }
    go('inquiry');
  }; refreshInqBadge();
  $('#filesTab').classList.toggle('hidden', !webMode());
  $('#applyTab').classList.toggle('hidden', !webMode());
  if (webMode()) refreshFileBadge();
  loadNotices();
  $('#topLogout').onclick = doLogout;
  go('dash');
  try { if (window.parent !== window) window.parent.postMessage({ type: 'edu-ready', hide: webMode() ? [] : ['apply', 'files'] }, location.origin); } catch (e) {}
  try { const hk = 'helpSeen:' + (u.id || u.name || ''); if (!localStorage.getItem(hk) && (!navigator.webdriver || window.__helpTest)) { localStorage.setItem(hk, '1'); setTimeout(openHelp, 400); } } catch (e) {}   // 처음 들어오면 사용설명서를 먼저 보여 줌

function isAdmin() { return S.init && S.init.user.role === '도협회'; }

/* =========================================================
   탭 이동
   ========================================================= */
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => go(b.dataset.tab));
window.addEventListener('message', e => { if (e.origin === location.origin && e.source === window.parent && e.data && e.data.type === 'edu-go' && S.init) go(e.data.tab); });

/* ---------- 뒤로 가기 / 제목 눌러 첫 화면 ---------- */
function navPush(st) {   // 화면을 옮길 때마다 기록해 두어, 휴대폰·브라우저의 뒤로 가기 버튼도 같이 동작
  if (S._pop || !S.init) return;
  try {
    if (!S.cur) { st.d = 0; history.replaceState(st, ''); S.depth = 0; }
    else if (S.cur.t === st.t && S.cur.c === st.c) return;
    else { st.d = (S.depth || 0) + 1; history.pushState(st, ''); S.depth = st.d; }
  } catch (e) {}
  S.cur = st; updateBack();
}
function updateBack() { const b = $('#backBtn'); if (b) b.classList.add('hidden'); }   // 뒤로 버튼 없음: 업무 시스템 위쪽 경로(수어교육관리 › 메뉴)를 누르면 처음 화면으로
$('#backBtn').onclick = () => { if (S.depth > 0) history.back(); else if (S.init) go('dash'); };
$('#homeLink').onclick = () => { if (S.init) go('dash'); };
$('#homeLink').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (S.init) go('dash'); } };
window.addEventListener('popstate', async e => {
  if (!S.init) return;
  const st = e.state || { t: 'courses', d: 0 };
  if (!(await leaveOk())) { try { history.pushState(S.cur || { t: 'courses', d: 0 }, ''); } catch (x) {} return; }
  S._pop = true;
  try { S.depth = st.d || 0; S.cur = st; if (st.c) await openCourse(st.c); else await go(st.t || 'courses'); updateBack(); }
  finally { S._pop = false; }
});

async function go(tab, keepInq) {
  if (!(await leaveOk())) return;
  navPush({ t: tab });
  S.tab = tab;
  S.detail = null;
  if (tab !== 'courses' || !S.keepFrom) S.from = '';
  S.keepFrom = false;
  const navOf = { fee: 'apply', stats: 'report', search: 'courses', notice: 'files', dispatch: 'courses' }[tab] || tab;
  document.querySelectorAll('#tabs button').forEach(b =>
    b.setAttribute('aria-current', b.dataset.tab === navOf ? 'page' : 'false'));
  try { if (window.parent !== window) window.parent.postMessage({ type: 'edu-tab', tab: navOf }, location.origin); } catch (e) {}
  drawSwitch(tab);
  if (tab !== 'inquiry' && S.init) refreshInqBadge();
  window.scrollTo(0, 0);
  if (tab === 'courses' && S.init && !isAdmin()) loadNotices();
  if (tab === 'courses') renderCourses();
  else if (tab === 'dash') renderDash();
  else if (tab === 'report') isAdmin() ? renderAdminReport() : renderReport();
  else if (tab === 'stats') renderStats();
  else if (tab === 'search') renderSearch();
  else if (tab === 'files') renderFiles();
  else if (tab === 'notice') renderNotices();
  else if (tab === 'dispatch') renderDispatch();
  else if (tab === 'inquiry') renderInquiry(keepInq);
  else if (tab === 'apply') renderApplyHub();
  else if (tab === 'fee') renderFee();
  else renderMe();
}

function parseDatesText(txt) {
  const out = [], bad = [], now = new Date(), y0 = now.getFullYear();
  String(txt || '').split(/[,;\n\s]+/).filter(Boolean).forEach(tok => {
    let m = tok.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})$/), y, mo, d;
    if (m) { y = +m[1]; mo = +m[2]; d = +m[3]; }
    else if ((m = tok.match(/^(\d{1,2})[-./](\d{1,2})$/))) { mo = +m[1]; d = +m[2]; y = y0; const t = new Date(y, mo - 1, d); if (now - t > 60 * 86400000) y = y0 + 1; }
    else { bad.push(tok); return; }
    const dt = new Date(y, mo - 1, d);
    if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) { bad.push(tok); return; }
    out.push(`${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`);
  });
  return { dates: [...new Set(out)].sort(), bad };
}

function yearOptions(selected, withAll) {
  const y = S.init.currentYear;
  let h = withAll ? `<option value="">전체 연도</option>` : '';
  const last = Math.max(2032, y + 1);   // 2022년부터 2032년까지 (2033년 이후는 올해+1까지 자동으로 늘어남)
  for (let i = last; i >= 2022; i--) h += `<option value="${i}" ${String(selected) === String(i) ? 'selected' : ''}>${i}년</option>`;
  return h;
}
function halfOptions(selected, withAll) {
  return (withAll ? `<option value="">상·하반기 전체</option>` : '') +
    ['상반기', '하반기'].map(h => `<option ${selected === h ? 'selected' : ''}>${h}</option>`).join('');
}
function chapterOptions(selected, allLabel, hqFirst) {
  const list = (S.init.owners || S.init.chapters).slice();
  if (list.includes('도협회')) list.splice(0, 0, ...list.splice(list.indexOf('도협회'), 1));   // 도협회를 맨 위로
  return (allLabel ? `<option value="">${esc(allLabel)}</option>` : '') +
    list.map(c => `<option ${selected === c ? 'selected' : ''}>${esc(c)}</option>`).join('');
}

function drawList() {
  if (S.tab !== 'courses' || S.detail || !$('#list')) return;
  const q = isAdmin() ? String(S.fq || '').replace(/\s+/g, '').toLowerCase() : '';
  const rows = (S.listAll || []).filter(c => !q || (c.강좌명 + c.강사 + (c.보조강사 || '') + c.지회명).replace(/\s+/g, '').toLowerCase().includes(q));
  S.listRows = rows;
  if (!rows.length) {
    $('#list').innerHTML = q ? '<div class="panel empty"><p>걸러낸 결과가 없습니다. 검색어를 지우거나 바꿔 보세요.</p></div>' : `<div class="panel empty"><p>이 기간에 등록된 강좌가 없습니다.</p>
      <button class="btn primary" id="emptyNew">새 강좌 등록</button></div>`;
    if ($('#emptyNew')) $('#emptyNew').onclick = () => renderCourseForm(null);
    return;
  }
  if (!isAdmin()) $('#list').innerHTML = rows.map(courseCardHtml).join('');
  else {
    // 도협회: 지회별로 묶어 접어 둠 (굵은 지회명만 보이고, 눌러서 강좌를 봄). 지회를 고르거나 검색 중이면 펼침
    const order = (S.init.owners || S.init.chapters || []).slice(), by = {};
    if (order.includes('도협회')) order.unshift(...order.splice(order.indexOf('도협회'), 1));   // 도협회를 맨 위로
    rows.forEach(c => { (by[c.지회명] = by[c.지회명] || []).push(c); });
    const names = Object.keys(by).sort((a, b) => (order.indexOf(a) < 0 ? 99 : order.indexOf(a)) - (order.indexOf(b) < 0 ? 99 : order.indexOf(b)));
    const open = !!S.filter.지회명 || !!q || names.length === 1;
    $('#list').innerHTML = names.map(ch => {
      const list = by[ch], run = list.filter(c => c.상태 === '진행중').length;
      return `<details class="grp" data-ch="${esc(ch)}" ${open || (S.openGrp && S.openGrp.has(ch)) ? 'open' : ''}><summary><b>${esc(ch)}</b> <span class="hint" style="margin:0">강좌 ${list.length}개${run ? ' · 진행중 ' + run : ''}</span></summary><div class="grp-body">${list.map(courseCardHtml).join('')}</div></details>`;
    }).join('');
  }
  document.querySelectorAll('#list details.grp').forEach(d => d.addEventListener('toggle', () => { S.openGrp = S.openGrp || new Set(); d.open ? S.openGrp.add(d.dataset.ch) : S.openGrp.delete(d.dataset.ch); }));
  document.querySelectorAll('.course').forEach(b => b.onclick = () => openCourse(b.dataset.id));
}
async function loadList() {
  try {
    const all = await call('listCourses', S.filter);
    const rows = all.filter(c => (!S.filter.주관 || c.주관 === S.filter.주관) && (!S.filter.교육구분 || c.교육구분 === S.filter.교육구분) && (!S.filter.수준 || c.수준 === S.filter.수준));
    if (S.tab !== 'courses' || S.detail || !$('#list')) return;
    S.listAll = rows;
    drawList();
  } catch (e) {
    if (e.code !== 'AUTH' && $('#list')) $('#list').innerHTML = `<div class="notice err">${esc(e.message)}</div>`;
  }
}

async function openCourse(id) {

/* 강좌 세부 탭: 6개 묶음 (묶음 안에서 작은 탭으로 전환) */
function courseTabsHtml(d, head) {
  const c = d.course, hide = d.명단숨김, web = webMode(), noComp = c.수료집계 === 'N';
  const sel = t => S.cTab === t;
  const groups = [
    [[ 'att', hide ? '회차 현황' : head ? '인원 입력' : '출석 체크', true ], [ 'people', `참여자 명단 (${d.participants.length})`, !head && !hide ]],
    [[ 'apply', '수강 접수', !head && !hide && web ], [ 'pay', '수강료', !head && !hide && web && !c.파견ID && Number(c.수강료) > 0 ]],
    [[ 'journal', '교육일지', !hide ], [ 'task', '과제', !head && !hide ]],
    [[ 'comp', '수료 판정', !head && !hide && !noComp ], [ 'cert', '수료증', !head && !hide && !noComp && (isAdmin() || !c.파견ID) ]],
    [[ 'link', '강사 링크', !hide && web ], [ 'survey', '만족도 조사', web ]],
    [[ 'info', '강좌 정보', true ], [ 'plan', '회차별 강사·시간', !hide ]]
  ].map(g => g.filter(m => m[2])).filter(g => g.length);
  const names = { att: '출석·명단', apply: '접수·수강료', journal: '일지·과제', comp: '수료', link: '링크·만족도', info: '강좌 정보' };
  const top = groups.map(g => {
    const active = g.some(m => sel(m[0]));
    const label = g.length === 1 ? g[0][1] : names[g[0][0]];
    return `<button role="tab" data-cts="${g.map(m => m[0]).join(' ')}" data-ct="${active ? S.cTab : g[0][0]}" aria-selected="${active}">${label}</button>`;
  }).join('');
  const cur = groups.find(g => g.some(m => sel(m[0])));
  const sub = cur && cur.length > 1 ? `<div class="subtabs" role="tablist">${cur.map(m => `<button role="tab" data-ct="${m[0]}" aria-selected="${sel(m[0])}">${m[1]}</button>`).join('')}</div>` : '';
  return `<div class="seg" role="tablist">${top}</div>${sub}`;
}

  S.detail = d;

  }
  const r = d.result || {};

  if ((head || d.명단숨김 || !webMode()) && S.cTab === 'apply') S.cTab = 'att';

  if (!webMode() && S.cTab === 'link') S.cTab = 'att';
  if (d.명단숨김 && S.cTab === 'journal') S.cTab = 'att';

    ${tagsHtml(c)}
    ${kvHtml([isAdmin() ? ['지회', c.지회명] : null, ['기간', c.시작일 + ' ~ ' + c.종료일], c.파견ID ? ['파견 일정', c.예정일] : null, c.파견ID && c.파견장소 ? ['교육 장소', c.파견장소] : null, ['회차', `총 ${c.총회차}회 × ${c.회당시간}시간`], ['수료', c.수료집계 === 'N' ? '집계 안 함' : '기준 ' + c.수료기준 + '%'], head ? ['입력', '인원수만 입력'] : null, ['강사', c.강사]])}
    ${c.파견비고 ? `<div class="notice warn"><b>📝 도협회 안내</b> <span class="hint" style="margin:0">(파견 교육)</span><br><span style="white-space:pre-wrap">${esc(c.파견비고)}</span></div>` : ''}
    <div class="row no-print" style="margin:0 0 12px"><span class="spacer"></span>
      <button class="btn small" id="xlsCourse">⬇ ${d.명단숨김 ? '회차 현황' : '출석부'} 엑셀</button>
      ${!d.명단숨김 && !head ? '<button class="btn small" id="prtSign">✍ 서명용 출석부 인쇄</button>' : ''}
      <button class="btn small" id="prtCourse">🖨 ${d.명단숨김 ? '회차 현황' : '출석부'} 인쇄 / PDF</button></div>
    ${String(c.확인서필요 || '').toUpperCase() === 'Y' ? confirmBoxHtml(c) : ''}
    ${d.locked ? `<div class="notice warn">${esc(d.lockedBy)} 보고가 제출되어 이 강좌는 수정할 수 없습니다. 고쳐야 하면 도협회에 보완 요청을 부탁하세요.</div>` : ''}
    <div class="stats num" ${head ? 'style="grid-template-columns:repeat(4,1fr)"' : ''}>

  const locked = S.detail.locked, tl = d.강사목록;
  const hrs = (a, b) => { const m = t => { const x = /^(\d{2}):(\d{2})$/.exec(t || ''); return x ? Number(x[1]) * 60 + Number(x[2]) : null; }; return m(a) !== null && m(b) !== null && m(b) > m(a) ? Math.round((m(b) - m(a)) / 6) / 10 : d.회당시간; };

function sigPad(host) {
  host.innerHTML = '<canvas class="sig"></canvas>';
  const cv = host.firstChild, W = 480, H = 160;
  cv.width = W; cv.height = H;
  const g = cv.getContext('2d'); g.lineWidth = 3.2; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#111';
  let down = false, drawn = false, last = null;
  const pos = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; };
  cv.addEventListener('pointerdown', e => { e.preventDefault(); down = true; last = pos(e); cv.setPointerCapture(e.pointerId); g.beginPath(); g.moveTo(last.x, last.y); g.lineTo(last.x + .1, last.y + .1); g.stroke(); drawn = true; });
  cv.addEventListener('pointermove', e => { if (!down) return; e.preventDefault(); const p = pos(e); g.beginPath(); g.moveTo(last.x, last.y); g.lineTo(p.x, p.y); g.stroke(); last = p; });
  const up = () => { down = false; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  return { clear() { g.clearRect(0, 0, W, H); drawn = false; }, empty() { return !drawn; }, png() { return cv.toDataURL('image/png'); } };
}
/* 서명 칸: 화면에서 서명하거나, 비워 두고 인쇄 후 직접 서명. value(): 그대로면 undefined, 지움/비움이면 '', 새로 그리면 그림 */
function sigArea(host, existing, onDraw) {
  let cur = existing || '', pad = null;
  const draw = () => {
    if (cur) {
      pad = null;
      host.innerHTML = `<img src="${esc(cur)}" alt="저장된 서명" style="height:70px;max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;display:block"><button type="button" class="btn small" data-sc style="margin-top:6px">서명 지우기</button>`;
      host.querySelector('[data-sc]').onclick = () => { cur = ''; if (onDraw) onDraw(); draw(); };
    } else {
      host.innerHTML = '<div data-sb></div><button type="button" class="btn small" data-sx style="margin-top:6px">다시 쓰기</button>';
      pad = sigPad(host.querySelector('[data-sb]'));
      host.querySelector('canvas').addEventListener('pointerdown', () => { if (onDraw) onDraw(); });
      host.querySelector('[data-sx]').onclick = () => pad.clear();
    }
  };
  draw();
  return { value() { if (cur) return undefined; return pad && !pad.empty() ? pad.png() : ''; } };
}

/* 사진: 화면에서 줄여서(긴 쪽 1000px, JPG) 올립니다 */
async function photoDataUrl(file) {
  if (!file || !/^image\//.test(file.type || 'image/')) throw new Error('사진 파일(JPG, PNG)만 올릴 수 있습니다.');
  let img;
  try { img = await new Promise((ok, no) => { const u = URL.createObjectURL(file), i = new Image(); i.onload = () => { URL.revokeObjectURL(u); ok(i); }; i.onerror = () => { URL.revokeObjectURL(u); no(); }; i.src = u; }); }
  catch (e) { throw new Error('이 사진을 읽을 수 없습니다. JPG 또는 PNG 사진을 올려 주세요.'); }
  const k = Math.min(1, 1000 / Math.max(img.naturalWidth, img.naturalHeight)), w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
  let q = 0.78, out = cv.toDataURL('image/jpeg', q);
  while (out.length > 240000 && q > 0.35) { q -= 0.1; out = cv.toDataURL('image/jpeg', q); }
  if (out.length > 240000) throw new Error('사진이 너무 큽니다. 더 작은 사진으로 올려 주세요.');
  return out;
}

    if (!(await ask('정말 삭제할까요? 사진과 서명이 영구히 사라집니다. (글은 남습니다.)', { ok: '네, 삭제합니다', danger: true }))) return;
    act($('#jWipe'), async () => { S.journal = await call('deleteJournalMedia', c.강좌ID); drawJournal(); toast('사진·서명을 삭제했습니다.'); });
  };
  $('#jXls').onclick = () => downloadXlsx(`${c.지회명} ${c.강좌명} 교육일지`, [{ name: '교육일지', freeze: 1,
    rows: [['회차', '수업일', '참가 인원', '수업 주제', '수업 내용', '내준 과제', '특이사항', '작성자'], ...info.sessions.filter(s => s.작성).map(s => [s.회차, s.수업일, s.참가인원 !== '' ? s.참가인원 : s.출석수, s.주제, s.내용, s.과제, s.특이사항, s.작성자])] }]);
  $('#jPrt').onclick = () => act($('#jPrt'), async () => {
    const photos = {}, info = S.journal;
    for (const s of info.sessions.filter(x => x.사진 && x.사진.length)) photos[s.회차] = (await call('getJournalPhotos', c.강좌ID, s.회차)).photos;
    printReport(`${c.지회명} ${c.강좌명} 교육일지`, `${c.시작일} ~ ${c.종료일}`, journalPrintEl(info, photos), { line: c.주관 === '센터' ? '센터' : '지회' });
  });
  const papi = { get: sn => call('getJournalPhotos', c.강좌ID, sn), add: (sn, d) => call('addJournalPhoto', c.강좌ID, sn, d), del: id => call('deleteJournalPhoto', c.강좌ID, id) };
  const after = (ni, sn) => { S.journal = ni; drawPhotos(sn, ni, papi, after); };
  document.querySelectorAll('[data-jsn]').forEach(d => { const sn = Number(d.dataset.jsn); let loaded = false; const load = () => { if (loaded || !d.open) return; loaded = true; drawPhotos(sn, S.journal, papi, after); }; d.addEventListener('toggle', load); load(); });
  const sigs = {};
  info.sessions.forEach(x => { sigs[x.회차] = sigArea(document.getElementById('js' + x.회차), x.서명); });
  document.querySelectorAll('[data-jsave]').forEach(b => b.onclick = () => act(b, async () => {
    const sn = Number(b.dataset.jsave), v = id => $('#' + id + sn).value;
    S.journal = await call('saveJournal', c.강좌ID, sn, { 수업일: v('jd'), 주제: v('jt'), 내용: v('jc'), 과제: v('jh'), 특이사항: v('jn'), 작성자: v('jw'), 참가인원: v('jm'), 작성자서명: sigs[sn].value() });
    const openIds = [...document.querySelectorAll('[data-jsn][open]')].map(e => e.dataset.jsn);
    drawJournal();
    openIds.forEach(i => { const e = document.querySelector(`[data-jsn="${i}"]`); if (e) e.open = true; });
    toast(`${sn}회차 교육일지를 저장했습니다.`);
  }));
}

/* ---------- 과제 제출 ---------- */
async function renderTasks() {
  const body = $('#cTabBody'), c = S.detail.course;
  body.innerHTML = '<div class="panel empty"><p>불러오는 중…</p></div>';
  let info;
  try { info = await call('getTasks', c.강좌ID); }
  catch (e) { if (e.code !== 'AUTH') toast(e.message, true); return; }
  if (S.cTab !== 'task') return;
  S.taskInfo = info; S.taskEdit = null;
  drawTasks();
}
function drawTasks() {
  const info = S.taskInfo, c = S.detail.course, ed = S.taskEdit;
  const sub = {}; Object.keys(info.submits).forEach(t => { sub[t] = new Set(info.submits[t]); });
  const sessOpt = sel => '<option value="">회차 지정 안 함</option>' + Array.from({ length: info.course.총회차 }, (_, i) => `<option value="${i + 1}" ${String(sel) === String(i + 1) ? 'selected' : ''}>${i + 1}회차</option>`).join('');
  $('#cTabBody').innerHTML = `
    <div class="panel">
      <h3>${ed ? '과제 수정' : '과제 추가'}</h3>
      <div class="row" style="align-items:flex-end">
        <div style="flex:2;min-width:180px"><label class="f" for="tkName">과제 이름</label><input id="tkName" maxlength="60" value="${esc(ed ? ed.과제명 : '')}" placeholder="예: 자기소개 영상 제출"></div>
        <div style="flex:1;min-width:130px"><label class="f" for="tkSess">회차</label><select id="tkSess">${sessOpt(ed ? ed.회차 : '')}</select></div>
        <div style="flex:1;min-width:150px"><label class="f" for="tkDue">마감일</label><input type="date" id="tkDue" value="${esc(ed ? ed.마감일 : '')}"></div>
      </div>
      <label class="f" for="tkDesc">설명 (선택)</label><input id="tkDesc" maxlength="500" value="${esc(ed ? ed.설명 : '')}">
      <div class="row" style="margin-top:10px"><span class="spacer"></span>${ed ? '<button class="btn" id="tkCancel">취소</button>' : ''}<button class="btn primary" id="tkSave">${ed ? '수정 저장' : '과제 추가'}</button></div>
    </div>
    ${info.tasks.length && info.people.length ? `<div class="tbl-wrap"><table class="tbl num"><thead><tr><th>이름</th>
      ${info.tasks.map(t => `<th class="r" style="min-width:96px"><div>${esc(t.과제명)}</div>
        <div class="hint" style="margin:0;font-weight:400">${t.회차 ? t.회차 + '회차 ' : ''}${t.마감일 ? '~' + esc(t.마감일.slice(5)) : ''}</div>
        <div class="hint" style="margin:0" data-tkc="${esc(t.과제ID)}">${n((info.submits[t.과제ID] || []).length)}/${n(info.people.length)} 제출</div>
        <button class="btn small" data-tkedit="${esc(t.과제ID)}">수정</button> <button class="btn small danger" data-tkdel="${esc(t.과제ID)}">삭제</button></th>`).join('')}
      <th class="r">제출</th></tr></thead>
      <tbody>${info.people.map(p => `<tr><td><b>${esc(p.이름)}</b></td>
        ${info.tasks.map(t => `<td class="r"><input type="checkbox" style="width:22px;height:22px" data-tk="${esc(t.과제ID)}" data-pid="${esc(p.참여자ID)}" ${sub[t.과제ID] && sub[t.과제ID].has(p.참여자ID) ? 'checked' : ''} aria-label="${esc(p.이름)} ${esc(t.과제명)} 제출"></td>`).join('')}
        <td class="r" data-tkn="${esc(p.참여자ID)}">${info.tasks.filter(t => sub[t.과제ID] && sub[t.과제ID].has(p.참여자ID)).length}/${info.tasks.length}</td></tr>`).join('')}</tbody></table></div>
      <p class="hint">칸을 누르면 바로 저장됩니다. 과제 제출 여부는 참고용이며 수료 판정은 <b>수료</b> 탭에서 정합니다.</p>`
      : `<div class="panel empty"><p>${info.people.length ? '아직 만든 과제가 없습니다. 위에서 과제를 추가하세요.' : '먼저 참여자를 등록해 주세요.'}</p></div>`}`;
  $('#tkSave').onclick = () => act($('#tkSave'), async () => {
    S.taskInfo = await call('saveTask', c.강좌ID, { 과제ID: ed ? ed.과제ID : '', 과제명: $('#tkName').value, 회차: $('#tkSess').value, 마감일: $('#tkDue').value, 설명: $('#tkDesc').value });
    S.taskEdit = null; drawTasks(); toast(ed ? '과제를 수정했습니다.' : '과제를 추가했습니다.');
  });
  if (ed) $('#tkCancel').onclick = () => { S.taskEdit = null; drawTasks(); };
  document.querySelectorAll('[data-tkedit]').forEach(b => b.onclick = () => { S.taskEdit = info.tasks.find(t => t.과제ID === b.dataset.tkedit); drawTasks(); window.scrollTo(0, 0); });
  document.querySelectorAll('[data-tkdel]').forEach(b => b.onclick = () => act(b, async () => {
    const t = info.tasks.find(x => x.과제ID === b.dataset.tkdel);
    if (!(await ask(`'${t.과제명}' 과제를 삭제할까요?\n제출 체크 기록도 함께 지워집니다.`, { ok: '삭제', danger: true }))) return;
    S.taskInfo = await call('deleteTask', c.강좌ID, t.과제ID); S.taskEdit = null; drawTasks(); toast('과제를 삭제했습니다.');
  }));
  document.querySelectorAll('[data-tk]').forEach(cb => cb.onchange = async () => {
    const tid = cb.dataset.tk, pid = cb.dataset.pid, on = cb.checked;
    cb.disabled = true;
    try {
      await call('setSubmit', c.강좌ID, tid, pid, on);
      const set = new Set(info.submits[tid] || []); on ? set.add(pid) : set.delete(pid); info.submits[tid] = [...set];
      const hc = document.querySelector(`[data-tkc="${tid}"]`);
      if (hc) hc.textContent = `${info.submits[tid].length}/${info.people.length} 제출`;
      const cell = document.querySelector(`[data-tkn="${pid}"]`);
      if (cell) cell.textContent = `${info.tasks.filter(t => (info.submits[t.과제ID] || []).includes(pid)).length}/${info.tasks.length}`;
    } catch (e) { cb.checked = !on; if (e.code !== 'AUTH') toast(e.message, true); }
    finally { cb.disabled = false; }
  });
}

/* ---------- 만족도 조사 ---------- */
const SCALE_COLORS = ['#d3e6dc', '#a4cbb5', '#6fae8b', '#3f8a64', '#1f4d3a'];   // 1점(연함) → 5점(진함): 한 가지 색의 명도 단계
function surveyChartHtml(R) {
  if (!R || !R.응답수) return '<p class="hint">아직 응답이 없습니다.</p>';
  const legend = `<div style="display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin:6px 0 12px">${[1, 2, 3, 4, 5].map(i => `<span style="display:inline-flex;align-items:center;gap:5px"><i style="width:12px;height:12px;border-radius:3px;background:${SCALE_COLORS[i - 1]};display:inline-block"></i>${i}점</span>`).join('')}</div>`;
  const txtQ = (q, i) => `<div style="margin:0 0 14px"><div style="font-size:14px">${i + 1}. ${esc(q.문항)} <span class="hint">(글 답변 ${q.답변.length})</span></div>${q.답변.length ? `<ul style="margin:4px 0 0;padding-left:18px">${q.답변.map(t => `<li style="white-space:pre-wrap;margin:3px 0">${esc(t)}</li>`).join('')}</ul>` : '<p class="hint" style="margin:2px 0 0">답변 없음</p>'}</div>`;
  const bars = R.문항.map((q, i) => q.유형 === '글' ? txtQ(q, i) : `<div style="margin:0 0 14px"><div class="row" style="gap:8px;font-size:14px"><span>${i + 1}. ${esc(q.문항)}</span><span class="spacer"></span><b class="num">평균 ${q.평균.toFixed(2)}</b></div>
    <div style="display:flex;height:26px;border-radius:6px;overflow:hidden;gap:2px;margin-top:4px" role="img" aria-label="${esc(q.문항)} 점수 분포 ${q.분포.map((c, j) => (j + 1) + '점 ' + c + '명').join(', ')}">${q.분포.map((c, j) => c ? `<div title="${j + 1}점 ${c}명" style="flex:${c};background:${SCALE_COLORS[j]};color:${j >= 3 ? '#fff' : '#1b2b24'};font-size:12px;display:grid;place-items:center;min-width:18px">${c}</div>` : '').join('')}</div></div>`).join('');
  return `<div class="stats num" style="grid-template-columns:repeat(2,1fr);margin-bottom:10px"><div class="stat"><b>${n(R.응답수)}</b><span>응답 수</span></div><div class="stat"><b>${R.전체평균.toFixed(2)}<small style="font-size:15px;color:var(--muted)"> / 5</small></b><span>전체 평균</span></div></div>
    <div class="hint" style="margin:0">막대는 점수별 응답 인원입니다.</div>${legend}${bars}
    ${R.의견.length ? `<h4 style="margin:16px 0 6px">의견 (${R.의견.length})</h4><ul style="margin:0;padding-left:18px">${R.의견.map(t => `<li style="white-space:pre-wrap;margin:4px 0">${esc(t)}</li>`).join('')}</ul>` : ''}`;
}
async function renderSurvey() {
  const c = S.detail.course, body = $('#cTabBody');
  body.innerHTML = '<p class="hint">불러오는 중…</p>';
  let A;
  try { A = await call('getSurvey', c.강좌ID); } catch (e) { if (e.code !== 'AUTH') { toast(e.message, true); body.innerHTML = `<div class="notice warn">${esc(e.message)}</div>`; } return; }
  if (S.cTab !== 'survey') return;
  S.svQ = null;
  drawSurvey(A);
}
/* 조사 문항 보기·고치기 (강좌마다 따로) */
function drawSvQ(A) {
  const c = S.detail.course, box = $('#svQPanel');
  const locked = A.결과.응답수 > 0;   // 응답이 있으면 문구만 고칠 수 있음
  const qs = S.svQ && S.svQ.id === c.강좌ID ? S.svQ.list : (S.svQ = { id: c.강좌ID, list: A.문항.map(q => Object.assign({}, q)) }).list;
  const same = JSON.stringify(qs) === JSON.stringify(A.문항);
  box.innerHTML = `<div class="row"><h3 style="margin:0">조사 문항 (${qs.length}개)</h3><span class="spacer"></span><button class="btn small" id="sqReset" ${locked ? 'disabled' : ''}>기본 문항으로</button></div>
    <p class="hint" style="margin-top:4px">${locked ? `응답 ${n(A.결과.응답수)}건이 있어 <b>문구만 고칠 수 있습니다.</b> (문항을 더하거나 지우거나 순서를 바꾸면 응답이 섞이기 때문입니다.)` : '수강생에게 보이는 문항입니다. 문항 종류는 "5점 척도" 또는 "글 답변(선택)"입니다. 최대 10개까지 만들 수 있고, 응답이 오기 전에 정해 주세요.'}</p>
    ${qs.map((q, i) => `<div class="row" style="gap:6px;margin:6px 0;flex-wrap:nowrap" data-sq="${i}"><b style="min-width:22px">${i + 1}.</b>
      <input type="text" data-sqt maxlength="100" value="${esc(q.문항)}" aria-label="${i + 1}번 문항" style="flex:1;min-width:0">
      <select data-squ aria-label="${i + 1}번 종류" style="width:auto" ${locked ? 'disabled' : ''}><option value="점수" ${q.유형 === '글' ? '' : 'selected'}>5점 척도</option><option value="글" ${q.유형 === '글' ? 'selected' : ''}>글 답변</option></select>
      ${locked ? '' : `<button type="button" class="btn small" data-squp ${i ? '' : 'disabled'} aria-label="위로">↑</button><button type="button" class="btn small" data-sqdn ${i < qs.length - 1 ? '' : 'disabled'} aria-label="아래로">↓</button><button type="button" class="btn small danger" data-sqdel aria-label="삭제">✕</button>`}</div>`).join('')}
    <div class="row" style="margin-top:8px"><button class="btn small" id="sqAdd" ${locked || qs.length >= 10 ? 'disabled' : ''}>＋ 문항 추가</button><span class="spacer"></span>
      <button class="btn primary" id="sqSave" ${same ? 'disabled' : ''}>문항 저장</button></div>
    <p class="hint">이 문항 아래에는 항상 "의견(선택)" 칸이 함께 나옵니다.</p>`;
  const pull = () => box.querySelectorAll('[data-sq]').forEach(r => { const q = qs[Number(r.dataset.sq)]; q.문항 = r.querySelector('[data-sqt]').value; q.유형 = r.querySelector('[data-squ]').value; });
  const redraw = () => { pull(); drawSvQ(A); };
  box.querySelectorAll('[data-sqt],[data-squ]').forEach(el => el.oninput = () => { pull(); $('#sqSave').disabled = JSON.stringify(qs) === JSON.stringify(A.문항); });
  box.querySelectorAll('[data-sq]').forEach(r => {
    const i = Number(r.dataset.sq);
    const up = r.querySelector('[data-squp]'), dn = r.querySelector('[data-sqdn]'), del = r.querySelector('[data-sqdel]');
    if (up) up.onclick = () => { pull(); [qs[i - 1], qs[i]] = [qs[i], qs[i - 1]]; drawSvQ(A); };
    if (dn) dn.onclick = () => { pull(); [qs[i + 1], qs[i]] = [qs[i], qs[i + 1]]; drawSvQ(A); };
    if (del) del.onclick = () => { if (qs.length <= 1) { toast('문항은 1개 이상 있어야 합니다.', true); return; } pull(); qs.splice(i, 1); drawSvQ(A); };
  });
  $('#sqAdd').onclick = () => { pull(); qs.push({ 문항: '', 유형: '점수' }); drawSvQ(A); setTimeout(() => { const l = box.querySelectorAll('[data-sqt]'); l[l.length - 1].focus(); }, 0); };
  $('#sqReset').onclick = () => { S.svQ.list = A.기본문항.map(q => ({ 문항: q, 유형: '점수' })); drawSvQ(A); };
  $('#sqSave').onclick = () => { pull(); act($('#sqSave'), async () => { const B = await call('saveSurveyQuestions', c.강좌ID, qs); S.svQ = null; toast('문항을 저장했습니다.'); drawSurvey(B); }); };
}

      <div class="row"><button class="btn primary" id="svCopy">링크 복사</button><button class="btn" id="svNew">새 링크로 교체</button><button class="btn danger" id="svOff">조사 닫기</button></div>`
    : `<p class="hint">${L.있음 ? '조사를 닫았습니다. 다시 열 수 있습니다.' : '아직 조사를 시작하지 않았습니다.'}</p>`}
    <label class="f" for="svDl">조사 마감일 (선택)</label><input type="date" id="svDl" value="${esc(L.마감일)}" style="max-width:200px">
    <label class="f" for="svNote">조사 화면 안내 문구 (선택)</label><textarea id="svNote" maxlength="300" style="min-height:70px" placeholder="예: 소중한 의견은 다음 교육에 반영됩니다.">${esc(L.안내)}</textarea>
    <div class="row" style="margin-top:8px"><button class="btn ${L.active ? '' : 'primary'}" id="svSave">${L.active ? '마감일·안내 저장' : (L.있음 ? '조사 다시 열기' : '조사 시작하기')}</button></div></div>
  <div class="panel"><div class="row"><h3 style="margin:0">조사 결과</h3><span class="spacer"></span><button class="btn small" id="svXls">⬇ 엑셀</button></div>${surveyChartHtml(A.결과)}</div>

/* ---------- QR 만들기 (브라우저 안에서 그림) ---------- */
function qrCanvas(text, px) {
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  const n = q.getModuleCount(), m = 4, cell = Math.max(2, Math.floor(px / (n + m * 2))), size = cell * (n + m * 2);
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, size, size); g.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) g.fillRect((c + m) * cell, (r + m) * cell, cell, cell);
  return cv;
}
function qrBox(url, title) { return `<div class="qrbox" data-qr="${esc(url)}" data-qt="${esc(title)}"></div>`; }
function fillQr(root) {
  root.querySelectorAll('[data-qr]').forEach(box => {
    const url = box.dataset.qr, title = box.dataset.qt || 'QR';
    const cv = qrCanvas(url, 600); cv.style.cssText = 'width:150px;height:150px;border:1px solid var(--line);border-radius:8px;display:block';
    cv.setAttribute('role', 'img'); cv.setAttribute('aria-label', title + ' QR 코드');
    box.innerHTML = ''; box.appendChild(cv);
    const row = document.createElement('div'); row.className = 'row'; row.style.marginTop = '6px';
    row.innerHTML = '<button type="button" class="btn small" data-qs>QR 저장</button><button type="button" class="btn small" data-qp>QR 인쇄</button>';
    box.appendChild(row);
    row.querySelector('[data-qs]').onclick = () => cv.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = (title.replace(/[\\/:*?"<>|]/g, '') || 'QR') + '.png'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); });
    row.querySelector('[data-qp]').onclick = () => printQr(title, url, cv.toDataURL('image/png'));
  });
}
function printQr(title, url, img) {
  const w = window.open('', '_blank');
  if (!w) { toast('팝업이 막혀 있습니다. 주소창 오른쪽에서 팝업을 허용해 주세요.', true); return; }
  w.document.write(`<!doctype html><meta charset="utf-8"><title>${esc(title)}</title><style>body{font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;text-align:center;padding:48px 24px}h1{font-size:34px;margin:0 0 8px}p{color:#444;font-size:18px;margin:6px 0}img{width:380px;height:380px;margin:28px 0 8px}.u{font-size:13px;color:#777;word-break:break-all}</style>
    <h1>${esc(title)}</h1><p>휴대폰 카메라로 QR을 찍어 수강 신청하세요.</p><img src="${img}" alt="QR"><div class="u">${esc(url)}</div><script>onload=()=>setTimeout(()=>print(),300)<\/script>`);
  w.document.close();
}

async function shrinkPoster(f) {   // 포스터 이미지를 접수 화면용으로 줄임 (JPG, 약 440KB 이하)
  if (!/^image\//.test(f.type)) throw new Error('이미지 파일(JPG·PNG)만 올릴 수 있습니다. PDF는 이미지로 저장(캡처)해서 올려 주세요.');
  const img = await new Promise((ok, no) => { const u = URL.createObjectURL(f), im = new Image(); im.onload = () => { URL.revokeObjectURL(u); ok(im); }; im.onerror = () => no(new Error('이미지를 읽지 못했습니다.')); im.src = u; });
  let data = '';
  for (const [w, q] of [[1000, .8], [900, .7], [760, .6], [600, .55]]) {
    const k = Math.min(1, w / img.width), cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
    const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height);
    data = cv.toDataURL('image/jpeg', q); if (data.length <= 440000) break;
  }
  if (data.length > 440000) throw new Error('이미지가 너무 큽니다. 더 작은 이미지로 올려 주세요.');
  return data;
}

function feeTaxCalc(type, amount) {
  const rate = type === '사업소득' ? 3 : type === '기타소득' ? 8 : 0;
  const inc = Math.floor(amount * rate / 100 / 10) * 10, loc = Math.floor(inc * 10 / 100 / 10) * 10;
  return { inc: inc, loc: loc, net: amount - inc - loc };
}
function feeTotals(ed) {

  return Object.assign({ total: total }, feeTaxCalc(ed.원천세, total));
}

  const close = () => { window.removeEventListener('message', onMsg); ov.remove(); };
  const fr = ov.querySelector('iframe');
  const onMsg = e => { if (e.source === fr.contentWindow && e.data && e.data.type === 'apply-preview-ready') fr.contentWindow.postMessage({ type: 'apply-preview', c: data }, location.origin); };

}

/* ---------- 수료 판정 (강사가 직접 확정) ---------- */
async function renderCompletion() {
  const c = S.detail.course;
  if (!S.taskInfo || S.taskInfo.course.강좌ID !== c.강좌ID) {
    try { S.taskInfo = await call('getTasks', c.강좌ID); } catch (e) { S.taskInfo = null; if (e.code === 'AUTH') return; }
  }
  if (S.cTab !== 'comp') return;
  drawCompletion();
}
function drawCompletion() {
  const d = S.detail, c = d.course, total = Number(c.총회차) || 0, crit = Number(c.수료기준), locked = d.locked, ti = S.taskInfo;
  const W = weightsOf(c), wOn = Object.keys(W).length > 0, wk = ['발표', '과제', '중간', '기말', '기타'].filter(k => W[k] > 0);
  const kname = k => k === '기타' ? (c.기타항목명 || '기타') : k;
  const auto = (p, cnt) => wOn ? (Number(p.총점) > 0 && Number(p.총점) + 1e-9 >= crit) : (cnt > 0 && total > 0 && cnt * 100 >= crit * total);
  const subCnt = pid => ti ? ti.tasks.filter(t => (ti.submits[t.과제ID] || []).includes(pid)).length : 0;
  const rows = d.participants.map(p => {
    const ov = p.수료확정 || '', a = auto(p, Number(p.출석횟수) || 0), sc = p.점수 || {};
    return `<tr data-row="${esc(p.참여자ID)}"><td><b>${esc(p.이름)}</b></td>
      <td class="r num">${n(p.출석횟수)}/${n(total)}회 <span class="hint" style="margin:0">(${total ? Math.round(Number(p.출석횟수) / total * 100) : 0}%)</span></td>
      ${ti && ti.tasks.length ? `<td class="r num">${subCnt(p.참여자ID)}/${ti.tasks.length}</td>` : ''}
      ${wk.map(k => `<td class="r"><input type="number" min="0" max="100" data-sc="${k}" value="${esc(sc[k] === undefined ? '' : sc[k])}" style="width:72px" ${locked ? 'disabled' : ''} aria-label="${esc(p.이름)} ${esc(kname(k))} 점수"></td>`).join('')}
      ${wOn ? `<td class="r num"><b>${n(p.총점)}</b>점</td>` : ''}
      <td>${a ? '수료' : '미수료'}</td>
      <td><select data-cp="${esc(p.참여자ID)}" ${locked ? 'disabled' : ''} style="min-width:150px">
        <option value="" ${ov === '' ? 'selected' : ''}>자동 (${a ? '수료' : '미수료'})</option>
        <option value="Y" ${ov === 'Y' ? 'selected' : ''}>수료로 확정</option>
        <option value="N" ${ov === 'N' ? 'selected' : ''}>미수료로 확정</option></select></td>
      <td><span class="badge ${p.수료 ? 'b-승인' : 'b-미제출'}">${p.수료 ? '수료' : '미수료'}</span>${ov ? ' <span class="tag p">직접 지정</span>' : ''}</td></tr>`;
  }).join('');
  const wText = Object.keys(W).map(k => `${kname(k)} ${W[k]}%`).join(' · ');
  $('#cTabBody').innerHTML = `
    ${locked ? `<div class="notice warn">${esc(d.lockedBy)} 보고가 제출되어 수료 여부를 바꿀 수 없습니다. 고쳐야 하면 도협회에 보완 요청을 부탁하세요.</div>` : ''}
    <div class="notice info">${wOn ? `항목별 비율(${esc(wText)})로 점수를 합산해 <b>총점 ${esc(c.수료기준)}점 이상</b>이면 수료로 자동 판정합니다. 출석은 출석률로 자동 계산되고, 나머지는 0~100점으로 입력하세요.` : `기본은 출석률(총 회차의 ${esc(c.수료기준)}% 이상)로 자동 판정합니다.`} 사정이 있으면 강사가 <b>수료로 확정 / 미수료로 확정</b>을 직접 고를 수 있고, 최종 결과는 실적 보고와 수료증에 그대로 쓰입니다.</div>
    ${d.participants.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>이름</th><th class="r">출석</th>${ti && ti.tasks.length ? '<th class="r">과제 제출</th>' : ''}${wk.map(k => `<th class="r">${esc(kname(k))}<br><span class="hint" style="margin:0">${W[k]}%</span></th>`).join('')}${wOn ? '<th class="r">총점</th>' : ''}<th>${wOn ? '점수 판정' : '출석률 판정'}</th><th>수료 여부 선택</th><th>최종</th></tr></thead>
      <tbody>${rows}</tbody></table></div>` : '<div class="panel empty"><p>아직 등록된 참여자가 없습니다.</p></div>'}`;
  document.querySelectorAll('[data-sc]').forEach(inp => inp.onchange = () => act(null, async () => {
    const tr = inp.closest('tr'), scores = {};
    tr.querySelectorAll('[data-sc]').forEach(i => { scores[i.dataset.sc] = i.value; });
    try { const r = await call('saveScores', c.강좌ID, tr.dataset.row, scores); S.detail = r; showDetail(r); toast('점수를 저장했습니다.'); }
    catch (e) { drawCompletion(); throw e; }
  }));
  document.querySelectorAll('[data-cp]').forEach(sel => sel.onchange = () => act(null, async () => {
    sel.disabled = true;
    try {
      const r = await call('setCompletion', c.강좌ID, sel.dataset.cp, sel.value);
      S.detail = r; showDetail(r);
      toast('수료 여부를 저장했습니다.');
    } catch (e) { sel.disabled = false; drawCompletion(); throw e; }
  }));
}

/* ---------- 수료증 ---------- */
function certFill(text, c) {
  const hrs = Math.round(Number(c.총회차) * Number(c.회당시간) * 10) / 10;
  const map = { 강좌명: c.강좌명, 기간: `${c.시작일} ~ ${c.종료일}`, 시간: hrs,
    수준: c.수준 || '', 지회: c.지회명, 기관명: c.기관명 || '' };
  return String(text || '').replace(/\{([^{}]+)\}/g, (m, k) => (k in map ? map[k] : m));
}
function certDateKo(s) {
  const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${m[1]}년 ${Number(m[2])}월 ${Number(m[3])}일` : '';
}
function certHtml(c, s, p, dateStr, seal) {
  const info = [

async function renderCert() {
  const body = $('#cTabBody'), c = S.detail.course;
  body.innerHTML = '<div class="panel empty"><p>불러오는 중…</p></div>';
  let info;
  try { info = await call('getCertInfo', c.강좌ID); S.seals = await call('getSeals').catch(() => ({ 지회: '', 센터: '' })); }
  catch (e) { if (e.code !== 'AUTH') toast(e.message, true); return; }

function certForm() {
  const v = id => $('#' + id).value;
  const mode = v('ctYm'), yv = v('ctYv').trim();
  const ym = mode === 'none' ? '없음' : (mode === 'custom' && yv ? yv : '자동');
  return { 제목: v('ctTitle'), 번호접두어: v('ctPre'), 번호연도: ym, 자리수: v('ctDig'), 문구: v('ctText'),
    기관명: v('ctOrg'), 직위: v('ctPos'), 성명: v('ctName') };
}

function drawCert(info) {
  const c = S.detail.course, s = info.setting, ppl = info.people;
  const crit = Number(c.수료기준);
  const ymv = s.번호연도 || '자동';
  const ymMode = ymv === '자동' ? 'auto' : (ymv === '없음' ? 'none' : 'custom');
  const ft = (id, label, val, ph, w) => `<div style="flex:${w || 1};min-width:140px"><label class="f" for="${id}">${label}</label>
    <input id="${id}" value="${esc(val)}" placeholder="${esc(ph || '')}"></div>`;
  let nextNo = Number(info.nextNo) || 1;
  // 번호 방식: 강좌·수준별 / 매년 이어서(연간 연속) / 계속 이어서(전체 연속)
  const base = String(c.파견ID || '') || c.지회명 === '도협회' ? '도협회' : String(c.지회명).replace(/(시|군)?지회$/, '');
  const lvTag = c.수준 && c.수준 !== '구분없음' ? base + '-' + c.수준 : base;
  const noModes = [['level', `강좌 수준별로 매년 새로 (예: ${lvTag}-${c.연도}-001)`], ['year', `지회 전체 매년 새로 · 연간 연속 (예: ${base}-${c.연도}-001)`],
    ['all', `지회 전체 계속 이어서 · 연도 없이 (예: ${base}-001)`], ['custom', '직접 정하기']];
  const curMode = s.번호접두어 === lvTag && ymv === '자동' && lvTag !== base ? 'level' : s.번호접두어 === base && ymv === '자동' ? 'year' : s.번호접두어 === base && ymv === '없음' ? 'all' : 'custom';
  const seals = S.seals || { 지회: '', 센터: '' };
  const sealDef = isAdmin() ? (seals.지회 ? '지회' : '') : c.주관 === '센터' && seals.센터 ? '센터' : (seals.지회 ? '지회' : (seals.센터 ? '센터' : ''));
  const rows = ppl.map(p => `<tr>
    <td style="width:36px"><input type="checkbox" data-cp="${esc(p.참여자ID)}" ${p.번호 ? '' : 'checked'}></td>
    <td><b>${esc(p.이름)}</b></td>
    <td class="r num">${n(p.출석횟수)}/${n(c.총회차)}회</td>
    <td class="num">${p.번호 ? esc(p.번호) : `<input type="text" inputmode="numeric" data-no="${esc(p.참여자ID)}" value="${nextNo++}" maxlength="40" style="width:110px" aria-label="${esc(p.이름)} 수료번호">`}</td></tr>`).join('');
  $('#cTabBody').innerHTML = `
    <details class="panel" ${info.saved ? '' : 'open'}>
      <summary style="cursor:pointer;font-weight:700">수료증 서식 ${info.saved ? '' : '(처음이에요. 확인하고 저장하세요)'}</summary>
      <div style="margin-top:12px"><label class="f" for="ctMode">번호 매기는 방식</label>
        <select id="ctMode" style="max-width:420px">${noModes.map(m => `<option value="${m[0]}" ${m[0] === curMode ? 'selected' : ''}>${m[1]}</option>`).join('')}</select>
        <p class="hint" style="margin:4px 0 0">같은 지회 안에서 <b>번호 앞부분과 연도가 같은 강좌끼리</b> 번호가 이어집니다. 고르면 아래 칸이 자동으로 채워집니다.</p></div>
      <div class="row" style="margin-top:12px;align-items:flex-end">
        ${ft('ctTitle', '제목', s.제목, '수 료 증')}
        ${ft('ctPre', '번호 앞부분 (비워도 됨)', s.번호접두어, '예: 춘천-초급')}
        <div style="flex:.8;min-width:130px"><label class="f" for="ctYm">번호 연도 부분</label>
          <select id="ctYm"><option value="auto" ${ymMode === 'auto' ? 'selected' : ''}>강좌 연도 (${esc(c.연도)})</option>
          <option value="custom" ${ymMode === 'custom' ? 'selected' : ''}>직접 입력</option>
          <option value="none" ${ymMode === 'none' ? 'selected' : ''}>넣지 않음</option></select></div>
        <div id="ctYvBox" style="flex:.6;min-width:90px"><label class="f" for="ctYv">연도 글자</label>
          <input id="ctYv" value="${esc(ymMode === 'custom' ? s.번호연도 : '')}" placeholder="예: 2027"></div>
        ${ft('ctDig', '번호 자리수', s.자리수, '3', .5)}</div>
      <p class="hint" id="ctNoEx"></p>
      <label class="f" for="ctText">문구</label>
      <textarea id="ctText" rows="3">${esc(s.문구)}</textarea>
      <p class="hint">문구 안에 {기간} {강좌명} {시간} {수준} {지회} 를 쓰면 이 강좌 내용으로 자동으로 바뀝니다.
        수료자 이름은 문구 위에 따로 인쇄됩니다.</p>
      <div class="row" style="align-items:flex-end">
        ${ft('ctOrg', '발급 기관', s.기관명, '예: 춘천시지회', 1.5)}
        ${ft('ctPos', '전달자 직위', s.직위, '예: 지회장')}
        ${ft('ctName', '전달자 성명', s.성명, '예: 홍길동')}</div>
      <p class="hint">직인 이미지를 등록하지 않았거나 '넣지 않음'을 고르면 (인) 자리에 직접 날인하세요.</p>
      <div class="row"><span class="spacer"></span><button class="btn" id="ctSave">서식 저장</button></div>
    </details>
    <div class="panel">
      <h3>수료자 (${Object.keys(weightsOf(c)).length ? '수료 기준 총점 ' + n(crit) + '점 이상' : '수료 기준 ' + n(crit) + '% 이상'})</h3>
      ${ppl.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th></th><th>이름</th>
        <th class="r">출석</th><th>수료증 번호 (직접 입력)</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="row" style="margin-top:12px">
        <label class="f" for="ctDate" style="margin:0">발급일</label>
        <input type="date" id="ctDate" style="width:auto" value="${esc(todayStr())}">
        <label class="f" for="ctSeal" style="margin:0 0 0 12px">직인</label>
        <select id="ctSeal" style="width:auto"><option value="" ${sealDef === '' ? 'selected' : ''}>넣지 않음 (직접 날인)</option>
          <option value="지회" ${sealDef === '지회' ? 'selected' : ''} ${seals.지회 ? '' : 'disabled'}>${isAdmin() ? '도협회' : '지회'} 직인${seals.지회 ? '' : ' (등록 안 됨)'}</option>
          <option value="센터" ${sealDef === '센터' ? 'selected' : ''} ${seals.센터 ? '' : 'disabled'}>${isAdmin() ? '도센터' : '센터'} 직인${seals.센터 ? '' : ' (등록 안 됨)'}</option></select>
        <span class="spacer"></span>
        <button class="btn primary" id="ctIssue">선택한 사람 발급 · 인쇄 / PDF</button></div>
      <p class="hint">수료번호는 담당자가 직접 입력합니다. 숫자만 쓰면 위 서식(앞부분-연도-자리수)에 맞춰 붙고(예: 8 → 춘천-2026-008), 한 지회 안에서는 겹칠 수 없습니다. 비워 두면 다음 번호가 자동으로 붙습니다. 대장에는 번호 순서대로 표시됩니다.<br>
        이미 번호가 있는 사람은 같은 번호와 처음 발급한 날짜로 다시 인쇄됩니다. 직인 이미지는 <b>내 정보</b>에서 지회 직인과 센터 직인을 따로 등록합니다.</p>`
      : '<div class="empty"><p>아직 수료 기준을 채운 사람이 없습니다. 출석을 입력하면 여기에 나타납니다.</p></div>'}
    </div>
    <div class="panel"><h3>미리보기</h3><p class="hint">저장·인쇄 전에 모양을 확인하세요.
      번호는 샘플입니다.</p><div class="cert-prev" id="ctPrev"></div></div>`;
  const sealImg = () => { const el = $('#ctSeal'); return el && el.value ? seals[el.value] : ''; };
  const prev = () => {
    const f = certForm();
    const first = ppl.find(p => (document.querySelector(`[data-cp="${p.참여자ID}"]`) || {}).checked) || ppl[0];
    const who = first ? { 이름: first.이름, 번호: first.번호 } : { 이름: '홍길동' };
    const dig = Math.max(1, Math.min(6, Number(f.자리수) || 3));
    const yp = f.번호연도 === '자동' ? String(c.연도) : (f.번호연도 === '없음' ? '' : f.번호연도);
    const head = [f.번호접두어.trim(), yp].filter(Boolean).map(x => x + '-').join('');
    const sample = head + '1'.padStart(dig, '0');
    if (!who.번호) who.번호 = sample;
    $('#ctNoEx').textContent = `번호 예: ${sample}  (그다음은 ${head}${'2'.padStart(dig, '0')}, ${head}${'3'.padStart(dig, '0')})`;
    $('#ctPrev').innerHTML = certHtml(c, f, who, $('#ctDate') ? $('#ctDate').value : todayStr(), sealImg());
  };
  const ymBox = () => { $('#ctYvBox').style.display = $('#ctYm').value === 'custom' ? '' : 'none'; };
  ymBox();
  document.querySelectorAll('#cTabBody input, #cTabBody select, #cTabBody textarea').forEach(i => { i.oninput = prev; i.onchange = () => { ymBox(); prev(); }; });
  $('#ctMode').onchange = () => { const m = $('#ctMode').value; if (m === 'custom') return;
    $('#ctPre').value = m === 'level' ? lvTag : base; $('#ctYm').value = m === 'all' ? 'none' : 'auto'; ymBox(); prev();
    toast('번호 방식을 바꿨습니다. [서식 저장]을 눌러야 적용됩니다.'); };
  ['ctPre', 'ctYm', 'ctYv'].forEach(id => { const el = $('#' + id), f0 = el.oninput; el.oninput = () => { $('#ctMode').value = 'custom'; f0(); }; });
  prev();
  $('#ctSave').onclick = () => act($('#ctSave'), async () => {
    const r = await call('saveCertSetting', c.강좌ID, certForm());
    toast('수료증 서식을 저장했습니다.');
    drawCert(r);
  });
  const btn = $('#ctIssue');
  if (btn) btn.onclick = () => act(btn, async () => {
    const ids = [...document.querySelectorAll('[data-cp]')].filter(x => x.checked).map(x => x.dataset.cp);
    if (!ids.length) { toast('발급할 사람을 선택하세요.', true); return; }
    await call('saveCertSetting', c.강좌ID, certForm());
    const numbers = {};
    ids.forEach(id => { const inp = document.querySelector(`[data-no="${id}"]`); if (inp && inp.value.trim()) numbers[id] = inp.value.trim(); });
    const seal = sealImg();
    const r = await call('issueCerts', c.강좌ID, ids, $('#ctDate').value, numbers);
    toast(r.issuedNow ? `${r.issuedNow}명 새로 발급했습니다.` : '이미 발급된 번호로 다시 인쇄합니다.');
    drawCert(r);
    printCerts(c, r.setting, r.certs, seal);
  });
}

function printCerts(c, s, certs, seal) {
  $('#printArea').innerHTML = certs.map(p => certHtml(c, s, p, p.발급일, seal)).join('');
  let st = document.getElementById('pageStyle');
  if (!st) { st = document.createElement('style'); st.id = 'pageStyle'; document.head.appendChild(st); }
  st.textContent = '@page { size: A4 portrait; margin: 0; }';
  const clear = () => { $('#printArea').innerHTML = ''; window.removeEventListener('afterprint', clear); };
  window.addEventListener('afterprint', clear);
  setTimeout(() => window.print(), 60);
}

    <button type="button" class="btn small ${got ? '' : 'primary'}" id="cfToggle">${got ? '받은 표시 취소' : '종이 서명본 받았어요'}</button></div></div>`;
}
function confirmRows(d, doc) {
  const c = d.course, total = Number(c.총회차) || 0, rows = [];
  for (let k = 1; k <= total; k++) {
    let date = '', cnt = '';
    if (d.명단숨김) { const s = (d.sessions || []).find(x => x.회차 === k); if (s) { date = s.수업일 || ''; cnt = s.출석; } }
    else if (isHead(c)) { if (d.headcounts && d.headcounts[k] !== undefined) { date = (d.dates || {})[k] || ''; cnt = d.headcounts[k]; } }
    else {
      const held = d.participants.some(p => ((d.attendance || {})[p.참여자ID] || {})[k] !== undefined);
      if (held) { date = (d.dates || {})[k] || ''; cnt = d.participants.filter(p => ((d.attendance || {})[p.참여자ID] || {})[k] === 'O').length; }
    }
    rows.push({ n: k, date: date, cnt: cnt, text: doc && doc.내용 ? (doc.내용[k - 1] || '') : '' });
  }
  return rows;
}

/* 기록된 회차 / 처음 열 회차 */
function sessionDone(d, s) {
  if (isHead(d.course)) return d.headcounts && d.headcounts[s] !== undefined;
  return Object.keys(d.attendance).some(pid => d.attendance[pid][s] !== undefined);
}
function firstOpenSession(d) {
  const t = Number(d.course.총회차);
  for (let s = 1; s <= t; s++) if (!sessionDone(d, s)) return s;
  return t;
}

function todayStr() { const t = new Date(), p = x => String(x).padStart(2, '0'); return `${t.getFullYear()}-${p(t.getMonth() + 1)}-${p(t.getDate())}`; }
function curDate(d) { if (!S.sdate) S.sdate = (d.dates || {})[S.session] || todayStr(); return S.sdate; }
function dateRow(d) {

}

  const d = S.detail, c = d.course, total = Number(c.총회차), body = $('#cTabBody');

    const nd = await call('saveHeadcount', c.강좌ID, sn, input.value, S.sdate);

    showDetail(nd);
  });

function korMoney(n) {   // 80000 → 팔만
  n = Math.floor(Number(n) || 0); if (!n) return '영';
  const d = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'], u = ['', '십', '백', '천'], big = ['', '만', '억', '조'];
  let out = '', g = 0;
  while (n > 0) {
    const part = n % 10000; n = Math.floor(n / 10000);
    let t = '';
    for (let i = 0; i < 4; i++) { const x = Math.floor(part / Math.pow(10, i)) % 10; if (x) t = (x === 1 && i > 0 ? '' : d[x]) + u[i] + t; }
    if (t) out = t + big[g] + out;
    g++;
  }
  return out;
}
function moneyKo(n) { return (Number(n) || 0).toLocaleString('ko-KR') + '원'; }

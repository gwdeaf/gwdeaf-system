<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>통역일지</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Malgun Gothic", "맑은 고딕", sans-serif; background: #f5f7fb; color: #222; font-size: 15px; }
  header { background: #2f5bd6; color: #fff; padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  header h1 { font-size: 18px; margin: 0; }
  header .who { font-size: 13px; opacity: .9; }
  nav { background: #fff; border-bottom: 1px solid #dde3ea; padding: 8px 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  main { padding: 16px; max-width: 860px; margin: 0 auto; }
  .screen { display: none; } .screen.on { display: block; }
  h2 { font-size: 18px; margin: 4px 0 12px; }
  .card { background: #fff; border: 1px solid #dde3ea; border-radius: 8px; padding: 16px; margin-bottom: 14px; }
  button { font: inherit; cursor: pointer; border: 1px solid #2f5bd6; background: #fff; color: #2f5bd6; border-radius: 6px; padding: 7px 12px; margin: 2px; }
  button.main { background: #2f5bd6; color: #fff; }
  button:disabled { opacity: .4; cursor: default; }
  button.tab.on { background: #dfeaf5; font-weight: bold; }
  input, select, textarea { font: inherit; padding: 6px 8px; border: 1px solid #bfc8d2; border-radius: 6px; width: 100%; background: #fff; }
  textarea { min-height: 100px; }
  label { display: block; font-size: 13px; color: #555; margin: 8px 0 3px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 150px; }
  table { width: 100%; border-collapse: collapse; background: #fff; font-size: 14px; }
  th, td { border-bottom: 1px solid #e6eaef; padding: 7px 6px; text-align: left; vertical-align: top; }
  th { background: #f0f4f8; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; background: #e6eaef; }
  .badge.ok { background: #d6f0dc; } .badge.err { background: #f8d7d3; } .badge.wait { background: #fff1c2; }
  .msg { margin: 8px 0; font-size: 14px; } .msg .err { color: #b03a2e; } .msg .ok { color: #1e7a3c; }
  .muted { color: #777; font-size: 13px; }
  .fav { display: flex; gap: 6px; flex-wrap: wrap; } .fav button { flex: 1 1 30%; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body.embed header, body.embed #logoutBtn { display: none; }
  @media (max-width: 640px) {
    main { padding: 10px; } .card { padding: 12px; } nav { padding: 6px 8px; } nav button { flex: 1 1 auto; }
    button, select, input { min-height: 42px; } .row > div { min-width: 46%; }
    .list table { display: block; overflow-x: auto; white-space: nowrap; }
  }
</style>
<link rel="stylesheet" href="/ui.css?v=1">
</head>
<body>
<header><h1>통역일지</h1><div class="who" id="whoText"></div></header>
<nav id="topNav" style="display:none">
  <button class="tab on" data-tab="write" onclick="setTab('write')">일지 쓰기</button>
  <button class="tab" data-tab="mine" onclick="setTab('mine')">내 기록</button>
  <button class="tab" data-tab="all" id="allBtn" onclick="setTab('all')" style="display:none">지회 전체 기록</button>
  <button id="logoutBtn" onclick="logout()">로그아웃</button>
</nav>
<main>
  <section id="screenLogin" class="screen"><div class="card"><h2>로그인</h2>
    <p>업무용 구글 계정(@gwdeaf.or.kr)으로 로그인하세요.</p>
    <button class="main" onclick="loginGoogle()">구글 계정으로 로그인</button><div id="loginMsg" class="msg"></div></div></section>
  <section id="screenDenied" class="screen"><div class="card"><h2>사용 권한이 없습니다</h2>
    <p id="deniedText">이 계정은 직원으로 등록되지 않았거나 사용이 중지되어 있습니다. 지회 담당자에게 등록을 요청하세요.</p>
    <button onclick="logout()">다른 계정으로 로그인</button></div></section>

  <section id="screenWrite" class="screen">
    <h2>통역일지 쓰기</h2>
    <div class="card"><b style="font-size:13px">⭐ 즐겨찾기 불러오기</b>
      <div class="fav" id="favLoad"></div></div>
    <div class="card">
      <div class="row">
        <div><label>날짜</label><input type="date" id="date"></div>
        <div><label>시작시간</label><input id="startTime" inputmode="numeric" maxlength="5" placeholder="09:00" oninput="fmtTime(this)"></div>
        <div><label>종료시간</label><input id="endTime" inputmode="numeric" maxlength="5" placeholder="18:00" oninput="fmtTime(this)"></div>
      </div>
      <div class="row">
        <div><label>구분</label><select id="type"><option>출장</option><option>내방</option><option>전화</option></select></div>
        <div><label>의뢰방법</label><select id="method"><option selected>내방</option><option>인터넷</option><option>문자</option><option>영상전화</option><option>전화</option><option>기타(문서)</option></select></div>
        <div><label>의뢰자</label><input id="client" placeholder="예: 회원명, 도센터"></div>
      </div>
      <div class="row">
        <div><label>장소</label><input id="location" placeholder="예: 사무실"></div>
        <div><label>종류</label><select id="category"><option selected>일상생활</option><option>행사</option><option>법률</option><option>교육</option><option>의료</option><option>방송</option><option>취업알선</option></select></div>
        <div><label>방법</label><select id="way"><option>수어음성통역</option><option>중계통역</option><option>기타</option></select></div>
      </div>
      <div class="row">
        <div><label>대상</label><select id="target"><option>농인</option><option>문맹농인</option><option>청인</option><option>기타</option></select></div>
        <div><label>농인 인원</label><input type="number" id="deafCount" value="1" min="0"></div>
        <div><label>청인 인원</label><input type="number" id="hearingCount" value="0" min="0"></div>
      </div>
      <label>통역내용</label><textarea id="content" placeholder="통역 상세 내용을 입력하세요"></textarea>
      <div style="margin-top:10px"><button class="main" id="saveBtn" onclick="submitLog()">💾 통역일지 저장</button></div>
      <div id="writeMsg" class="msg"></div>
    </div>
    <div class="card"><b style="font-size:13px">⭐ 지금 입력한 내용을 즐겨찾기에 저장</b>
      <div><button onclick="savePreset(1)">1번에 저장</button><button onclick="savePreset(2)">2번에 저장</button><button onclick="savePreset(3)">3번에 저장</button></div>
      <div id="favMsg" class="msg"></div></div>
  </section>

  <section id="screenList" class="screen list">
    <h2 id="listTitle">내 기록</h2>
    <div class="card"><div class="row">
      <div><label>시작일</label><input type="date" id="from"></div>
      <div><label>종료일</label><input type="date" id="to"></div>
      <div style="flex:0 0 auto;align-self:flex-end"><button class="main" onclick="loadList()">조회</button></div></div>
      <div id="listMsg" class="msg"></div></div>
    <div class="card" style="overflow-x:auto"><table><thead id="listHead"></thead><tbody id="listBody"></tbody></table></div>
  </section>
</main>

<script>
const SUPABASE_URL = 'https://uamlualqqcqmpdkprjfs.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhbWx1YWxxcWNxbXBka3ByamZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwNjE0OTMsImV4cCI6MjExMDYzNzQ5M30._f4p4pfcKaYbmjKRXOPpkMo7Ydcc26oVVI6lRFYsLkY';
const ALLOWED_DOMAIN = 'gwdeaf.or.kr';
const EMBED = new URLSearchParams(location.search).get('embed') === '1';
if (EMBED) document.body.classList.add('embed');
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let me = null, tab = 'write', presets = {};
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const errText = (e) => (e && (e.message || e.error_description)) || '알 수 없는 오류가 났습니다.';
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
function showScreen(id) { document.querySelectorAll('.screen').forEach((s) => s.classList.remove('on')); $(id).classList.add('on'); }
function msg(el, text, ok) { $(el).innerHTML = text ? `<span class="${ok ? 'ok' : 'err'}">${esc(text)}</span>` : ''; }
function fmtTime(el) { const v = el.value.replace(/[^0-9]/g, ''); el.value = v.length >= 3 ? v.slice(0, 2) + ':' + v.slice(2, 4) : v; }
const okTime = (s) => /^([01]\d|2[0-3]):[0-5]\d$/.test(s);

async function loginGoogle() {
  msg('loginMsg', '');
  const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname, queryParams: { hd: ALLOWED_DOMAIN, prompt: 'select_account' } } });
  if (error) msg('loginMsg', errText(error));
}
async function logout() { await sb.auth.signOut(); location.href = location.origin + location.pathname; }
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('topNav').style.display = 'none'; showScreen('screenLogin'); return; }
  const { data, error } = await sb.rpc('interp_me');
  if (error) { alert(errText(error)); return; }
  if (!data) { $('topNav').style.display = 'none'; showScreen('screenDenied'); return; }
  me = data;
  $('whoText').textContent = `${me.chapter_name} · ${me.name} (${me.email})`;
  $('topNav').style.display = 'flex';
  $('allBtn').style.display = me.can_view ? '' : 'none';
  $('date').value = today();
  try { const r = await sb.rpc('interp_presets_get'); presets = r.data || {}; } catch (e) { presets = {}; }
  drawFav();
  setTab('write');
}
sb.auth.onAuthStateChange((event) => { if (event === 'SIGNED_IN') boot(); });

function setTab(t) {
  tab = t;
  document.querySelectorAll('[data-tab]').forEach((b) => b.classList.toggle('on', b.dataset.tab === t));
  if (t === 'write') {
    showScreen('screenWrite');
    if (!me.can_write) msg('writeMsg', '통역일지 입력 권한이 없습니다. 지회 담당자에게 요청하세요. (기록 조회는 가능)');
    return;
  }
  showScreen('screenList');
  $('listTitle').textContent = t === 'all' ? '지회 전체 기록' : '내 기록';
  if (!$('from').value) { const d = new Date(); d.setDate(1); $('from').value = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01'; $('to').value = today(); }
  loadList();
}
async function loadList() {
  msg('listMsg', '');
  const { data, error } = await sb.rpc('interp_list', { p_from: $('from').value || null, p_to: $('to').value || null, p_all: tab === 'all' });
  if (error) return msg('listMsg', errText(error));
  const all = tab === 'all';
  $('listHead').innerHTML = '<tr><th>날짜</th><th>시간</th>' + (all ? '<th>통역사</th>' : '') + '<th>구분</th><th>의뢰자</th><th>장소</th><th>종류</th><th>대상</th><th>인원(농/청)</th><th>내용</th><th>시트</th></tr>';
  const st = { ok: ['ok', '기록됨'], skip: ['wait', '연결 안 됨'], error: ['err', '실패'] };
  $('listBody').innerHTML = (data || []).map((r) => {
    const s = st[r.sheet_status] || ['wait', '대기'];
    return `<tr><td>${esc(r.log_date)}</td><td>${esc(r.start_time)}~${esc(r.end_time)}</td>${all ? '<td>' + esc(r.interpreter_name) + '</td>' : ''}<td>${esc(r.type)}</td><td>${esc(r.client)}</td><td>${esc(r.location)}</td><td>${esc(r.category)}</td><td>${esc(r.target)}</td><td>${r.deaf_count}/${r.hearing_count}</td><td>${esc(r.content)}</td><td><span class="badge ${s[0]}">${s[1]}</span></td></tr>`;
  }).join('') || '<tr><td colspan="11" class="muted">기록이 없습니다.</td></tr>';
}

const FIELDS = ['startTime', 'endTime', 'type', 'method', 'client', 'location', 'category', 'way', 'target', 'deafCount', 'hearingCount', 'content'];
function formData() { const o = {}; FIELDS.forEach((f) => { o[f] = $(f).value; }); return o; }
async function gdrive(body) {
  const { data: { session } } = await sb.auth.getSession();
  const r = await fetch(SUPABASE_URL + '/functions/v1/gdrive', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token, apikey: SUPABASE_ANON_KEY }, body: JSON.stringify(body) });
  const t = await r.text();
  try { return JSON.parse(t); } catch (e) { return { ok: false, msg: '응답을 읽을 수 없습니다.' }; }
}
async function submitLog() {
  msg('writeMsg', '');
  const p = Object.assign({ date: $('date').value }, formData());
  if (!p.date) return msg('writeMsg', '날짜를 입력해 주세요.');
  if (!okTime(p.startTime.trim())) return msg('writeMsg', '시작시간을 00:00 ~ 23:59 형식으로 입력해 주세요.');
  if (!okTime(p.endTime.trim())) return msg('writeMsg', '종료시간을 00:00 ~ 23:59 형식으로 입력해 주세요.');
  if (!p.client.trim()) return msg('writeMsg', '의뢰자를 입력해 주세요.');
  $('saveBtn').disabled = true; msg('writeMsg', '저장 중입니다...', true);
  try {
    const { data, error } = await sb.rpc('interp_save', { p });
    if (error) return msg('writeMsg', errText(error));
    let note = '';
    const r = await gdrive({ action: 'interpAppend', id: data.id });   // 구글 시트(통역 탭)에도 기록
    if (r.ok && !r.skipped) note = ' 구글 시트에도 기록했습니다.';
    else if (r.skipped) note = ' (구글 시트가 연결되지 않아 시스템에만 저장했습니다.)';
    else note = ' 단, 구글 시트 기록은 실패했습니다: ' + (r.msg || '');
    msg('writeMsg', '저장 완료!' + note, r.ok !== false);
    ['client', 'location', 'content'].forEach((f) => { $(f).value = ''; });
    $('deafCount').value = 1; $('hearingCount').value = 0;
  } catch (e) { msg('writeMsg', errText(e)); }
  finally { $('saveBtn').disabled = false; }
}

function drawFav() {
  $('favLoad').innerHTML = [1, 2, 3].map((n) => { const d = presets[n]; return `<button onclick="loadPreset(${n})">⭐ ${n}번${d ? ': ' + esc(d.client || d.location || '저장건') : ' (비어 있음)'}</button>`; }).join('');
}
function loadPreset(n) {
  const d = presets[n];
  if (!d) return msg('writeMsg', n + '번에 저장된 즐겨찾기가 없습니다.');
  FIELDS.forEach((f) => { if (d[f] !== undefined && d[f] !== null) $(f).value = d[f]; });
  msg('writeMsg', n + '번 즐겨찾기를 불러왔습니다.', true);
}
async function savePreset(n) {
  const d = formData();
  if (!d.client && !d.location) return msg('favMsg', '의뢰자나 장소를 먼저 입력해 주세요.');
  const { error } = await sb.rpc('interp_preset_save', { p_num: n, p_data: d });
  if (error) return msg('favMsg', errText(error));
  presets[n] = d; drawFav(); msg('favMsg', n + '번에 저장했습니다.', true);
}
boot();
</script>
</body>
</html>

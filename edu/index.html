/* QR 출석이 출석부에 바로 보이도록 6초마다 확인 (출석 체크 화면을 보고 있을 때만) */
function startAttPoll(d) {
  clearInterval(S.attPoll);
  if (!webMode() || d.locked || isHead(d.course)) return;
  const cid = d.course.강좌ID;
  S.attPoll = setInterval(async () => {
    if (!$('#names') || !S.detail || S.detail.course.강좌ID !== cid || S.cTab !== 'att') { clearInterval(S.attPoll); return; }
    if (document.hidden) return;
    const sn = S.session, r = await quietCall('getAttendNow', cid, sn);
    if (!r || S.session !== sn || !$('#names') || !S.detail || S.detail.course.강좌ID !== cid) return;
    let added = 0;
    r.출석.forEach(pid => {
      const A = S.detail.attendance[pid] = S.detail.attendance[pid] || {};
      if (A[sn] !== 'O') { A[sn] = 'O'; const p = S.detail.participants.find(x => x.참여자ID === pid); if (p) p.출석횟수 = (Number(p.출석횟수) || 0) + 1; }
      if (S.draft && !S.draft[pid]) {
        S.draft[pid] = true; added++;
        const b = [...document.querySelectorAll('#names .name')].find(x => x.dataset.pid === pid);
        if (b) { b.setAttribute('aria-pressed', 'true'); b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 2500); }
      }
    });
    if (added) {
      const of = $('.att-head .of b'); if (of && S.draft) of.textContent = Object.keys(S.draft).length;
      const rb = $('#rail') && $('#rail').querySelector(`[data-s="${sn}"]`); if (rb) rb.classList.add('done');
      toast(`QR로 ${added}명이 출석했습니다.`, false);
    }
    const qc = $('#qrCnt'); if (qc && r.지금회차) qc.textContent = r.지금회차QR수;
  }, 6000);
}

        b.사람.forEach(p => rows.push(['', p.이름, p.연락처, ...Array.from({ length: c.총회차 }, (_, k) => p.출석[k + 1] || ''), p.횟수, p.상태]));
      }
      rows.push([]);
    });
    out.push({ name: '출석부(전체)', rows, bold });
  }
  return out;
}
async function exportYear(year, chapter) {

/* =========================================================

/* ---------- 지회별 비교 (모든 지회 보고가 들어오면 표시) ---------- */
const CMP_METRICS = [['연인원', '연인원', '명'], ['수료인원', '수료인원', '명'], ['실인원', '실인원', '명'], ['강좌수', '강좌 수', '개'], ['총강의시간', '총 강의시간', '시간']];
S.cmpMetric = '연인원'; S.cmpView = 'chart';

function renderCompare() {
  const d = S.statusData, box = $('#cmp');
  if (!d || !box) return;
  const c = d.counts, total = c.전체;
  const ready = total > 0 && c.미제출 === 0 && c.반려 === 0;
  if (!ready) {
    const done = total - c.미제출 - c.반려;
    box.innerHTML = `<div class="panel"><h3>지회별 비교</h3>
      <p class="sub" style="margin:0">모든 지회의 보고가 들어오면 비교 그래프가 나옵니다. (제출 ${done} / ${total}개 지회)</p></div>`;
    return;
  }
  const m = CMP_METRICS.find(x => x[0] === S.cmpMetric) || CMP_METRICS[0];
  const key = m[0], unit = m[2];
  const order = d.rows.map(r => r.지회명);
  const rows = d.rows.map(r => ({ ch: r.지회명, v: Number(r.수치[key]) || 0, t: r.수치 }))
    .sort((a, b) => b.v - a.v || order.indexOf(a.ch) - order.indexOf(b.ch));
  const max = Math.max(1, ...rows.map(r => r.v));
  const sum = rows.reduce((a, r) => a + r.v, 0);
  const avg = Math.round(sum / rows.length * 10) / 10;
  const fmt = v => (Math.round(v * 10) / 10).toLocaleString('ko-KR');

  const chips = CMP_METRICS.map(x => `<button type="button" class="chip" data-m="${x[0]}" aria-pressed="${x[0] === key}">${x[1]}</button>`).join('');
  const view = S.cmpView === 'table'
    ? `<div class="tbl-wrap"><table class="tbl num"><thead><tr><th>순위</th><th>지회</th><th class="r">강좌</th><th class="r">실인원</th><th class="r">연인원</th><th class="r">수료</th><th class="r">시간</th></tr></thead>
        <tbody>${rows.map((r, i) => `<tr><td>${i + 1}</td><td><b>${esc(r.ch)}</b></td><td class="r">${n(r.t.강좌수)}</td><td class="r">${n(r.t.실인원)}</td><td class="r">${n(r.t.연인원)}</td><td class="r">${n(r.t.수료인원)}</td><td class="r">${esc(r.t.총강의시간 || 0)}</td></tr>`).join('')}</tbody></table></div>`
    : `<div role="list" aria-label="지회별 ${esc(m[1])}">${rows.map((r, i) => `
        <div class="cmp-row" role="listitem" tabindex="0" data-i="${i}" aria-label="${i + 1}위 ${esc(r.ch)} ${fmt(r.v)}${unit}">
          <span class="cmp-name">${esc(r.ch)}</span>
          <span class="cmp-track"><span class="cmp-bar" style="width:calc((100% - 60px) * ${r.v / max})"></span><span class="cmp-val">${fmt(r.v)}</span></span>
        </div>`).join('')}</div>`;

  box.innerHTML = `<div class="panel">
    <div class="row"><h3 style="margin:0">지회별 비교</h3><span class="spacer"></span>
      <button type="button" class="btn small" id="cmpView">${S.cmpView === 'table' ? '그래프로 보기' : '표로 보기'}</button></div>
    <p class="cmp-meta">${d.연도}년 ${esc(d.반기)} / ${esc(m[1])} 많은 순 / 전체 합계 ${fmt(sum)}${unit}, 지회 평균 ${fmt(avg)}${unit}</p>
    <div class="cmp-chips" role="group" aria-label="비교할 항목">${chips}</div>
    ${view}</div>`;

  box.querySelectorAll('.chip').forEach(b => b.onclick = () => { S.cmpMetric = b.dataset.m; renderCompare(); });
  $('#cmpView').onclick = () => { S.cmpView = S.cmpView === 'table' ? 'chart' : 'table'; renderCompare(); };

  // 막대에 마우스를 올리거나 키보드로 이동하면 값 표시
  let tip = document.querySelector('.tip');
  if (!tip) { tip = document.createElement('div'); tip.className = 'tip hidden'; tip.setAttribute('role', 'tooltip'); document.body.appendChild(tip); }
  const show = (row, x, y) => {
    const r = rows[Number(row.dataset.i)];
    tip.replaceChildren();
    const b = document.createElement('b'); b.textContent = `${fmt(r.v)}${unit}`;
    const sp = document.createElement('span'); sp.textContent = `${Number(row.dataset.i) + 1}위 ${r.ch} / 평균 대비 ${r.v >= avg ? '+' : ''}${fmt(r.v - avg)}`;
    tip.append(b, sp);
    tip.classList.remove('hidden');
    const w = tip.offsetWidth;
    tip.style.left = Math.max(8, Math.min(x + 14, window.innerWidth - w - 8)) + 'px';
    tip.style.top = Math.max(8, y - tip.offsetHeight - 10) + 'px';
  };
  const hide = () => tip.classList.add('hidden');
  box.querySelectorAll('.cmp-row').forEach(row => {
    row.onpointermove = e => show(row, e.clientX, e.clientY);
    row.onpointerleave = hide;
    row.onfocus = () => { const q = row.getBoundingClientRect(); show(row, q.left + 120, q.top); };
    row.onblur = hide;
  });
}

/* =========================================================
   인쇄 (결재란 3칸 / 4칸, 직위·성명 선택)
   ========================================================= */
const ROLES = ['담당', '팀장', '사무국장', '센터장', '원장', '협회장'];
const AP_KEY = 'approvalCfg';
const LINE_NAMES = { 지회: '지회용', 센터: '센터용' };
function apDefaultLine() { return { n: 3, cells: [{ role: '담당', name: '' }, { role: '팀장', name: '' }, { role: '원장', name: '' }, { role: '협회장', name: '' }] }; }
function apDefault() { return { orient: 'portrait', last: '지회', lines: { 지회: apDefaultLine(), 센터: apDefaultLine() } }; }
const apLineOk = l => l && [0, 3, 4].includes(l.n) && Array.isArray(l.cells) && l.cells.length === 4;
/* 예전 모양({n, cells, orient})도 새 모양({orient, last, lines})으로 */
function apNorm(v) {
  if (!v) return null;
  if (v.lines && apLineOk(v.lines.지회) && apLineOk(v.lines.센터)) return { orient: v.orient === 'landscape' ? 'landscape' : 'portrait', last: v.last === '센터' ? '센터' : '지회', lines: v.lines };
  if (apLineOk(v)) return { orient: v.orient === 'landscape' ? 'landscape' : 'portrait', last: '지회', lines: { 지회: { n: v.n, cells: v.cells }, 센터: { n: v.n, cells: v.cells } } };
  return null;
}
function apLoad() {
  const sv = apNorm(S.init && S.init.printCfg);   // 서버에 저장된 계정별 설정이 우선
  if (sv) return sv;
  try { const v = apNorm(JSON.parse(localStorage.getItem(AP_KEY))); if (v) return v; } catch (e) {}
  return apDefault();
}
function apSave(v) {
  try { localStorage.setItem(AP_KEY, JSON.stringify(v)); } catch (e) {}
  if (S.init) S.init.printCfg = v;
  call('savePrintSettings', v).catch(e => { if (e.code !== 'AUTH') toast('인쇄 설정을 서버에 저장하지 못했습니다. 이 기기에서만 적용됩니다.', true); });
}

/* 인쇄 설정 창. opt: { orient: 용지 방향 우선값, line: '지회'|'센터' 먼저 고를 결재라인, scope: true면 인쇄 범위(전체/지회 주관/센터 주관) 선택 표시 }
   → { cfg: {n, cells}, line, scope, orient } 또는 null */
function printSetup(opt) {
  opt = opt || {};
  return new Promise(resolve => {
    const saved = apLoad(), d = $('#dlg');
    const st = { line: showOrg() ? (opt.line || saved.last) : '지회', scope: '전체', orient: opt.orient || saved.orient, lines: JSON.parse(JSON.stringify(saved.lines)) };
    const cell = (c, i) => {
      const preset = ROLES.includes(c.role);
      return `<div class="ap-row" data-i="${i}"><b>${i + 1}</b>
        <select class="ap-role" aria-label="${i + 1}번째 직위">${ROLES.map(r => `<option ${preset && c.role === r ? 'selected' : ''}>${r}</option>`).join('')}<option value="__c" ${preset ? '' : 'selected'}>직접 입력</option></select>
        <input class="ap-name" placeholder="성명 (비워두면 서명란)" value="${esc(c.name)}" maxlength="10">
        <input class="ap-custom ${preset ? 'hidden' : ''}" placeholder="직위 직접 입력 (예: 사무처장)" value="${preset ? '' : esc(c.role)}" maxlength="8"></div>`;
    };
    const radio = (name, v, t, on) => `<label style="display:flex;gap:8px;align-items:center;min-height:40px"><input type="radio" name="${name}" value="${v}" ${on ? 'checked' : ''} style="width:20px;height:20px"> ${t}</label>`;
    const pick = name => { const e = document.querySelector(`input[name="${name}"]:checked`); return e ? e.value : ''; };
    const collect = () => {   // 화면에 적힌 값을 st에 옮김
      if (!document.querySelector('#apCells')) return;
      st.lines[st.line] = {
        n: Number(pick('apN')),
        cells: [...document.querySelectorAll('#apCells .ap-row')].map(r => {
          const sel = r.querySelector('.ap-role').value;
          return { role: (sel === '__c' ? r.querySelector('.ap-custom').value.trim() : sel) || '확인', name: r.querySelector('.ap-name').value.trim() };
        })
      };
      st.orient = pick('apO') || st.orient;
    };
    const draw = () => {
      const L = st.lines[st.line];
      $('#dlgBody').innerHTML = `<h3 style="margin:0 0 12px">인쇄 설정</h3>
        ${opt.scope && showOrg() ? `<label class="f">인쇄 범위</label><div class="row" style="gap:14px;margin-bottom:6px">${radio('apS', '전체', '전체', st.scope === '전체')}${radio('apS', '지회', '지회 주관만', st.scope === '지회')}${radio('apS', '센터', '센터 주관만', st.scope === '센터')}</div>` : ''}
        ${opt.noAppr ? '' : `${showOrg() ? `<label class="f">결재라인</label>
        <div class="row" style="gap:16px;margin-bottom:6px">${radio('apL', '지회', '지회용', st.line === '지회')}${radio('apL', '센터', '센터용', st.line === '센터')}</div>` : ''}
        <label class="f">${showOrg() ? LINE_NAMES[st.line] + ' ' : ''}결재란</label>
        <div class="row" style="gap:16px;margin-bottom:10px">${radio('apN', 3, '3칸', L.n === 3)}${radio('apN', 4, '4칸', L.n === 4)}${radio('apN', 0, '없음', L.n === 0)}</div>
        <div id="apCells">${L.cells.map(cell).join('')}</div>`}
        <label class="f" style="margin-top:10px">용지 방향</label>
        <div class="row" style="gap:16px">${radio('apO', 'portrait', '세로', st.orient !== 'landscape')}${radio('apO', 'landscape', '가로', st.orient === 'landscape')}</div>`;
      sync();
    };
    const sync = () => {
      const nn = Number(pick('apN'));
      document.querySelectorAll('#apCells .ap-row').forEach((r, i) => {
        r.classList.toggle('hidden', i >= nn);
        r.querySelector('.ap-custom').classList.toggle('hidden', r.querySelector('.ap-role').value !== '__c');
      });
    };
    $('#dlgBody').onchange = e => {
      const nm = e.target && e.target.name;
      if (nm === 'apL') { collect(); st.line = e.target.value; draw(); }
      else if (nm === 'apS') { collect(); st.scope = e.target.value; if (st.scope !== '전체') st.line = st.scope; draw(); }   // 범위를 고르면 같은 이름의 결재라인이 자동 선택
      else sync();
    };
    draw();
    const ok = $('#dlgOk');
    ok.textContent = '인쇄'; ok.className = 'btn primary';
    $('#dlgCancel').classList.remove('hidden');
    d.returnValue = '';
    d.onclose = () => {
      $('#dlgBody').onchange = null;
      if (d.returnValue !== 'ok') return resolve(null);
      collect();
      const keepOrient = opt.orient && st.orient === opt.orient ? saved.orient : st.orient;   // 출석부가 가로로 열렸다고 저장된 용지 방향이 바뀌지는 않음
      apSave({ orient: keepOrient, last: st.line, lines: st.lines });
      resolve({ cfg: st.lines[st.line], line: st.line, scope: st.scope, orient: st.orient });
    };
    d.showModal();
  });
}

/* 인쇄 실행: title 제목, sub 부제, srcEl 인쇄할 내용이 있는 요소
   opt: { orient, line, scoped: org => 요소 (인쇄 범위를 고를 수 있는 화면) } */
async function printReport(title, sub, srcEl, opt) {
  opt = opt || {};
  const res = await printSetup({ orient: opt.orient, line: opt.line, scope: !!opt.scoped, noAppr: !!opt.report });
  if (!res) return;
  let src = srcEl;
  if (opt.scoped && res.scope !== '전체') { src = opt.scoped(res.scope); if (opt.report) { if (res.scope === '센터') title = title.replace(/^(\S+)지회/, '$1센터'); } else title += ` (${res.scope} 주관)`; }
  if (!src) return;
  const cfg = opt.report ? { n: 0, cells: [] } : res.cfg;
  const body = src.cloneNode(true);
  if (opt.report) { body.querySelectorAll('.status-line').forEach(e => (e.closest('.panel') || e).remove()); body.querySelectorAll('.org-t').forEach(e => e.remove()); }
  body.querySelectorAll('.no-print, button, .notice.info, .notice.warn, .hint.no-print').forEach(e => e.remove());
  body.querySelectorAll('[id]').forEach(e => e.removeAttribute('id'));
  const cells = cfg.cells.slice(0, cfg.n);
  const appr = cfg.n ? `<table class="appr"><tr><th class="side" rowspan="2">결재</th>${cells.map(c => `<th>${esc(c.role)}</th>`).join('')}</tr>
    <tr>${cells.map(c => `<td>${esc(c.name)}</td>`).join('')}</tr></table>` : '';
  const now = new Date(), pad = x => String(x).padStart(2, '0');
  $('#printArea').innerHTML = `<div class="p-head"><div><h2>${esc(title)}</h2>${opt.report ? '' : `<p class="p-sub">${esc(sub)} / 출력일 ${now.getFullYear()}.${pad(now.getMonth() + 1)}.${pad(now.getDate())}</p>`}</div>${appr}</div>` + body.innerHTML;
  let st = document.getElementById('pageStyle');
  if (!st) { st = document.createElement('style'); st.id = 'pageStyle'; document.head.appendChild(st); }
  st.textContent = `@page { size: A4 ${res.orient === 'landscape' ? 'landscape' : 'portrait'}; margin: 12mm; }`;
  const clear = () => { $('#printArea').innerHTML = ''; window.removeEventListener('afterprint', clear); };
  window.addEventListener('afterprint', clear);
  setTimeout(() => window.print(), 60);
}

/* 주관별(지회/센터) 보고서: 강좌별 행(d.강좌별)에서 그 주관만 골라 다시 합산 */
function groupRows(rows, field, order) {
  const g = {};
  rows.forEach(r => {
    const k = String(r[field] || '').trim() || '미분류';
    const t = g[k] = g[k] || { 강좌수: 0, 실인원: 0, 연인원: 0, 수료인원: 0, 총강의시간: 0 };
    t.강좌수++; t.실인원 += Number(r.실인원) || 0; t.연인원 += Number(r.연인원) || 0;
    t.수료인원 += r.수료집계 === 'N' ? 0 : Number(r.수료인원) || 0; t.총강의시간 = Math.round((t.총강의시간 + (Number(r.총강의시간) || 0)) * 10) / 10;
  });
  const idx = k => order.indexOf(k) === -1 ? 99 : order.indexOf(k);
  return Object.keys(g).sort((a, b) => idx(a) - idx(b)).map(k => Object.assign({ 구분: k }, g[k]));
}
function scopedReportEl(d, org) {
  const rows = d.강좌별.filter(r => r.주관 === org);
  const sum = rs => { const t = groupRows(rs, '주관', [])[0]; return t || { 강좌수: 0, 실인원: 0, 연인원: 0, 수료인원: 0, 총강의시간: 0 }; };
  const d2 = { 강좌별: rows, 구분별: groupRows(rows, '교육구분', ['내부', '외부']), 수준별: groupRows(rows, '수준', ['초급', '중급', '고급', '특강', '구분없음']) };
  if (d.반기 === '연간') d2.분기별 = quarterSplitOf(rows, sum), d2.합계 = sum(rows);
  const el = document.createElement('div');
  el.innerHTML = `${totalsStats(sum(rows))}${breakdown(d2)}${splitTables(d2)}${reportTable(rows)}`;
  return el;
}

      강사: d0.강사.map(t => Object.assign({}, t, { 강좌: t.강좌.filter(keep) })).filter(t => t.강좌.length),
      기관: d0.기관.map(o => Object.assign({}, o, { 강좌: o.강좌.filter(keep) })).filter(o => o.강좌.length), 강좌: d0.강좌.filter(keep) };
    const cs = c => [c.지회명, c.강좌명, orgText(c), kindText(c), levelText(c), c.기관명, c.강사, c.시작일, c.종료일, c.총회차, c.진행회차, c.총강의시간, c.연인원];
    const ch = ['지회', '강좌명', '주관', '교육구분', '수준', '기관명', '강사', '시작일', '종료일', '총회차', '진행회차', '총강의시간', '연인원'];
    const sheets = [];
    if (d.수강생 && d.수강생.length) sheets.push({ name: '수강생', freeze: 1, rows: [['이름', '연락처', '동명이인', '강좌명', '주관', '수준', '기관명', '시작일', '종료일', '출석', '총회차', '결과'],
      ...d.수강생.flatMap(p => p.수강.map(x => [p.이름, p.연락처, p.동명이인 > 1 ? p.동명이인 + '명' : '', x.강좌명, orgText(x), levelText(x), x.기관명, x.시작일, x.종료일, x.출석, x.총회차, x.상태]))] });
    if (d.강사.length) sheets.push({ name: '강사', freeze: 1, rows: [['강사', ...ch], ...d.강사.flatMap(t => t.강좌.map(c => [t.강사, ...cs(c)]))] });
    if (d.기관.length) sheets.push({ name: '기관', freeze: 1, rows: [['기관', ...ch], ...d.기관.flatMap(o => o.강좌.map(c => [o.기관명, ...cs(c)]))] });
    if (d.강좌.length) sheets.push({ name: '강좌', freeze: 1, rows: [ch, ...d.강좌.map(cs)] });
    return sheets;
  };
  $('#xlsSearch').onclick = async () => {
    if (!S.searchData) { toast('먼저 검색해 주세요.', true); return; }
    const sc = await askScope(); if (!sc) return;
    const org = sc === '전체' ? '' : sc;
    downloadXlsx(`검색 결과 ${S.search.q || ''}${org ? ` (${org} 주관)` : ''}`, searchSheets(org));
  };
  $('#cpSearch').onclick = async () => {   // 탭으로 구분한 글자로 복사 → 엑셀·한글·메모장에 붙여 넣기
    if (!S.searchData) { toast('먼저 검색해 주세요.', true); return; }
    const sheets = searchSheets('');
    if (!sheets.length) { toast('복사할 결과가 없습니다.', true); return; }
    const text = sheets.map(s => `[${s.name}]\n` + s.rows.map(r => r.map(v => v == null ? '' : String(v).split('\t').join(' ').split('\n').join(' ')).join('\t')).join('\n')).join('\n\n');
    toast(await copyText(text) ? '검색 결과를 복사했습니다. 엑셀이나 메모장에 붙여 넣으세요.' : '복사하지 못했습니다. 엑셀 내려받기를 이용해 주세요.', false);
  };
  $('#prtSearch').onclick = () => { if (!S.searchData) { toast('먼저 검색해 주세요.', true); return; } printReport(`${isAdmin() ? '강원도 시군지회' : S.init.user.chapter} 검색 결과`, `검색어: ${S.search.q || '(조건만)'}`, $('#sres')); };
  const go2 = () => {
    f.q = $('#sq').value.trim(); f.연도 = $('#sy2').value; f.주관 = $('#so').value; f.교육구분 = $('#sk').value; f.수준 = $('#sl').value;
    runSearch();
  };
  $('#sq').oninput = () => { clearTimeout(searchTimer); searchTimer = setTimeout(go2, 700); };
  $('#sq').onkeydown = e => { if (e.key === 'Enter') { clearTimeout(searchTimer); go2(); } };
  ['sy2', 'so', 'sk', 'sl'].forEach(id => $('#' + id).onchange = go2);
  if (f.q || f.연도 || f.주관 || f.교육구분 || f.수준) runSearch();
}

function searchCourseLine(c, withChapter) {
  return `<button type="button" class="course" data-id="${esc(c.강좌ID)}">
    <span class="c-title">${esc(c.강좌명)}</span>
    ${tagsHtml(c)}
    ${kvHtml([withChapter ? ['지회', c.지회명] : null, ['기간', c.시작일 + ' ~ ' + c.종료일], ['강사', c.강사], ['진행', `${c.진행회차} / ${c.총회차}회`], ['강의시간', c.총강의시간 + '시간'], ['연인원', String(c.연인원)]])}</button>`;
}

async function runSearch() {
  const f = S.search, my = ++searchSeq;
  if (!f.q && !f.연도 && !f.주관 && !f.교육구분 && !f.수준) { $('#sres').innerHTML = '<p class="sub">검색어를 입력하거나 위 조건(과정 등)을 고르면 결과가 나옵니다.</p>'; return; }
  try {
    const d = await call('searchAll', f.q, { 연도: f.연도, 주관: f.주관, 교육구분: f.교육구분, 수준: f.수준 });
    if (my !== searchSeq || S.tab !== 'search' || !$('#sres')) return;
    S.searchData = d;
    const adm = isAdmin();
    const sec = (title, count, body) => count ? `<h3 style="margin:18px 0 8px">${title} <span class="hint" style="margin:0">${n(count)}</span></h3>${body}` : '';
    const statusClass = { '수료': 'b-승인', '미수료': 'b-반려', '진행 중': 'b-제출완료', '집계 안 함': 'b-종료' };
    let html = '';
    if (!adm && d.수강생 && d.수강생.length) {
      const dupNames = [...new Set(d.수강생.filter(p => p.동명이인 > 1).map(p => p.이름))];
      html += sec('수강생', d.수강생.length, (dupNames.length ? `<div class="notice warn">같은 이름이 여러 명입니다 (${dupNames.map(esc).join(', ')}). <b>연락처</b>로 구분하세요. 검색창에 <b>이름 전화번호</b>(예: ${esc(dupNames[0])} 5555)를 같이 적으면 그 사람만 나옵니다.</div>` : '') + d.수강생.map(p => `<div class="panel" style="padding:14px">
        <div class="row"><b style="font-size:17px">${esc(p.이름)}</b>
          <span class="num" style="font-weight:600">${esc(p.연락처 || '연락처 없음')}</span>
          ${p.동명이인 > 1 ? `<span class="dup">동명이인 ${p.동명이인}명</span>` : ''}<span class="spacer"></span>
          <span class="num">수강 ${n(p.수강건수)}건 · 수료 ${n(p.수료건수)}건</span></div>
        ${!p.연락처 ? '<p class="hint" style="margin:6px 0 0">연락처가 없어서 같은 이름은 한 사람으로 묶었습니다. 연락처를 입력하면 구분됩니다.</p>' : ''}
        ${p.동명이인 > 1 && p.연락처 ? `<button type="button" class="btn small only" style="margin-top:8px" data-q="${esc(p.이름 + ' ' + p.연락처)}">이 사람만 보기</button>` : ''}
        <div class="tbl-wrap" style="margin:10px 0 0"><table class="tbl num"><thead><tr><th>강좌</th><th class="hide-m">기간</th><th class="r">출석</th><th>결과</th></tr></thead><tbody>
        ${p.수강.map(x => `<tr class="click" tabindex="0" data-id="${esc(x.강좌ID)}"><td><b>${esc(x.강좌명)}</b><br><span class="tags" style="margin:4px 0 0">${orgText(x) ? `<span class="tag">${esc(orgText(x))}</span>` : ''}<span class="tag k">${esc(levelText(x))}</span>${x.기관명 ? `<span class="tag p">기관 ${esc(x.기관명)}</span>` : ''}</span></td>
          <td class="hide-m">${esc(x.시작일)} ~ ${esc(x.종료일)}</td><td class="r">${n(x.출석)}/${n(x.총회차)}</td><td><span class="badge ${statusClass[x.상태] || ''}">${esc(x.상태)}</span></td></tr>`).join('')}
        </tbody></table></div></div>`).join(''));
    }
    if (d.강사.length) html += sec('강사', d.강사.length, d.강사.map(t => `<div class="panel" style="padding:14px">
      <div class="row"><b style="font-size:17px">${esc(t.강사)}</b><span class="spacer"></span><span class="num">강의 ${n(t.건수)}건 · 총 ${esc(t.총강의시간)}시간</span></div>
      <div style="margin-top:10px">${t.강좌.map(c => searchCourseLine(c, adm)).join('')}</div></div>`).join(''));
    if (d.기관.length) html += sec('기관', d.기관.length, d.기관.map(o => `<div class="panel" style="padding:14px">
      <div class="row"><b style="font-size:17px">${esc(o.기관명)}</b><span class="spacer"></span><span class="num">${n(o.건수)}건 · 연인원 ${n(o.연인원)}</span></div>
      <div style="margin-top:10px">${o.강좌.map(c => searchCourseLine(c, adm)).join('')}</div></div>`).join(''));
    if (d.강좌.length) html += sec('강좌', d.더있음.강좌 || d.강좌.length, d.강좌.map(c => searchCourseLine(c, adm)).join('') + (d.더있음.강좌 ? `<p class="hint">앞의 ${d.강좌.length}개만 보여줍니다. 조건을 더 좁혀 보세요.</p>` : ''));
    if (!html) html = '<div class="panel empty"><p>검색 결과가 없습니다.</p></div>';
    $('#sres').innerHTML = html;
    const open = async id => { S.from = 'search'; S.keepFrom = true; S.tab = 'courses'; document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === 'courses' ? 'page' : 'false')); await openCourse(id); };
    $('#sres').querySelectorAll('.only').forEach(b => b.onclick = () => { $('#sq').value = b.dataset.q; S.search.q = b.dataset.q; runSearch(); });
    $('#sres').querySelectorAll('[data-id]').forEach(el => { el.onclick = () => open(el.dataset.id); el.onkeydown = e => { if (e.key === 'Enter') open(el.dataset.id); }; });
  } catch (e) {
    if (e.code !== 'AUTH' && $('#sres') && my === searchSeq) $('#sres').innerHTML = `<div class="notice err">${esc(e.message)}</div>`;
  }
}

    </div>

function drawStats() {
  const d = S.statData, f = S.stats;
  const org = showOrg() ? (f.주관 || '전체') : '전체';
  const orgLabel = { 전체: '전체', 지회: '지회 주관', 센터: '센터 주관' };
  const mon = d.월별[org];
  const max = Math.max(1, ...mon.map(m => m.연인원));
  const row = (label, t, bold) => `<tr${bold ? ' style="font-weight:700"' : ''}><td>${label}</td><td class="r">${n(t.건수)}</td><td class="r">${n(t.실인원)}</td><td class="r">${n(t.연인원)}</td></tr>`;

async function uploadFile(file, reqId, kind, chapter) {
  const ext = (/\.([A-Za-z0-9]+)$/.exec(file.name) || [])[1];
  if (!ext || !FILE_OK.includes(ext.toLowerCase())) throw new Error(`올릴 수 없는 파일 형식입니다. (가능: ${FILE_OK.join(', ')})`);
  if (file.size > 20 * 1024 * 1024) throw new Error('파일은 20MB까지 올릴 수 있습니다.');
  if (!file.size) throw new Error('빈 파일은 올릴 수 없습니다.');
  const p = await call('fileUploadPrep', reqId, kind, chapter || '', file.name, file.size);
  const fd = new FormData(); fd.append('cacheControl', '3600'); fd.append('', file);
  let res;
  try { res = await fetch(p.upload.url, { method: 'PUT', headers: { apikey: p.upload.apikey, 'x-upsert': 'false' }, body: fd }); }
  catch (e) { throw new Error('파일을 올리지 못했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.'); }
  if (!res.ok) { let m = ''; try { m = (await res.json()).message || ''; } catch (e) { /* */ } throw new Error('파일을 올리지 못했습니다. ' + m); }
  await call('fileUploadDone', p.파일ID);
}

      <span style="flex:1;min-width:0;word-break:break-all">📄 ${esc(f.파일명)} <span class="hint" style="margin:0">${sizeText(f.크기)}</span></span>
      <button class="btn small" data-dl="${esc(f.파일ID)}">내려받기</button>${opt && opt.del ? `<button class="btn small danger" data-fdel="${esc(f.파일ID)}">삭제</button>` : ''}</li>`).join('')}</ul>` : '<p class="hint" style="margin:4px 0">파일이 없습니다.</p>';
}

/* ---------- 직인 이미지 (내 정보) ---------- */
async function sealDataUrl(file) {
  if (!file || !/^image\//.test(file.type || '')) throw new Error('이미지 파일(PNG, JPG)만 올릴 수 있습니다.');
  const img = await new Promise((ok, no) => { const u = URL.createObjectURL(file), i = new Image(); i.onload = () => { URL.revokeObjectURL(u); ok(i); }; i.onerror = () => { URL.revokeObjectURL(u); no(new Error('이 이미지를 읽을 수 없습니다.')); }; i.src = u; });
  for (const max of [500, 380, 280, 200]) {
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), cv = document.createElement('canvas');
    cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    const out = cv.toDataURL('image/png');
    if (out.length <= 140000) return out;
  }
  throw new Error('이미지가 너무 복잡하거나 큽니다. 더 단순한 직인 이미지를 올려 주세요.');
}

  box.innerHTML = ['지회', '센터'].map(k => `<div style="display:flex;gap:12px;align-items:center;margin:10px 0">

    ${seals[k] ? `<button type="button" class="btn small danger" data-sealdel="${k}">삭제</button>` : ''}</div></div></div>`).join('');
  box.querySelectorAll('[data-seal]').forEach(inp => inp.onchange = () => act(null, async () => {
    const f = inp.files[0]; if (!f) return;

    }).catch(() => {});
    $('#rsForm').onsubmit = async e => {
      e.preventDefault();
      const id = $('#rsId').value, name = $('#rsId').selectedOptions[0].textContent;
      if (!id) { toast('지회를 골라 주세요.', true); return; }
      if (!(await ask(`${name}\n비밀번호를 새 임시 비밀번호로 바꿀까요?\n기존 비밀번호는 사용할 수 없게 됩니다.`, { ok: '바꾸기', danger: true }))) return;
      act($('#rsBtn'), async () => {
        const r = await call('resetPassword', id, $('#rsPw').value);
        $('#rsPw').value = '';
        toast(`${r.지회명} 비밀번호를 바꿨습니다. 새 비밀번호를 지회에 알려 주세요.`);
      });
    };
  }
  $('#pwForm').onsubmit = e => {
    e.preventDefault();
    if ($('#pw1').value !== $('#pw2').value) { toast('새 비밀번호가 서로 다릅니다.', true); return; }
    act($('#pwBtn'), async () => {
      await call('changePassword', $('#pw0').value, $('#pw1').value);
      $('#pwForm').reset();
      toast('비밀번호를 바꿨습니다.');
    });
  };
  $('#logoutBtn').onclick = doLogout;
}

function helpSections() {
  const role = S.init ? (isAdmin() ? 'admin' : 'chapter') : '';
  return HELP.filter(s => !role || role === 'admin' || s.f === 'all' || s.f === role);   // 도협회는 지회 내용까지 모두, 지회는 지회 내용만
}
function helpBody(s) {   // 지회 화면에서는 도협회 전용 문장(ro-a)을 뺌
  const html = s.b.join('');
  if (!(S.init && !isAdmin())) return html;
  const d = document.createElement('div'); d.innerHTML = html; d.querySelectorAll('.ro-a').forEach(e => e.remove()); return d.innerHTML;
}
function openHelp() {
  const d = $('#helpDlg');
  const draw = q => {
    const key = q.trim().toLowerCase();
    const list = helpSections().filter(s => !key || (s.t + ' ' + helpBody(s).replace(/<[^>]*>/g, ' ')).toLowerCase().indexOf(key) !== -1);
    $('#helpList').innerHTML = list.length ? list.map((s, i) =>
      `<details${key || i === 0 ? ' open' : ''}><summary>${s.t}</summary><div class="hb">${helpBody(s)}</div></details>`).join('')
      : '<p class="hint">찾는 내용이 없습니다. 다른 낱말로 검색해 보세요.</p>';
  };
  $('#helpList').onclick = async e => {
    const a = e.target.closest && e.target.closest('a[data-go],a[data-ct]'); if (!a) return;
    e.preventDefault();
    if (a.dataset.go) { $('#helpDlg').close(); go(a.dataset.go); return; }
    if (S.detail && S.tab === 'courses') {
      if (!document.querySelector(`[data-cts~="${a.dataset.ct}"], #cTabs [data-ct="${a.dataset.ct}"]`)) { toast('이 강좌에서는 해당 메뉴를 쓸 수 없습니다.', true); return; }
      if (!(await leaveOk())) return;
      $('#helpDlg').close(); S.cTab = a.dataset.ct; S.draft = null; S.draftCount = null; showDetail(S.detail); window.scrollTo(0, 0);
    } else toast('강좌를 먼저 열어 주세요. 열린 강좌의 화면으로 이동합니다.', true);
  };
  $('#helpQ').value = '';
  $('#helpQ').oninput = () => draw($('#helpQ').value);
  draw('');
  if (!d.open) d.showModal();
}
$('#helpBtn').onclick = openHelp;
$('#helpClose').onclick = () => $('#helpDlg').close();

   시작
   ========================================================= */
(async function start() {
  let t = store.get('tok');
  if (t) { S.token = t; try { await boot(); return; } catch (e) { if (e.code !== 'AUTH') { clearSession(); return renderLogin(e.message); } clearSession(); } }
  try {
    if (await googleSignIn()) await boot();
    else renderLogin();
  } catch (e) { clearSession(); renderLogin(e.message); }
})();

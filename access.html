<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>직원·권한 관리 · 강원특별자치도농아인협회 통합 업무시스템</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;background:#f5f7fb;color:#222;font-size:15px}
.wrap{max-width:860px;margin:0 auto;padding:14px}
h1{font-size:19px;margin:0}
h2{font-size:16px;margin:0 0 8px}
html.embed .top>div:last-child{display:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.card{background:#fff;border:1px solid #e5e9f2;border-radius:10px;padding:12px;margin-bottom:10px}
.muted{color:#777;font-size:13px}
.tabs{display:flex;gap:2px;margin-bottom:14px;border-bottom:1px solid #e5e9f2;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:30;background:var(--bg,#f5f7fb)}   /* 밑줄 탭 */
.tabs button{flex:none;padding:10px 14px;margin-bottom:-1px;border:0;border-bottom:3px solid transparent;background:none;border-radius:0;font-size:14px;color:#6b7280;white-space:nowrap;cursor:pointer}
.tabs button:hover{color:#1f2937}
.tabs button.on{color:#2f5bd6;border-bottom-color:#2f5bd6;font-weight:700}
button{font:inherit;cursor:pointer}
.btn{padding:8px 12px;border:1px solid #2f5bd6;background:#2f5bd6;color:#fff;border-radius:8px}
.btn.sub{background:#fff;color:#2f5bd6}
.btn.red{background:#fff;color:#c92a2a;border-color:#c92a2a}
.btn.sm{padding:5px 9px;font-size:13px}
input,select{font:inherit;padding:8px;border:1px solid #d5dbe8;border-radius:8px;width:100%;background:#fff}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid .full{grid-column:1/3}
.badge{display:inline-block;font-size:12px;padding:2px 7px;border-radius:10px;background:#eaf0ff;color:#2f5bd6;margin-left:4px}
.badge.g{background:#e6f6ea;color:#2b8a3e}.badge.x{background:#f1f1f1;color:#777}.badge.o{background:#fff1dc;color:#d9480f}
.st{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.off{opacity:.55}
.perm{background:#f7f9fc;border-radius:8px;padding:8px;margin-top:8px}
.sinfo{background:#f7f9fc;border-radius:8px;padding:10px 12px;margin-top:8px;display:grid;grid-template-columns:110px 1fr;gap:5px 10px;font-size:14px}
.sinfo dt{color:#6b7280}.sinfo dd{margin:0;word-break:break-all}.sname{cursor:pointer}.sname:hover b{text-decoration:underline}
.perm b{display:block;margin:6px 0 2px;font-size:13px;color:#555}
.perm label{display:flex;gap:6px;align-items:center;padding:3px 0}
.perm input{width:auto}
.perm.cols{columns:2;column-gap:18px}.perm.cols .pg{break-inside:avoid}
@media(max-width:520px){.perm.cols{columns:1}}
table.ap{border-collapse:collapse;font-size:12px;margin:6px 0}
table.ap td{border:1px solid #333;padding:3px 10px;text-align:center;min-width:56px}
table.ap td.h{background:#f0f0f0;font-weight:700;writing-mode:vertical-rl}
table.ap tr.s td{height:30px}
table.log{width:100%;border-collapse:collapse;font-size:13px}
table.log td,table.log th{border-bottom:1px solid #eee;padding:5px;text-align:left;vertical-align:top}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;display:none;max-width:90%;z-index:9}
#toast.bad{background:#c92a2a}
.center{text-align:center;padding:40px 10px}
</style>

<body>
<div class="wrap" id="app"><div class="center muted">불러오는 중…</div></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>try{ if(new URLSearchParams(location.search).get("embed")==="1") document.documentElement.classList.add("embed"); }catch(e){}</script>
<script>
/* ===== 권한 관리 (구글 로그인 · 직원 등록 · 권한 부여 · 결재라인) ===== */
const SB_URL = "https://uamlualqqcqmpdkprjfs.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhbWx1YWxxcWNxbXBka3ByamZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwNjE0OTMsImV4cCI6MjExMDYzNzQ5M30._f4p4pfcKaYbmjKRXOPpkMo7Ydcc26oVVI6lRFYsLkY";
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SYS = {core:"관리", vehicle:"차량운행", edu:"수어교육", att:"근태", interp:"수어통역", acct:"회계", cert:"증서·증명", member:"회원관리", perf:"사업실적", news:"뉴스 배정표", book:"교재 주문", movie:"영화실적"};
const ROLE = {admin:"도협회 관리자", lead:"사무국장", staff:"직원"};
const ACT = {chapter_reset:"자료 초기화", dept:"부서", add_staff:"직원 등록", delete_staff:"직원 삭제", update_staff:"직원 정보 수정", enable_staff:"사용 재개", disable_staff:"사용 중지", grant:"권한 부여", revoke:"권한 해제",
             save_approval:"결재라인 저장", delete_approval:"결재라인 삭제", assign_lead:"지회 담당 지정", set_admin:"도협회 관리자 변경"};
const DEFAULT_AP = ["부장","사무처장","본부장"];
const VIEW = (new URLSearchParams(location.search).get("view") || "") === "org" ? "org" : "people";   // org = 🏢 기관 설정, people = 직원·권한 관리
const GO0 = new URLSearchParams(location.search).get("go") || "";
let me = null, tab = "staff", staff = [], catalog = [], lines = [], chapters = [], logs = [];
let openId = null, editId = null, viewId = null, drafts = {}, deptKeys = [];

function toast(msg, bad){ const t = $("#toast"); t.textContent = msg; t.className = bad ? "bad" : ""; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(()=>{ t.style.display = "none"; }, 2600); }
async function rpc(fn, args){ const r = await sb.rpc(fn, args || {}); if(r.error) throw new Error(r.error.message); return r.data; }
async function act(fn, args, okMsg, after){ try{ await rpc(fn, args); if(okMsg) toast(okMsg); if(after) await after(); }catch(e){ toast(e.message, true); } }

/* ---------- 시작 · 로그인 ---------- */
async function boot(){
  const s = await sb.auth.getSession();
  if(!s.data.session) return loginView();
  try{ me = await rpc("whoami"); }catch(e){ return msgView("불러오지 못했습니다", e.message, true); }
  if(!me.ok) return blockedView();
  catalog = await rpc("get_catalog");
  const ts = tabList().map(t=>t[0]);
  if(VIEW === "org" && !ts.length) return msgView("기관 설정", "기관 설정은 지회 담당자·공동 관리자만 볼 수 있습니다.");
  await go(ts.indexOf(GO0) >= 0 ? GO0 : (VIEW === "org" ? ts[0] : (me.can_manage ? "staff" : "me")));
}
function loginView(){
  $("#app").innerHTML = `<div class="center"><h1>강원특별자치도농아인협회 통합 업무시스템</h1><p class="muted">업무용 구글 계정으로 로그인하세요.</p>
    <button class="btn" onclick="login()">구글 계정으로 로그인</button></div>`;
}
async function login(){
  const r = await sb.auth.signInWithOAuth({provider:"google", options:{redirectTo: location.origin + location.pathname}});
  if(r.error) toast(r.error.message, true);
}
async function logout(){ await sb.auth.signOut({ scope: 'local' }); location.reload(); }
function msgView(title, text, bad){
  $("#app").innerHTML = `<div class="center"><h2>${esc(title)}</h2><p class="${bad?"":"muted"}">${esc(text)}</p><button class="btn sub" onclick="logout()">다른 계정으로 로그인</button></div>`;
}
function blockedView(){
  const m = {not_registered:"이 계정은 아직 등록되지 않았습니다. 지회 담당자에게 이메일 등록을 요청하세요.",
             inactive:"이 계정은 사용이 중지되어 있습니다. 지회 담당자에게 문의하세요.",
             bad_domain:"허용되지 않은 이메일 도메인입니다. 업무용 계정으로 로그인하세요."};
  msgView("접속할 수 없습니다", (m[me.reason] || "로그인 정보를 확인할 수 없습니다.") + (me.email ? "  (" + me.email + ")" : ""));
}

/* ---------- 화면 ---------- */
function tabList(){
  const tabs = [];
  if(VIEW === "org"){   // 🏢 기관 설정
    if(me.can_manage) tabs.push(["org","기본 정보"],["depts","부서"],["lines","결재라인"]);
    if(me.role === "lead" || (me.can_manage && me.role !== "admin")) tabs.push(["drive","드라이브·캘린더 연결"]);   // 지회 담당자·공동 관리자: 우리 지회 드라이브·캘린더 연결
    if(me.role === "admin") tabs.push(["chapters","지회 관리"]);           // 도협회: 지회 담당 지정 + 드라이브·캘린더 연결
    if(me.role === "admin" || me.role === "lead") tabs.push(["reset","자료 초기화"]);
    return tabs;
  }
  if(me.can_manage) tabs.push(["staff","직원·권한"],["pay","호봉표"],["log","변경 기록"]);
  tabs.push(["sign","내 서명"],["me","내 권한"]);
  return tabs;
}
function render(){
  const tabs = tabList();
  $("#app").innerHTML = `<div class="top"><div><h1>${VIEW==="org"?"🏢 기관 설정 · ":""}${esc(me.chapter_name)} · ${esc(me.name)}</h1>
      <div class="muted">${esc(me.email)} <span class="badge">${ROLE[me.role]}</span>${me.role==="staff"&&me.can_manage?'<span class="badge o">공동 관리자</span>':""}</div></div>
      <div><a class="btn sub sm" href="/" style="text-decoration:none;display:inline-block">🏠 홈으로</a> <button class="btn sub sm" onclick="logout()">로그아웃</button></div></div>
    <div class="tabs">${tabs.map(t=>`<button class="${tab===t[0]?"on":""}" onclick="go('${t[0]}')">${t[1]}</button>`).join("")}</div>
    <div id="body"></div>`;
  ({reset:resetView, staff:staffView, pay:payView, depts:deptsView, lines:linesView, log:logView, chapters:chaptersView, drive:driveView, org:orgView, sign:signView, me:meView}[tab] || meView)();
}
async function go(t){
  tab = t;
  try{
    if(t==="staff") await loadStaff();
    else if(t==="pay") await payLoad();
    else if(t==="depts"){ SCH = null; await loadStaff(); deptEdit = null; }
    else if(t==="lines"){ await loadStaff(); lines = await rpc("get_approval_lines"); drafts = {}; }
    else if(t==="log") logs = await rpc("get_access_log", {p_limit:100});
    else if(t==="chapters"){ chapters = await rpc("list_chapters"); try{ await loadDrive(); }catch(e){ drv = {ok:false, msg:e.message}; } }
    else if(t==="drive") await loadDrive();
    else if(t==="org") org = await rpc("get_org_profile");
    else if(t==="sign"){ mySign = await rpc("get_my_signature"); sigStat = me.can_manage ? await rpc("list_signature_status") : null; }
  }catch(e){ toast(e.message, true); }
  render();
}
let ATTI = null;   // 근태 정보 (근태 [직원목록]) — 없으면 null
/* 도협회: 지회 골라서 그 지회 직원 관리 (SCH = 고른 지회 id, null = 우리 기관) */
let SCH = null, SCHS = null;
const PC = o => Object.assign(o || {}, SCH ? {p_chapter: SCH} : {});
const CH_ORDER = ["도협회","춘천","원주","강릉","동해","태백","속초","삼척","홍천","횡성","영월","평창","철원","화천","고성","양양","정선","인제","양구"];
function chRank(c){ if(c.is_hq) return -1; const i = CH_ORDER.findIndex(k => k !== "도협회" && String(c.name).indexOf(k) === 0); return i < 0 ? 99 : i; }
async function loadStaff(){
  if(SCHS === null){ try{ SCHS = me.is_hq ? (await rpc("staff_chapters")) || [] : []; }catch(e){ SCHS = []; } SCHS.sort((a,b)=>chRank(a)-chRank(b) || String(a.name).localeCompare(b.name)); }
  staff = await rpc("list_staff", PC());
  try{ ATTI = await rpc("staff_att_list", PC()); }catch(e){ ATTI = null; }
  try{ DEPTS = await rpc("dept_list", PC()); }catch(e){ DEPTS = null; }   // 64번 SQL 전에는 null
}
/* 부서 목록 (기관 설정 → 부서). 직원 부서는 이 목록에서 고릅니다. */
let DEPTS = null, deptEdit = null;
function deptPick(id, cur){
  if(!DEPTS || !DEPTS.length) return `<input id="${id}" value="${esc(cur||"")}" placeholder="부서">`;
  const has = !cur || DEPTS.some(d=>d.name===cur);
  return `<div style="display:flex;gap:6px"><select id="${id}" style="flex:1"><option value="">(부서 없음)</option>${DEPTS.map(d=>`<option ${d.name===cur?"selected":""}>${esc(d.name)}</option>`).join("")}${has?"":`<option selected>${esc(cur)}</option>`}</select>`
    + `<button type="button" class="btn sub" style="white-space:nowrap;margin:0" onclick="deptAdd('${id}')">+ 부서 추가</button></div>`;
}
/* 직원 등록 화면에서 바로 부서 추가 (그 기관의 부서 목록에 들어감) */
async function deptAdd(id){
  const nm = (prompt("추가할 부서 이름 (예: 법인, 센터, 수어문화원)") || "").trim(); if(!nm) return;
  try{
    await rpc("dept_save", PC({p_id:null, p_name:nm, p_full_name:"", p_sender:"", p_address:"", p_phone:"", p_fax:"", p_sort:(DEPTS||[]).length + 1}));
    DEPTS = await rpc("dept_list", PC());
    const sel = $("#"+id), keep = sel.value;
    sel.innerHTML = '<option value="">(부서 없음)</option>' + DEPTS.map(d=>`<option>${esc(d.name)}</option>`).join("");
    sel.value = keep || nm; if(!keep) sel.value = nm;
    const box = $("#e_d2box"); if(box) box.insertAdjacentHTML("beforeend", `<label style="display:flex;align-items:center;gap:4px;white-space:nowrap;margin-right:10px"><input type="checkbox" style="width:auto;margin:0" class="e_d2" value="${esc(nm)}">${esc(nm)}</label>`);
    toast("부서 '" + nm + "'을(를) 추가했습니다. 부서 이름·발신명의 등은 [부서] 화면에서 고칠 수 있습니다.");
  }catch(e){ toast(e.message, true); }
}
async function pickCh(v){ const c = SCHS.find(x=>String(x.id)===String(v)); SCH = c && !c.is_hq ? c.id : null; editId = null; openId = null; await loadStaff(); if(tab==="pay"){ try{ await payLoad(); }catch(e){ toast(e.message, true); } } render(); }
function chPicker(){
  if(!SCHS || SCHS.length < 2) return "";
  const cur = SCH || (SCHS.find(x=>x.is_hq)||{}).id;
  return `<div class="card" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>🏢 기관 선택</b>
    <select onchange="pickCh(this.value)" style="flex:1;min-width:160px">${SCHS.map(c=>`<option value="${c.id}" ${String(c.id)===String(cur)?"selected":""}>${esc(c.name)} (${c.n}명)</option>`).join("")}</select>
    ${SCH?'<span class="muted" style="width:100%;font-size:12px">도협회에서 이 지회 직원을 보고 고칠 수 있습니다. 바꾼 내용은 그 지회에 바로 반영됩니다.</span>':""}</div>`;
}
function attOf(s){ if(!ATTI || !ATTI.rows) return null; const e = String(s.email||"").toLowerCase(); return ATTI.rows.find(r=>r.email===e) || null; }
const ORGS = ["도협회","지회","센터"];
/* 도협회에서만 쓰는 권한 / 지회에서만 쓰는 권한: 지금 보고 있는 기관에 맞는 것만 보여 줌
   (서버도 도협회 권한은 도협회 직원에게만 효과가 있음) */
const PERM_HQ = ["book.manage","news.edit","perf.review","movie.manage","interp.review"], PERM_CH = ["movie.write"];
function permShown(c){ const k = c.system+"."+c.perm, hq = !!(me.is_hq && !SCH); return hq ? !PERM_CH.includes(k) : !PERM_HQ.includes(k); }
function permTxt(t){ return String(t).replace(/\s*\((도협회|지회)\)\s*$/, ""); }
function permLabel(k){ const c = catalog.find(x=>x.system+"."+x.perm===k); return c ? c.label : k; }

/* 내 권한 */
function meView(){
  const by = {}; me.perms.forEach(k=>{ const s = k.split(".")[0]; (by[s] = by[s] || []).push(k); });
  $("#body").innerHTML = `<div class="card"><h2>내 정보</h2><div>${esc(me.chapter_name)} · ${esc(me.dept||"부서 없음")} · ${esc(me.position||"직위 없음")}</div></div>
    <div class="card"><h2>내 권한</h2>${me.role!=="staff"?'<div class="muted">담당자는 우리 지회의 모든 기능을 사용할 수 있습니다.</div>':""}
    ${Object.keys(by).length? Object.keys(by).map(s=>`<b>${SYS[s]||s}</b><ul>${by[s].map(k=>`<li>${esc(permLabel(k))}</li>`).join("")}</ul>`).join("") : '<div class="muted">부여된 권한이 없습니다. 필요하면 지회 담당자에게 요청하세요. (근태 본인 신청은 모든 직원이 사용할 수 있습니다.)</div>'}</div>`;
}

/* 직원·권한 */
function staffView(){
  const mgr = me.role==="admin" || me.role==="lead";
  const chn = SCH ? " · " + esc((SCHS.find(x=>x.id===SCH)||{}).name||"") : "";
  $("#body").innerHTML = chPicker() + (editId === "new"
    ? `<div class="card"><h2>직원 등록${chn}</h2>${staffForm(null, mgr)}</div>`
    : `<div class="card"><div class="st"><div><h2 style="margin:0">직원 등록${chn}</h2><div class="muted" style="font-size:12px">기본 정보·근태 정보·권한을 한 화면에서 한 번에 등록합니다. 퇴사한 직원은 <b>사용 중지</b>하세요(근태 기록은 남습니다).</div></div>
        <button class="btn" onclick="editId='new';openId=null;render()">＋ 직원 등록</button></div></div>`)
    + (staff.map(s=>staffCard(s, mgr)).join("") || '<div class="muted center">등록된 직원이 없습니다.</div>');
}
/* 등록·수정 공통 화면: ① 기본 정보 ② 근태 정보 ③ 권한 → 저장 한 번 */
function staffForm(s, mgr){
  const isNew = !s; s = s || {email:"", name:"", dept:"", position:"", hire_date:"", org_type:"", depts2:[], grants:[], role:"staff"};
  const a = isNew ? {role:"일반", supervisor:"", annualLeave:"", weeklyHours:"", stdIn:"", stdOut:"", hourly:"", contact:"", slackId:"", note:""} : attOf(s);
  const lb = t => `<label class="muted" style="font-size:12px;display:block;margin-top:4px">${t}</label>`;
  const sec = t => `<div class="full" style="margin-top:12px;padding-top:8px;border-top:1px dashed #d8dde6"><b>${t}</b></div>`;
  const org = s.org_type || (isNew ? (me.is_hq && !SCH ? "도협회" : "지회") : "");
  const attOn = !!(ATTI && ATTI.sheet && a);
  const seniors = ATTI && ATTI.rows ? ATTI.rows.filter(r=>r.role==="선임" && r.email!==String(s.email).toLowerCase()).map(r=>r.name) : [];

/* ───── 입사일 → 자동 연차 (근태 서버와 같은 계산) ─────
   입사한 해: 한 달 개근마다 1일(최대 11일) / 다음 해 15일, 그 뒤 2년마다 1일씩 더함(최대 25일) */
function annAuto(hire, year){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(hire||"")) return null;
  const hy = +hire.slice(0,4), y = +year;
  if(y < hy) return 0;
  if(y === hy){
    const t = new Date(Date.now() + 9*3600e3).toISOString().slice(0,10);
    const end = +t.slice(0,4) > y ? y + "-12-31" : t;
    const add = k => { let yy = +hire.slice(0,4), m = +hire.slice(5,7) + k; const d = +hire.slice(8,10);
      yy += Math.floor((m-1)/12); m = ((m-1)%12)+1; const last = new Date(Date.UTC(yy, m, 0)).getUTCDate();
      return yy + "-" + String(m).padStart(2,"0") + "-" + String(Math.min(d,last)).padStart(2,"0"); };
    let n = 0; for(let k=1;k<=12;k++){ const x = add(k); if(x <= end && x.slice(0,4) === String(y)) n++; }
    return Math.min(11, n);
  }
  return Math.min(25, 15 + Math.floor((y - hy)/2));
}
function annPlus(hire, year, extra){   // 자동 연차 + 매년 가산 (입사한 해 월차에는 더하지 않음)
  const n = annAuto(hire, year); if(n === null) return null;
  const x = Number(extra) > 0 ? Number(extra) : 0;
  return +year > +String(hire).slice(0,4) ? n + x : n;
}
function annText(hire, extra){
  const y = +new Date(Date.now() + 9*3600e3).toISOString().slice(0,4);
  const a = annPlus(hire, y, extra), b = annPlus(hire, y+1, extra);
  if(a === null) return "입사일을 넣으면 연차가 자동 계산됩니다.";
  return "🗓️ 자동 연차: <b>" + y + "년 " + a + "일</b> · " + (y+1) + "년 " + b + "일" + (Number(extra) > 0 ? " (매년 +" + Number(extra) + "일 포함)" : "") + " <span style=\"opacity:.8\">(연차 관리에서 그해 일수를 직접 넣으면 그 값이 우선)</span>";
}

      staff = await rpc("list_staff", PC());
      const n = staff.find(x=>String(x.email).toLowerCase()===val("e_email").toLowerCase()); if(!n) throw new Error("등록한 직원을 찾지 못했습니다.");
      id = n.id;
    }else{
      const cur = staff.find(x=>x.id===id);
      if($("#e_email") && !$("#e_email").disabled && cur && val("e_email").toLowerCase() !== String(cur.email).toLowerCase()){

        step = "이메일"; await rpc("update_staff_email", PC({p_id:id, p_email:val("e_email")}));
      }
      step = "기본 정보"; await rpc("update_staff", PC({p_id:id, p_name:val("e_name"), p_dept:val("e_dept"), p_position:val("e_pos")}));
    }

    step = "소속·입사일·근태 정보";
    const p = {org_type: (staff.find(x=>x.id===id)||{}).org_type || "", hire_date: val("e_hire")};   // 소속 구분은 화면에서 뺐음 (예전 값 유지)

    if(isNew && $("#wn_start")){ step = "근무조건"; await wtNewSave(id); }
    step = "권한";

      const on = c.checked, had = (s.grants||[]).includes(c.value);
      if(on !== had){ const [sys, perm] = c.value.split("."); await rpc("set_grant", PC({p_id:id, p_system:sys, p_perm:perm, p_on:on})); }
    }

  }
}

function shrinkImage(file){
  return new Promise((ok,bad)=>{
    const fr = new FileReader();
    fr.onerror = ()=>bad(new Error("이미지를 읽지 못했습니다."));
    fr.onload = ()=>{ const im = new Image(); im.onerror = ()=>bad(new Error("이미지 형식을 확인할 수 없습니다."));
      im.onload = ()=>{ for(let side of [320,240,180,120]){
          const r = Math.min(1, side/Math.max(im.width, im.height)), c = document.createElement("canvas");
          c.width = Math.max(1,Math.round(im.width*r)); c.height = Math.max(1,Math.round(im.height*r));
          c.getContext("2d").drawImage(im,0,0,c.width,c.height);
          const d = c.toDataURL("image/png"); if(d.length <= 140000) return ok(d);
        } bad(new Error("이미지가 너무 복잡합니다. 단순한 직인 이미지를 올려 주세요.")); };
      im.src = fr.result; };
    fr.readAsDataURL(file);
  });
}

/* 내 서명 — 본인 서명 이미지를 보관해 두면 공문·서식에서 꺼내 씁니다 */
let mySign = "", sigStat = null, padDraw = false, padDirty = false;
function signView(){
  $("#body").innerHTML = `<div class="card"><h2>✍️ 내 서명</h2>
    <div style="background:#fff7e6;border:1px solid #fde3a7;border-radius:8px;padding:8px 10px;margin:6px 0;font-size:13px">📌 <b>공문</b>: 결재선에 내 이름이 있는 문서를 열어 <b>✍️ 내 서명 넣기</b>를 누르면 인쇄할 때 내 결재 칸에 이 서명이 들어갑니다. (각자 자기 칸에만)<br>
      📌 <b>앞으로 전자결재를 도입하면</b> 결재 버튼을 누를 때 이 서명이 자동으로 찍힙니다.</div>
    <div class="muted">같은 지회 직원만 꺼내 쓸 수 있고, 도협회·다른 지회는 볼 수 없습니다.</div>
    <div style="margin-top:10px"><b>등록된 서명</b>${mySign?`<div><img src="${esc(mySign)}" style="max-height:90px;max-width:240px;border:1px solid #ddd;margin-top:4px;background:#fff"></div>`:'<div class="muted">아직 등록하지 않았습니다.</div>'}</div>
    <div style="margin-top:10px"><input type="file" accept="image/png,image/jpeg,image/webp" id="sg_f" style="display:none" onchange="signUpload(this)">
    <button class="btn sub sm" onclick="$('#sg_f').click()">📷 이미지 올리기</button>
    ${mySign?'<button class="btn sub sm" onclick="signDel()">삭제</button>':""}</div></div>
    <div class="card"><h2>직접 그리기</h2><div class="muted">아래 칸에 손가락이나 마우스로 서명하세요.</div>
    <canvas id="sg_pad" width="320" height="130" style="border:1px solid #bbb;border-radius:8px;background:#fff;touch-action:none;margin-top:8px;max-width:100%"></canvas>
    <div style="margin-top:8px"><button class="btn sub sm" onclick="padClear()">지우기</button> <button class="btn sm" onclick="padSave()">이 서명 저장</button></div></div>
    ${sigStat?`<div class="card"><h2>우리 지회 서명 등록 현황</h2>${sigStat.map(x=>`<div class="st"><div>${esc(x.name)} <span class="muted">${esc(x.email)}</span></div><div>${x.has?"✅ 등록":'<span class="muted">미등록</span>'}</div></div>`).join("")}</div>`:""}`;
  padInit();
}
function padInit(){
  const c = $("#sg_pad"); if(!c) return; const x = c.getContext("2d"); padDirty = false;
  x.lineWidth = 2.5; x.lineCap = "round"; x.lineJoin = "round"; x.strokeStyle = "#111";
  const pt = e=>{ const r = c.getBoundingClientRect(); return [(e.clientX-r.left)*c.width/r.width, (e.clientY-r.top)*c.height/r.height]; };
  c.onpointerdown = e=>{ padDraw = true; padDirty = true; const [a,b] = pt(e); x.beginPath(); x.moveTo(a,b); x.lineTo(a+0.1,b+0.1); x.stroke(); try{c.setPointerCapture(e.pointerId);}catch(_){} e.preventDefault(); };
  c.onpointermove = e=>{ if(!padDraw) return; const [a,b] = pt(e); x.lineTo(a,b); x.stroke(); e.preventDefault(); };
  c.onpointerup = c.onpointercancel = ()=>{ padDraw = false; };
}
function padClear(){ const c = $("#sg_pad"); if(c){ c.getContext("2d").clearRect(0,0,c.width,c.height); padDirty = false; } }
async function signSave(img){
  try{ await rpc("save_my_signature", {p_image:img}); toast("서명을 저장했습니다."); mySign = await rpc("get_my_signature"); if(me.can_manage) sigStat = await rpc("list_signature_status"); signView(); }
  catch(e){ toast(e.message, true); }
}
async function signUpload(input){
  const f = input.files && input.files[0]; if(!f) return;
  try{ await signSave(await shrinkImage(f)); }catch(e){ toast(e.message, true); }
}
function padSave(){
  const c = $("#sg_pad"); if(!c || !padDirty) return toast("먼저 서명을 그려 주세요.", true);
  const d = c.toDataURL("image/png"); if(d.length > 140000) return toast("서명이 너무 복잡합니다. 더 간단히 그려 주세요.", true);
  signSave(d);
}
function signDel(){ if(confirm("내 서명을 삭제할까요?")) act("delete_my_signature", {}, "삭제했습니다.", async()=>{ mySign = ""; if(me.can_manage) sigStat = await rpc("list_signature_status"); signView(); }); }

let drv = null;
async function gd(body){
  const s = await sb.auth.getSession(); const tok = s.data.session && s.data.session.access_token;
  const r = await fetch(SB_URL + "/functions/v1/gdrive", {method:"POST", headers:{"Content-Type":"application/json", Authorization:"Bearer " + tok, apikey: SB_KEY}, body: JSON.stringify(body)});
  const t = await r.text(); try{ return JSON.parse(t); }catch(e){ return {ok:false, msg: r.status===404 ? "서버에 gdrive 함수가 아직 설치되지 않았습니다. (설정 안내서 참고)" : "응답을 읽을 수 없습니다."}; }
}
async function loadDrive(){ drv = await gd({action:"status"}); }

      ${sec(CAL_AUTO?4:3,"🤟 통역일지 구글 시트", !!c.interp_sheet_id,
        c.interp_sheet_id?`<b>'${esc(c.interp_sheet_name)}'</b> 탭 · 통역일지를 저장하면 F열부터 빈 줄에 자동으로 한 줄 추가합니다.`:"통역일지를 저장할 때 기존 시트의 '통역' 탭에도 자동으로 적습니다. (미연결이어도 시스템에는 저장됨)",
        `<div class="drow"><input id="d_i${c.id}" placeholder="통역일지 구글 시트 주소 붙여넣기"><button class="btn" onclick="interpConnect(${c.id})">${c.interp_sheet_id?"다시 연결":"연결"}</button>${c.interp_sheet_id?`<button class="btn sub" onclick="interpOff(${c.id})">해제</button>`:""}</div>`,
        `그 시트의 <b>공유</b>에 서비스 계정을 <b>편집자</b>로 추가 → 시트 주소 복사`)}
      </div>`:""}</div>`;
  };
  const global = drv.is_admin ? `<div class="card"><details ${(drv.globals||[]).length?"":""}><summary style="cursor:pointer"><b>🌐 전 지회 공용 캘린더</b> <span class="muted">(도협회 관리자 · ${(drv.globals||[]).length}개)</span></summary>
      <div class="muted" style="margin-top:8px">여기에 추가하면 <b>18개 지회 모두</b>의 홈 화면에 보입니다. 도협회만 볼 캘린더는 위 <b>도협회</b> 칸의 ③에 넣으세요.</div>
      ${(drv.globals||[]).map(x=>`<div class="dx"><span><b>${esc(x.name)}</b> <span class="muted">${esc(x.calendar_id)}</span></span><button class="btn sub" onclick="calExtraDel(${x.id})">삭제</button></div>`).join("")||'<div class="muted" style="margin-top:6px">아직 없습니다.</div>'}
      <div class="drow"><input id="d_gx" placeholder="캘린더 ID"><input id="d_gxn" placeholder="표시 이름 (예: 도협회 행사)" style="max-width:200px"><button class="btn" onclick="calExtraAdd(0,true)">공용으로 추가</button></div></details></div>` : "";
  $("#body").innerHTML = `<style>
    .dsa{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;background:#f3f6fb;border-radius:10px;padding:8px 12px}.dsa span{font-size:13px;color:#64748b}.dsa b{font-size:14px;word-break:break-all}
    .dtab{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}.dtab th,.dtab td{padding:8px 6px;border-bottom:1px solid #e5e9f2;text-align:center}.dtab th{background:#f6f8fc;font-size:13px}.dtab td:first-child,.dtab th:first-child{text-align:left}
    .dtab tr{cursor:pointer}.dtab tr:hover td{background:#f8fafc}.dtab tr.on td{background:#eaf0ff}
    .dch{padding:0;overflow:hidden}.dch-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;cursor:pointer;background:#fafbfd;border-left:5px solid #cbd5e1}
    .dch.open .dch-h{background:#eaf0ff;border-left-color:#2f5bd6}.dname{font-size:17px;font-weight:800;min-width:90px}.dpills{display:flex;gap:5px;flex-wrap:wrap;flex:1}
    .dpill{font-size:12px;border-radius:20px;padding:3px 9px;background:#f1f3f6;color:#6b7280;font-weight:600}.dpill.on{background:#e3f6ec;color:#0f7a4f}.darw{font-size:13px;color:#2f5bd6;font-weight:700;white-space:nowrap}
    .dch-b{padding:6px 16px 16px}.dsec{border:1px solid #e5e9f2;border-radius:12px;padding:12px 14px;margin-top:12px;background:#fff}
    .dsec-h{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:15px}.dnum{width:22px;height:22px;border-radius:50%;background:#2f5bd6;color:#fff;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none}
    .drow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.drow input{flex:1 1 220px;min-width:0;margin:0}.drow .btn{flex:none}
    .dck{display:block;margin-top:8px;font-size:14px}.dck input{width:auto}
    .dx{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:6px 0;font-size:14px}.dx label{flex:1}.dx input{width:auto}
    .dhow{margin-top:8px;font-size:13px;color:#64748b}.dhow summary{cursor:pointer;color:#2f5bd6;font-weight:600}.dhow div{margin-top:6px;line-height:1.7}
  </style>${MG?adminAddCard():""}${head}${table}${chs.map(panel).join("")}${global}`;
}
async function driveConnect(id){
  const f = val("d_f"+id); if(!f) return toast("폴더 주소를 붙여 넣어 주세요.", true);
  toast("연결 중입니다...");
  const r = await gd({action:"connect", chapterId:id, folder:f});
  toast(r.ok ? "연결했습니다. 하위 폴더도 만들었습니다." : r.msg, !r.ok);
  await loadDrive(); driveView();
}
async function destAdd(id){
  const r = await gd({action:"destAdd", chapterId:id, name:val("d_dn"+id), folder:val("d_du"+id)});
  toast(r.ok?"추가했습니다.":r.msg, !r.ok); if(r.ok){ await loadDrive(); driveView(); } }
async function destDel(id, did){ if(!confirm("이 드라이브를 목록에서 뺄까요? (드라이브 속 파일은 지워지지 않습니다)")) return;
  const r = await gd({action:"destDel", chapterId:id, id:did}); toast(r.ok?"뺐습니다.":r.msg, !r.ok); await loadDrive(); driveView(); }
async function destRoute(id, gk, did, dept){ const r = await gd({action:"destRoute", chapterId:id, group:gk, id:did, dept:dept||""}); toast(r.ok?gk+(dept?" · "+dept:"")+" 저장 위치를 바꿨습니다.":r.msg, !r.ok); await loadDrive(); driveView(); }
async function groupAuto(id, gk, on){ const r = await gd({action:"groupAuto", chapterId:id, group:gk, on}); toast(r.ok?gk+" 자동 쌓기를 "+(on?"켰습니다.":"껐습니다."):r.msg, !r.ok); await loadDrive(); driveView(); }
async function driveAuto(id,on){ const r = await gd({action:"setAuto", chapterId:id, on}); toast(r.ok?(on?"자동 쌓기를 켰습니다.":"자동 쌓기를 껐습니다."):r.msg, !r.ok); await loadDrive(); driveView(); }
async function interpConnect(id){
  const f = val("d_i"+id); if(!f) return toast("구글 시트 주소를 붙여 넣어 주세요.", true);
  toast("연결 중입니다...");
  const r = await gd({action:"interpSheetConnect", chapterId:id, sheet:f});
  toast(r.ok ? "통역일지 시트를 연결했습니다." : r.msg, !r.ok);
  await loadDrive(); driveView();
}
async function interpOff(id){ if(!confirm("통역일지 시트 연결을 해제할까요? (시트의 내용은 지워지지 않습니다)")) return;
  const r = await gd({action:"interpSheetDisconnect", chapterId:id}); toast(r.ok?"해제했습니다.":r.msg, !r.ok); await loadDrive(); driveView(); }
async function calConnect(id){
  const f = val("d_c"+id); if(!f) return toast("캘린더 ID를 붙여 넣어 주세요.", true);
  toast("연결 중입니다...");
  const r = await gd({action:"calConnect", chapterId:id, calendarId:f});
  toast(r.ok ? "캘린더를 연결했습니다." : r.msg, !r.ok);
  await loadDrive(); driveView();
}
async function calExtraAdd(id,global){
  const f = val(global?"d_gx":"d_x"+id); if(!f) return toast("캘린더 ID를 붙여 넣어 주세요.", true);
  toast("확인 중입니다...");
  const r = await gd({action:"calExtraAdd", scope:global?"global":"chapter", chapterId:id||undefined, calendarId:f, name:val(global?"d_gxn":"d_xn"+id)});
  toast(r.ok ? "추가했습니다." : r.msg, !r.ok);
  await loadDrive(); driveView();
}
async function calExtraDel(id){ if(!confirm("이 캘린더를 목록에서 뺄까요? (구글 캘린더의 일정은 지워지지 않습니다)")) return;
  const r = await gd({action:"calExtraDel", id}); toast(r.ok?"뺐습니다.":r.msg, !r.ok); await loadDrive(); driveView(); }
async function calShow(id,cid,on){ const r = await gd({action:"calExtraShow", id, chapterId:cid, show:on}); toast(r.ok?(on?"보이게 했습니다.":"숨겼습니다."):r.msg, !r.ok); await loadDrive(); driveView(); }
async function calOff(id){ if(!confirm("캘린더 연결을 해제할까요? (이미 만들어진 일정은 지워지지 않습니다)")) return;
  const r = await gd({action:"calDisconnect", chapterId:id}); toast(r.ok?"해제했습니다.":r.msg, !r.ok); await loadDrive(); driveView(); }
async function driveOff(id){ if(!confirm("연결을 해제할까요? (드라이브의 파일은 지워지지 않습니다)")) return;
  const r = await gd({action:"disconnect", chapterId:id}); toast(r.ok?"해제했습니다.":r.msg, !r.ok); await loadDrive(); driveView(); }

/* 지회 담당 지정 (도협회 관리자) */
// 지회 관리 (도협회): 담당자 지정 + 드라이브·캘린더 연결을 한 화면에서
function chaptersView(){ driveView(); }
function adminAddCard(){ return `<div class="card"><h2>🏢 지회 관리</h2><div class="muted">지회를 누르면 <b>담당자 지정</b>과 <b>드라이브·캘린더·통역 시트 연결</b>이 함께 펼쳐집니다.</div>
  <details style="margin-top:10px"><summary style="cursor:pointer;color:#2f5bd6;font-weight:600">도협회 관리자 추가</summary>
  <div class="grid" style="margin-top:8px"><input id="a_email" placeholder="이메일"><input id="a_name" placeholder="이름"><button class="btn full" onclick="addAdmin()">관리자로 지정</button></div></details></div>`; }
// 연결 정보를 못 불러올 때: 담당자 지정만 (예전 화면)
function chaptersListView(note){
  $("#body").innerHTML = `${adminAddCard()}${note?`<div class="card"><div class="muted" style="color:#c0392b">${note}</div></div>`:""}
    ${chapters.filter(c=>!c.is_hq).map(c=>`<div class="card"><div class="st"><div><b>${esc(c.name)}</b> <span class="muted">직원 ${c.staff_count}명</span>
      <div>${c.lead_email?`지회 담당: <b>${esc(c.lead_name)}</b> <span class="muted">${esc(c.lead_email)}</span>`:'<span class="badge o">담당자 없음</span>'}</div></div></div>
      <div class="grid" style="margin-top:6px"><input id="l_e${c.id}" placeholder="새 담당 이메일"><input id="l_n${c.id}" placeholder="이름 (처음 등록할 때)"><button class="btn full" onclick="setLead(${c.id})">${c.lead_email?"담당자 교체":"담당자 지정"}</button></div></div>`).join("")}`;
}
function setLead(id){ if(!confirm("지회 담당을 지정할까요? 기존 담당자는 일반 직원으로 바뀝니다.")) return;
  act("assign_lead", {p_chapter:id, p_email:val("l_e"+id), p_name:val("l_n"+id)}, "지정했습니다.", async()=>{ chapters = await rpc("list_chapters"); try{ await loadDrive(); }catch(e){} chaptersView(); }); }
function addAdmin(){ act("set_admin", {p_email:val("a_email"), p_name:val("a_name"), p_on:true}, "지정했습니다.", async()=>{ await loadStaff(); toast("지정했습니다."); chaptersView(); }); }

sb.auth.onAuthStateChange((ev)=>{ if(ev === "SIGNED_OUT") loginView(); });
boot();
</script>
</body>
</html>

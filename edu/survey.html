<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>만족도 조사</title>
<style>
:root { --pine:#1f4d3a; --pine-soft:#e6f0ea; --bg:#f4f7f5; --ink:#1b2b24; --muted:#5d6b64; --line:#d5ded9; --red:#b3261e; --red-soft:#fbe9e7; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
.wrap { max-width:560px; margin:0 auto; padding:0 16px 48px; }
header { background:var(--pine); color:#fff; padding:16px; }
header h1 { margin:0; font-size:20px; } header p { margin:2px 0 0; font-size:13px; opacity:.85; }
.card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; margin-top:14px; }
.btn { width:100%; margin-top:16px; border:0; background:var(--pine); color:#fff; padding:14px; border-radius:10px; font:inherit; font-weight:700; font-size:17px; cursor:pointer; }
.btn:disabled { opacity:.5; }
.hint { color:var(--muted); font-size:13px; }
.err { background:var(--red-soft); color:var(--red); border-radius:10px; padding:10px 12px; margin-top:12px; font-size:14px; }
.center { text-align:center; padding:56px 20px; }
.hp { position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
textarea { width:100%; min-height:90px; padding:12px; border:1.5px solid var(--line); border-radius:10px; font:inherit; }
.scale { display:flex; gap:6px; margin-top:6px; }
.scale label { flex:1; text-align:center; }
.scale input { position:absolute; opacity:0; }
.scale span { display:block; padding:12px 0; border:1.5px solid var(--line); border-radius:10px; font-weight:700; background:#fff; cursor:pointer; }
.scale input:checked + span { background:var(--pine); color:#fff; border-color:var(--pine); }
.scale input:focus-visible + span { outline:3px solid #9bb0a5; }
.ends { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:2px; }
.q { margin-top:18px; font-weight:700; }
</style>
</head>
<body>
<div id="app"><div class="center hint">불러오는 중…</div></div>
<script>
// 기관 전체 이름: 지회는 '강원특별자치도농아인협회○○지회'(띄어쓰기 없이), 도협회는 협회 이름, 센터 등은 그 이름 그대로
function fullOrg(n) { n = String(n || '').trim(); if (!n || n === '도협회') return '강원특별자치도농아인협회'; return /지회$/.test(n) && n.indexOf('농아인협회') < 0 ? '강원특별자치도농아인협회' + n : n; }

const TOKEN = location.pathname.split('/').filter(Boolean).pop() || '';
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
async function api(fn, ...args) {
  let res;
  try { res = await (await fetch('/api/call', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fn: fn, args: [TOKEN, ...args] }) })).json(); }
  catch (e) { throw new Error('서버에 연결하지 못했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.'); }
  if (!res || !res.ok) { const e = new Error((res && res.error) || '처리하지 못했습니다.'); e.code = res && res.code; throw e; }
  return res.data;
}
function dead(msg) { $('#app').innerHTML = `<div class="center"><h2>조사에 참여할 수 없습니다</h2><p>${esc(msg)}</p></div>`; }
(async () => {
  let c;
  try { c = await api('surveyInfo'); } catch (e) { return dead(e.message); }
  const period = c.시작일 && c.종료일 ? `${c.시작일} ~ ${c.종료일}` : '';
  $('#app').innerHTML = `<header><div class="wrap" style="padding:0"><h1>${esc(c.강좌명)}</h1><p>${esc(fullOrg(c.지회명))} 만족도 조사${period ? ' · ' + esc(period) : ''}</p></div></header>
  <div class="wrap"><form class="card" id="f" autocomplete="off">
    <p style="margin:0">이름 없이 응답하며, 교육을 더 좋게 만드는 데만 쓰입니다. ${c.마감일 ? '<span class="hint">(' + esc(c.마감일) + '까지)</span>' : ''}</p>
    ${c.안내 ? `<p style="white-space:pre-wrap">${esc(c.안내)}</p>` : ''}
    ${c.문항.map((q, i) => q.유형 === '글' ? `<div><label class="q" for="q${i + 1}" style="display:block">${i + 1}. ${esc(q.문항)} <span class="hint">(선택)</span></label><textarea id="q${i + 1}" maxlength="500" style="min-height:70px"></textarea></div>`
      : `<fieldset style="border:0;padding:0;margin:0"><legend class="q">${i + 1}. ${esc(q.문항)}</legend>
      <div class="scale">${[1, 2, 3, 4, 5].map(v => `<label><input type="radio" name="q${i + 1}" value="${v}"><span>${v}</span></label>`).join('')}</div>
      <div class="ends"><span>전혀 아니다</span><span>매우 그렇다</span></div></fieldset>`).join('')}
    <label class="q" for="o" style="display:block">의견 (선택)</label>
    <textarea id="o" maxlength="1000" placeholder="좋았던 점, 아쉬웠던 점을 자유롭게 적어 주세요."></textarea>
    <div class="hp" aria-hidden="true"><label>웹사이트<input type="text" id="w" tabindex="-1" autocomplete="off"></label></div>
    <div id="e"></div><button class="btn" id="b">제출하기</button></form></div>`;
  $('#f').onsubmit = async ev => {
    ev.preventDefault();
    const b = $('#b'); b.disabled = true; $('#e').innerHTML = '';
    const form = { 의견: $('#o').value, website: $('#w').value };
    c.문항.forEach((q, k) => { const i = k + 1; if (q.유형 === '글') form['q' + i] = $('#q' + i).value; else { const x = document.querySelector(`input[name=q${i}]:checked`); form['q' + i] = x ? x.value : ''; } });
    try {
      await api('surveySubmit', form);
      $('#app').innerHTML = `<div class="center"><div style="font-size:44px">🙏</div><h2>참여해 주셔서 감사합니다</h2><p>응답이 제출되었습니다.</p></div>`;
    } catch (e) {
      if (e.code === 'LINK') return dead(e.message);
      $('#e').innerHTML = `<div class="err">${esc(e.message)}</div>`; b.disabled = false;
    }
  };
})();
</script>
</body>
</html>

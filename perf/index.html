<style>
  * { box-sizing: border-box; }

  textarea { min-height: 70px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0 12px; } .wide { grid-column: 1 / -1; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; } .tools select, .tools input { width: auto; min-width: 120px; }
  .tablewrap { overflow-x: auto; background: #fff; border: 1px solid #dde3ea; border-radius: 10px; margin-bottom: 14px; }

  .st-검토중 { background: #efe1ff; color: #6b2fa8; } .st-반려, .st-보완요청 { background: #f8d7d3; color: #9b2c22; } .st-승인완료 { background: #d6f0dc; color: #17643a; }

  .muted { color: #778; font-size: 13px; }

</main>

<script>
const SUPABASE_URL = 'https://uamlualqqcqmpdkprjfs.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhbWx1YWxxcWNxbXBka3ByamZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwNjE0OTMsImV4cCI6MjExMDYzNzQ5M30._f4p4pfcKaYbmjKRXOPpkMo7Ydcc26oVVI6lRFYsLkY';
const ALLOWED_DOMAIN = 'gwdeaf.or.kr';
const EMBED = new URLSearchParams(location.search).get('embed') === '1';
if (EMBED) document.body.classList.add('embed');
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let ME = null, TAB = '';
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => Number(n || 0).toLocaleString('ko-KR');
const errText = (e) => (e && (e.message || e.error_description)) || '알 수 없는 오류가 났습니다.';
const today = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' });
const curYear = () => Number(today().slice(0, 4));
const curQ = () => Math.ceil(Number(today().slice(5, 7)) / 3);
const qOf = (d) => Math.ceil(Number(String(d).slice(5, 7)) / 3);
const Q_LABEL = { 1: '1분기 (1~3월)', 2: '2분기 (4~6월)', 3: '3분기 (7~9월)', 4: '4분기 (10~12월)' };
const LOCKED = ['제출 완료', '검토 중', '승인 완료'];
const yearOpts = (sel) => Array.from({ length: 5 }, (_, i) => curYear() - i).map((y) => `<option value="${y}" ${y == sel ? 'selected' : ''}>${y}년</option>`).join('');
const qOpts = (sel, all) => (all ? `<option value="0" ${!+sel ? 'selected' : ''}>연간 전체</option>` : '') + [1, 2, 3, 4].map((q) => `<option value="${q}" ${q == sel ? 'selected' : ''}>${all ? q + '분기' : Q_LABEL[q]}</option>`).join('');
const badge = (st) => `<span class="badge st-${String(st).replace(/\s/g, '')}">${esc(st)}</span>`;
const dText = (t) => t ? new Date(t).toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' }) : '';
async function rpc(fn, args) { const { data, error } = await sb.rpc(fn, args || {}); if (error) throw new Error(errText(error)); return data; }
function flash(text, tone) { $('flash').innerHTML = text ? `<div class="note ${tone || 'ok'}">${esc(text)}</div>` : ''; if (text) window.scrollTo({ top: 0, behavior: 'smooth' }); }
function head(title, desc, btns) { return `<div class="head"><div><h2>${esc(title)}</h2>${desc ? `<p class="desc">${desc}</p>` : ''}</div><div class="noprint">${btns || ''}</div></div>`; }
function view(html) { $('view').innerHTML = html; }
// 화면 순서 지키기: 메뉴를 빨리 바꿔 누르면, 늦게 도착한 이전 화면이 지금 화면을 덮어쓰지 않게 함
let VTK = 0; function vtok() { return ++VTK; } function vview(t, html) { if (t === VTK) view(html); }
function loading() { view('<p class="muted">불러오는 중…</p>'); }
function csv(name, rows) {
  if (!rows.length) { flash('내보낼 자료가 없습니다.', 'warn'); return; }
  const h = Object.keys(rows[0]), q = (v) => { const s = v == null ? '' : String(v); return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const blob = new Blob(['﻿' + [h.join(','), ...rows.map((r) => h.map((k) => q(r[k])).join(','))].join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
// 집계: 실시 횟수 / 연인원(회차별 참여자 합) / 실인원(중복 제외 — 회원은 회원 번호, 비회원은 한 줄이 한 사람)
function summarize(rows) { const set = new Set(); let tot = 0; rows.forEach((r) => { (r.keys || []).forEach((k) => set.add(k)); tot += (r.keys || []).length; }); return { cnt: rows.reduce((n, r) => n + (Number(r.rounds) || 1), 0), tot, uniq: set.size }; }
// 회차 표시: 전체 실적은 '1~12회', 기간은 '시작~끝'
function rLabel(s) { const n = Number(s.rounds) || 1; return n > 1 ? `${s.round_no}~${s.round_no + n - 1}회` : `${s.round_no}회`; }
function dLabel(s) { return s.end_on && s.end_on !== s.held_on ? `${s.held_on} ~ ${s.end_on}` : s.held_on; }
// 회원은 지회에만 있는 개념: 도협회·센터·문화원 사업은 회원을 연결하지 않음
function noMemberProject(p) { return !!(ME.is_hq || (p && /센터|문화원/.test(p.dept || ''))); }
function groupSum(rows, keyFn, nameFn) { const m = new Map(); rows.forEach((r) => { const k = keyFn(r); if (!m.has(k)) m.set(k, []); m.get(k).push(r); }); return [...m.entries()].map(([k, l]) => ({ key: k, name: nameFn(l[0]), list: l, ...summarize(l) })); }
function bars(items, unit) {
  const max = Math.max(1, ...items.map((i) => i.value));
  return `<div class="bars">${items.map((i) => `<div class="bar"><span class="l" title="${esc(i.label)}">${esc(i.label)}</span><span class="t"><i style="width:${Math.round(i.value / max * 100)}%"></i></span><span class="v">${fmt(i.value)}${unit}</span></div>`).join('') || '<p class="muted">자료가 없습니다.</p>'}</div>`;
}
// 참여자 구분: 회원(지회 회원명단) / 수강생(수어교육관리에서 자동) / 비회원(직접 입력한 외부 참여자)
function pkind(p) { return p.member_id ? '회원' : /^수어교육/.test(p.note || '') ? '수강생' : '비회원'; }
function kpi(label, value, sub) { return `<div class="kpi"><span>${esc(label)}</span><b>${value}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</div>`; }

// ===== 로그인 =====
async function loginGoogle() {
  const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname, queryParams: { hd: ALLOWED_DOMAIN, prompt: 'select_account' } } });
  if (error) alert(errText(error));
}
async function logout() { await sb.auth.signOut(); location.href = location.origin + location.pathname; }
function showScreen(id) { document.querySelectorAll('.screen').forEach((s) => s.classList.remove('on')); $(id).classList.add('on'); }
let BOOTING = false;
async function boot() {
  if (BOOTING || ME) return; BOOTING = true;
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { showScreen('screenLogin'); return; }
    let d = null;
    try { d = await rpc('perf_me'); } catch (e) { $('deniedText').textContent = /perf_me/.test(e.message) ? '사업실적 DB 설정(24번 SQL)이 아직 안 되어 있습니다. 관리자에게 알려 주세요.' : e.message; showScreen('screenDenied'); return; }
    if (!d) { showScreen('screenDenied'); return; }
    if (!d.can_view && !d.can_review) { $('deniedText').textContent = '사업실적 권한이 없습니다. 지회 담당자에게 [직원·권한 관리]에서 사업실적 권한을 받으세요.'; showScreen('screenDenied'); return; }
    ME = d;
    DF = (ME.depts || []).includes(ME.cur_dept) ? ME.cur_dept : '';
    $('whoText').textContent = `${ME.chapter_name} · ${ME.name}`;
    $('topNav').style.display = 'flex';
    $('setBtn').style.display = ME.can_review ? '' : 'none';
    showScreen('screenApp');
    // 수어교육관리 강좌 실적을 사업실적으로 맞춤 (실패해도 화면은 그대로)
    try { const r = await rpc('perf_edu_sync'); if (r && r.ok === false) console.warn(r.msg); } catch (e) { console.warn(e.message); }
    subGo(SUB.go || 'dash');
    subReady();
  } finally { BOOTING = false; }
}
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_IN' || ev === 'INITIAL_SESSION') boot(); });
boot();

// ===== 하위 메뉴 (업무 시스템 왼쪽 메뉴에서 이동) =====
const SUB = { go: new URLSearchParams(location.search).get('go') || '', ready: false };
function subTell(t) { if (EMBED && window.parent !== window) try { window.parent.postMessage({ type: 'sub-tab', tab: t }, location.origin); } catch (e) {} }
function subReady() { SUB.ready = true; if (EMBED && window.parent !== window) try { window.parent.postMessage({ type: 'sub-ready', tab: SUB.go }, location.origin); } catch (e) {} }
window.addEventListener('message', (e) => { if (e.origin !== location.origin || !e.data || e.data.type !== 'sub-go') return; SUB.go = e.data.tab; if (SUB.ready) subGo(SUB.go); });
const SCREENS = { dash: showDash, projects: showProjects, new: (a, b) => showSessionForm(a, b), list: showList, people: showPeople, reports: showReports, stats: showStats, settings: showSettings };
function subGo(t) { go(SCREENS[t] ? t : 'dash'); }
function go(t, ...args) {
  TAB = t; flash('');
  document.querySelectorAll('#topNav [data-tab]').forEach((b) => b.classList.toggle('on', b.dataset.tab === t));
  subTell(t);
  return SCREENS[t](...args);
}
function goMember() { if (EMBED) try { window.parent.postMessage({ type: 'nav-go', kind: 'member' }, location.origin); } catch (e) {} else location.href = '/member/'; }

// ===== 대시보드 =====
const DASH = { year: curYear(), ch: '' };
async function showDash() { const VT = vtok();
  loading();
  try {
    const all = await rpc('perf_stat_rows', { p_year: DASH.year, p_chapter: DASH.ch ? Number(DASH.ch) : null });
    const rows = all.filter((r) => r.held_on.startsWith(String(DASH.year))), prev = all.filter((r) => r.held_on.startsWith(String(DASH.year - 1)));
    const q = DASH.year === curYear() ? curQ() : 4;
    const t = summarize(rows), qs = summarize(rows.filter((r) => qOf(r.held_on) === q)), ps = summarize(prev);
    const change = ps.tot ? Math.round((t.tot - ps.tot) / ps.tot * 1000) / 10 : null;
    let repTxt = '', repSub = '';
    if (ME.can_review) { const b = await rpc('perf_report_board', { p_year: DASH.year, p_q: q }); repTxt = `${b.filter((x) => LOCKED.includes(x.status)).length} / ${b.length}`; repSub = `${q}분기 제출 지회 수`; }
    else if (!ME.is_hq) { const r = await rpc('perf_report_get', { p_year: DASH.year, p_q: q }); repTxt = r.report ? r.report.status : '작성 전'; repSub = `${q}분기 보고 상태`; }
    const chSel = ME.can_review ? `<select onchange="DASH.ch=this.value;showDash()"><option value="">전체 지회</option>${ME.chapters.map((c) => `<option value="${c.id}" ${String(c.id) === DASH.ch ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>` : '';
    const top = groupSum(rows, (r) => r.project_id, (r) => (ME.can_review && !DASH.ch ? r.chapter_name + ' · ' : '') + r.project_name).sort((a, b) => b.tot - a.tot).slice(0, 8);
    vview(VT, head('대시보드', '선택한 연도의 사업실적 현황입니다. 연인원 = 회차별 참여자 수 합계 · 실인원 = 중복을 뺀 인원',
        (ME.can_write ? `<button class="main" onclick="go('new')">+ 사업실적 등록</button>` : '') + `<button onclick="go('reports')">분기 보고</button>`) +
      `<div class="tools"><select onchange="DASH.year=+this.value;showDash()">${yearOpts(DASH.year)}</select>${chSel}</div>
      <div class="kpis">${kpi('실시한 사업 수', fmt(new Set(rows.map((r) => r.project_id)).size), '실시 기록이 있는 사업')}${kpi('총 실시 횟수', fmt(t.cnt) + '회', '등록된 회차 기준')}
        ${kpi('연인원', fmt(t.tot) + '명', '회차별 참여자 합계')}${kpi('실인원', fmt(t.uniq) + '명', '중복 제외')}

// 입력 방식: 회차별 / 전체 실적 (기간·실시 횟수를 한 번에)
function sfMode(m) {
  SF.mode = m;
  document.querySelectorAll('.mtabs button').forEach((b) => b.classList.toggle('on', b.dataset.m === m));
  document.querySelectorAll('.sf-t').forEach((e) => { e.style.display = m === 'total' ? '' : 'none'; });
  document.querySelectorAll('.sf-r').forEach((e) => { e.style.display = m === 'total' ? 'none' : ''; });
  $('sf_round_l').textContent = m === 'total' ? '시작 회차' : '실시 회차';
  $('sf_held_l').textContent = m === 'total' ? '기간 시작' : '사업 실시일';
  $('sfModeHint').textContent = m === 'total' ? '여러 회를 한 번에: 기간과 실시 횟수, 전체 참여 인원을 적습니다.' : '한 번 실시할 때마다 한 줄씩 입력합니다.';
}
// 도협회·센터·문화원 사업은 회원 연결 없음
function sfMemberRule() {

// ── 엑셀 명단 업로드: 성명(이름)·회원번호·소속·연락처·비고 열을 읽어서
//    회원번호가 맞거나 이름이 같은 회원이 한 명뿐이면 → 회원으로 체크, 아니면 → 회원명단에 없는 참여자로 추가
const XL_URL = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
function xlLoad() { return window.XLSX ? Promise.resolve() : new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = XL_URL; sc.onload = ok; sc.onerror = () => no(new Error('엑셀 읽기 도구를 불러오지 못했습니다. 인터넷 연결을 확인하세요.')); document.head.appendChild(sc); }); }
async function xlTemplate() {
  try { await xlLoad(); } catch (e) { alert(e.message); return; }
  const ws = XLSX.utils.aoa_to_sheet([['성명', '회원번호', '소속', '연락처', '비고'], ['홍길동', '', '○○복지관', '010-0000-0000', '']]);
  ws['!cols'] = [{ wch: 12 }, { wch: 10 }, { wch: 20 }, { wch: 16 }, { wch: 20 }];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, '참여자명단'); XLSX.writeFile(wb, '참여자명단_양식.xlsx');
}
async function xlUpload(inp) {
  const f = inp.files && inp.files[0]; inp.value = ''; if (!f) return;
  try {
    await xlLoad();
    const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' }).map((r) => r.map((c) => String(c).trim()));
    const hi = rows.findIndex((r) => r.some((c) => /^(성명|이름|참여자|참가자)$/.test(c)));
    if (hi < 0) { alert('첫 줄(제목 줄)에 "성명" 또는 "이름" 열이 있어야 합니다. [양식 받기]로 받은 파일을 쓰면 편해요.'); return; }
    const h = rows[hi], col = (re) => h.findIndex((c) => re.test(c));
    const cN = col(/^(성명|이름|참여자|참가자)$/), cNo = col(/회원\s*번호/), cA = col(/소속|기관|단체/), cP = col(/연락처|전화|휴대/), cR = col(/비고|메모/);
    let mem = 0, ext = 0, dup = 0, skip = 0;
    rows.slice(hi + 1).forEach((r) => {
      const name = (r[cN] || '').replace(/\s+/g, ''); if (!name) { if (r.some((c) => c)) skip++; return; }
      const no = cNo >= 0 ? r[cNo] : '';
      const noMem = noMemberProject(SF.projects.find((x) => String(x.id) === String($('sf_project').value)));   // 회원 연결 없는 사업이면 모두 직접 입력으로
      let m = no && !noMem ? SF.members.find((x) => String(x.member_no || '') === no) : null;
      if (!m && !noMem) { const same = SF.members.filter((x) => x.name.replace(/\s+/g, '') === name); if (same.length === 1) m = same[0]; }
      if (m) { if (SF.sel.has(m.id)) dup++; else { SF.sel.add(m.id); mem++; } return; }
      if (SF.ext.some((x) => x.name.replace(/\s+/g, '') === name && x.phone === (cP >= 0 ? r[cP] : ''))) { dup++; return; }
      SF.ext.push({ id: '', name: r[cN], affiliation: cA >= 0 ? r[cA] : '', phone: cP >= 0 ? r[cP] : '', note: cR >= 0 ? r[cR] : '' }); ext++;
    });
    drawExt();
    flash(`엑셀에서 회원 ${mem}명 체크 · 회원명단에 없는 참여자 ${ext}명 추가${dup ? ` · 이미 있는 ${dup}명 건너뜀` : ''}${skip ? ` · 이름 없는 줄 ${skip}개 건너뜀` : ''}. 확인 후 [실적 저장]을 누르세요.`);
  } catch (e) { alert('엑셀을 읽지 못했습니다: ' + e.message); }
}

      ${h.map((x) => `<tr><td>${esc(x.held_on)}</td><td>${esc(x.project_name)}</td><td>${x.round_no}회</td></tr>`).join('') || '<tr><td colspan="3" class="muted">참여 기록이 없습니다.</td></tr>'}</tbody></table></div></div>`;
    document.body.appendChild(ov);
    ov.onclick = (e) => { if (e.target === ov || e.target.id === 'mhX') ov.remove(); };
  } catch (e) { flash(e.message, 'err'); }
}

// ===== 분기별 보고 =====
const REP = { year: curYear(), q: curQ() };
async function showReports() { const VT = vtok();
  loading();
  const tools = `<div class="tools noprint"><select onchange="REP.year=+this.value;showReports()">${yearOpts(REP.year)}</select><select onchange="REP.q=+this.value;showReports()">${qOpts(REP.q)}</select></div>`;
  try {
    if (ME.can_review) { const bd = await rpc('perf_report_board', { p_year: REP.year, p_q: REP.q }); if (VT === VTK) drawBoard(tools, bd); return; }
    if (ME.is_hq) { vview(VT, head('분기별 보고') + '<div class="note warn">분기 보고는 각 지회가 도협회로 제출합니다. 검토 권한이 있으면 지회별 제출 현황이 보입니다.</div>'); return; }
    const rd = await rpc('perf_report_get', { p_year: REP.year, p_q: REP.q }); if (VT === VTK) drawChapterReport(tools, rd);
  } catch (e) { vview(VT, `<div class="note err">${esc(e.message)}</div>`); }
}
function reportTables(sh) {
  const T = sh.totals || {};
  return `<div class="kpis">${kpi('실시 횟수', fmt(T.sessionCount) + '회')}${kpi('연인원', fmt(T.totalParticipants) + '명')}${kpi('실인원', fmt(T.uniquePeople) + '명', '분기 전체 중복 제외')}</div>
    <h3>사업별 실적</h3><div class="tablewrap"><table><thead><tr><th>사업명</th><th class="n">실시 횟수</th><th class="n">연인원</th><th class="n">실인원</th></tr></thead><tbody>
    ${(sh.projects || []).map((p) => `<tr><td><b>${esc(p.name)}</b></td><td class="n">${fmt(p.sessionCount)}</td><td class="n">${fmt(p.totalParticipants)}</td><td class="n">${fmt(p.uniquePeople)}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">이 분기에 실시한 사업이 없습니다.</td></tr>'}
    ${(sh.projects || []).length ? `<tr class="total"><td>분기 전체 합계</td><td class="n">${fmt(T.sessionCount)}</td><td class="n">${fmt(T.totalParticipants)}</td><td class="n">${fmt(T.uniquePeople)}</td></tr>` : ''}</tbody></table></div>
    <h3>사업 실시일 상세</h3><div class="tablewrap"><table><thead><tr><th>사업명</th><th>실시일</th><th>회차</th><th>장소</th><th>사업 내용</th><th class="n">참여인원</th></tr></thead><tbody>
    ${(sh.projects || []).flatMap((p) => (p.sessions || []).map((s) => `<tr><td>${esc(p.name)}</td><td>${esc(dLabel(s))}</td><td>${rLabel(s)}</td><td>${esc(s.place || '-')}</td><td class="muted">${esc(s.content || '-')}</td><td class="n">${fmt(s.participants)}</td></tr>`)).join('') || '<tr><td colspan="6" class="muted">내용이 없습니다.</td></tr>'}</tbody></table></div>`;
}
let RPT = null;
function drawChapterReport(tools, d) {
  RPT = d;
  const r = d.report, st = r ? r.status : '작성 전', locked = LOCKED.includes(st), sh = locked && r.snapshot ? r.snapshot : d.live;
  view(head('분기별 보고', '선택한 분기의 실적을 자동으로 모아 보여 줍니다. 확인 후 도협회에 제출하세요.', '<button onclick="window.print()">🖨 인쇄</button>') + tools +
    `<div class="card"><b>${esc(ME.chapter_name)} · ${REP.year}년 ${Q_LABEL[REP.q]}</b> ${badge(st)} ${r && r.submitted_at ? `<span class="muted">제출일 ${dText(r.submitted_at)}</span>` : ''}</div>
    ${(st === '보완 요청' || st === '반려') && r.reviewer_note ? `<div class="note err">보완 요청 사유: ${esc(r.reviewer_note)} · 내용을 고친 뒤 다시 제출해 주세요.</div>` : ''}
    ${locked ? '<div class="note warn">제출된 보고입니다. 아래 내용은 제출 당시의 집계이며, 이 분기 실적은 잠겨 있습니다.</div>' : ''}
    ${reportTables(sh)}
    <div class="card"><h3>보충 설명</h3><textarea id="repNote" ${locked || !d.can_manage ? 'disabled' : ''} placeholder="보고서에 덧붙일 설명이 있으면 적어 주세요.">${esc(r ? r.note : '')}</textarea></div>
    <div class="noprint">${!d.can_manage ? '<span class="muted">보고 저장·제출은 사업·보고 관리 권한이 있는 직원이 합니다.</span>'
      : st === '제출 완료' ? '<button onclick="repCancel()">제출 취소</button> <span class="muted">도협회가 검토를 시작하기 전에는 취소할 수 있습니다.</span>'
      : locked ? '' : `<button onclick="repSave(false)">임시 저장</button><button class="main" onclick="repSave(true)">${(st === '보완 요청' || st === '반려') ? '수정 후 다시 제출' : '도협회 제출'}</button>`}</div>`);
}
async function repSave(submit) {
  const n = RPT.live.totals.sessionCount;
  if (submit && !confirm(n ? `${REP.year}년 ${REP.q}분기 보고를 도협회에 제출할까요?\n제출하면 이 분기 실적은 고칠 수 없습니다. (도협회가 보완을 요청하거나 제출을 취소하면 다시 고칠 수 있습니다)` : '이 분기에 등록된 실적이 없습니다. 그래도 제출할까요?')) return;
  try { const d = await rpc('perf_report_save', { p_year: REP.year, p_q: REP.q, p_note: $('repNote').value, p_submit: submit }); await showReports(); flash(submit ? '도협회에 제출했습니다.' : '임시 저장했습니다.'); }
  catch (e) { flash(e.message, 'err'); }
}
async function repCancel() {
  if (!confirm('제출을 취소할까요? 이 분기 실적의 잠금이 풀립니다.')) return;
  try { await rpc('perf_report_cancel', { p_year: REP.year, p_q: REP.q }); await showReports(); flash('제출을 취소했습니다.'); } catch (e) { flash(e.message, 'err'); }
}
let BRD = [];
function drawBoard(tools, rows) {
  BRD = rows;
  const sub = rows.filter((r) => LOCKED.includes(r.status)).length, not = rows.filter((r) => r.status === '작성 전' || r.status === '작성 중').map((r) => r.chapter_name);
  view(head('분기별 보고 (도협회)', '지회가 제출한 분기 보고를 검토하고 승인하거나 보완을 요청합니다. 숫자는 제출 당시 집계입니다.', '<button onclick="boardCsv()">전체 지회 통합 CSV</button><button onclick="window.print()">🖨 인쇄</button>') + tools +
    `<div class="kpis">${kpi('제출 지회', `${sub} / ${rows.length}`, `${REP.q}분기 기준`)}${kpi('미제출 지회', fmt(not.length), not.join(', ') || '모두 제출')}</div>
    <div class="tablewrap"><table><thead><tr><th>지회</th><th>상태</th><th>제출일</th><th class="n">실시 횟수</th><th class="n">연인원</th><th class="n">실인원</th><th class="noprint">관리</th></tr></thead><tbody>
    ${rows.map((r, i) => { const t = r.snapshot && r.snapshot.totals; return `<tr><td><b>${esc(r.chapter_name)}</b></td><td>${badge(r.status)}</td><td class="muted">${dText(r.submitted_at) || '-'}</td>
      <td class="n">${t ? fmt(t.sessionCount) : '-'}</td><td class="n">${t ? fmt(t.totalParticipants) : '-'}</td><td class="n">${t ? fmt(t.uniquePeople) : '-'}</td>
      <td class="noprint">${r.snapshot ? `<button onclick="boardDetail(${i})">상세</button>` : ''}${r.status === '제출 완료' ? `<button onclick="review(${i},'검토 중')">검토 시작</button>` : ''}
        ${['제출 완료', '검토 중'].includes(r.status) ? `<button class="main" onclick="review(${i},'승인 완료')">승인</button><button class="danger" onclick="review(${i},'보완 요청')">보완 요청</button>` : ''}</td></tr>`; }).join('') || '<tr><td colspan="7" class="muted">지회가 없습니다.</td></tr>'}
    </tbody></table></div>`);
}
function boardDetail(i) {
  const r = BRD[i], ov = document.createElement('div'); ov.className = 'modal';
  ov.innerHTML = `<div class="card">${head(`${r.chapter_name} · ${REP.year}년 ${REP.q}분기`, `${badge(r.status)} 제출 ${dText(r.submitted_at)} ${esc(r.submitted_by || '')}`, '<button id="bdX">닫기</button>')}
    ${r.note ? `<div class="note warn">보충 설명: ${esc(r.note)}</div>` : ''}${r.reviewer_note ? `<div class="note err">마지막 보완 요청 사유: ${esc(r.reviewer_note)}</div>` : ''}${reportTables(r.snapshot)}</div>`;
  document.body.appendChild(ov); ov.onclick = (e) => { if (e.target === ov || e.target.id === 'bdX') ov.remove(); };
}
async function review(i, action) {
  const r = BRD[i]; let note = '';
  if (action === '보완 요청') { note = prompt(`${r.chapter_name} 보고에 보완을 요청합니다. 보완 요청 사유를 입력하세요.`); if (!note || !note.trim()) return; }
  else if (!confirm(`${r.chapter_name} 보고를 '${action}' 처리할까요?`)) return;
  try { const rows = await rpc('perf_report_review', { p_chapter: r.chapter_id, p_year: REP.year, p_q: REP.q, p_action: action, p_note: note });
    drawBoard(`<div class="tools noprint"><select onchange="REP.year=+this.value;showReports()">${yearOpts(REP.year)}</select><select onchange="REP.q=+this.value;showReports()">${qOpts(REP.q)}</select></div>`, rows);
    flash(`${r.chapter_name} 보고를 '${action}' 처리했습니다.`); } catch (e) { flash(e.message, 'err'); }
}
function boardCsv() {
  const out = [];
  BRD.forEach((r) => { if (!r.snapshot) { out.push({ 지회: r.chapter_name, 보고상태: r.status, 사업명: '', 실시횟수: '', 연인원: '', 실인원: '' }); return; }
    (r.snapshot.projects || []).forEach((p) => out.push({ 지회: r.chapter_name, 보고상태: r.status, 사업명: p.name, 실시횟수: p.sessionCount, 연인원: p.totalParticipants, 실인원: p.uniquePeople })); });
  csv(`${REP.year}년_${REP.q}분기_지회별_통합보고.csv`, out);
}

// ===== 통계 및 분석 =====
const STS = { year: curYear(), q: 0, ch: '', proj: '' };
const stDeptOn = () => !ME.can_review || STS.ch === String(ME.chapter_id);   // 우리 기관을 볼 때만 부서별 보기 (다른 지회는 부서 이름이 다름)
async function showStats() { const VT = vtok();
  loading();
  try {
    const all = await rpc('perf_stat_rows', { p_year: STS.year, p_chapter: STS.ch ? Number(STS.ch) : null });
    const yr = all.filter((r) => r.held_on.startsWith(String(STS.year)) && (!stDeptOn() || dfOk(r.dept)));
    const rows = yr.filter((r) => (!STS.q || qOf(r.held_on) === STS.q) && (!STS.proj || String(r.project_id) === STS.proj));
    const t = summarize(rows), multi = ME.can_review && !STS.ch;
    const byP = groupSum(rows, (r) => r.project_id, (r) => (multi ? r.chapter_name + ' · ' : '') + r.project_name).map((p) => ({ ...p, plan: p.list[0].plan_count, rate: p.list[0].plan_count ? Math.round(p.cnt / p.list[0].plan_count * 1000) / 10 : null })).sort((a, b) => b.tot - a.tot);
    const byC = groupSum(rows, (r) => r.chapter_id, (r) => r.chapter_name).sort((a, b) => b.tot - a.tot);
    const byK = groupSum(rows, (r) => r.category, (r) => r.category).sort((a, b) => b.tot - a.tot);
    const keys = rows.flatMap((r) => r.keys), mem = keys.filter((k) => k[0] === 'm'), stu = keys.filter((k) => /^xedu/.test(k)), cntBy = {}; mem.forEach((k) => { cntBy[k] = (cntBy[k] || 0) + 1; });
    const planSum = byP.reduce((s, p) => s + (p.plan || 0), 0), rate = planSum ? Math.round(t.cnt / planSum * 1000) / 10 : null;
    const projOpts = groupSum(yr, (r) => r.project_id, (r) => (multi ? r.chapter_name + ' · ' : '') + r.project_name);
    const tbl = (head1, list, withPlan) => `<div class="tablewrap"><table><thead><tr><th>${head1}</th><th class="n">실시 횟수</th>${withPlan ? '<th class="n">계획</th><th class="n">달성률</th>' : ''}<th class="n">연인원</th><th class="n">실인원</th></tr></thead><tbody>
      ${list.map((p) => `<tr><td>${esc(p.name)}</td><td class="n">${fmt(p.cnt)}</td>${withPlan ? `<td class="n">${fmt(p.plan)}</td><td class="n">${p.rate === null ? '-' : p.rate + '%'}</td>` : ''}<td class="n">${fmt(p.tot)}</td><td class="n">${fmt(p.uniq)}</td></tr>`).join('') || `<tr><td colspan="${withPlan ? 6 : 4}" class="muted">자료가 없습니다.</td></tr>`}</tbody></table></div>`;
    STS.byP = byP;
    vview(VT, head('통계 및 분석', '연도·분기·사업을 골라 실적을 봅니다. 연인원과 실인원을 구분합니다.', '<button onclick="statsCsv()">사업별 표 CSV</button><button onclick="window.print()">🖨 인쇄</button>') +
      `<div class="tools noprint"><select onchange="STS.year=+this.value;STS.proj='';showStats()">${yearOpts(STS.year)}</select><select onchange="STS.q=+this.value;showStats()">${qOpts(STS.q, true)}</select>
        ${ME.can_review ? `<select onchange="STS.ch=this.value;STS.proj='';showStats()"><option value="">전체 지회</option>${ME.chapters.map((c) => `<option value="${c.id}" ${String(c.id) === STS.ch ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>` : ''}
        ${stDeptOn() ? dfSel("STS.proj='';showStats()") : ''}<select onchange="STS.proj=this.value;showStats()"><option value="">전체 사업</option>${projOpts.map((p) => `<option value="${p.key}" ${String(p.key) === STS.proj ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>
      <div class="kpis">${kpi('사업 수', fmt(new Set(rows.map((r) => r.project_id)).size))}${kpi('실시 횟수', fmt(t.cnt) + '회', rate === null ? '' : `계획 대비 ${rate}%`)}${kpi('연인원', fmt(t.tot) + '명')}${kpi('실인원', fmt(t.uniq) + '명')}
        ${kpi('회원 / 수강생 / 비회원', `${fmt(mem.length)} / ${fmt(stu.length)} / ${fmt(keys.length - mem.length - stu.length)}`, '연인원 기준 · 수강생은 수어교육관리 출석')}${kpi('두 번 이상 참여한 회원', fmt(Object.values(cntBy).filter((n) => n > 1).length) + '명')}</div>
      <div class="charts"><div class="card"><h3>분기별 연인원 (${STS.year}년)</h3>${bars([1, 2, 3, 4].map((x) => ({ label: x + '분기', value: summarize(yr.filter((r) => qOf(r.held_on) === x && (!STS.proj || String(r.project_id) === STS.proj))).tot })), '명')}</div>
        <div class="card"><h3>사업 분류별 연인원</h3>${bars(byK.map((k) => ({ label: k.name, value: k.tot })), '명')}</div></div>
      <h3>사업별</h3>${tbl('사업명', byP, true)}
      ${multi ? `<h3>지회별</h3>${tbl('지회', byC)}` : ''}
      <h3>사업 분류별</h3>${tbl('분류', byK)}
      <p class="muted">실인원은 회원은 회원별로, 회원명단에 없는 참여자는 한 줄을 한 사람으로 셉니다.${ME.can_review ? ' 도협회는 숫자만 보며, 지회의 참여자 명단은 보지 않습니다.' : ''}</p>`);
  } catch (e) { vview(VT, `<div class="note err">${esc(e.message)}</div>`); }
}
function statsCsv() { csv(`${STS.year}년_사업별_통계.csv`, (STS.byP || []).map((p) => ({ 사업명: p.name, 실시횟수: p.cnt, 계획횟수: p.plan, 달성률: p.rate === null ? '' : p.rate + '%', 연인원: p.tot, 실인원: p.uniq }))); }

// ===== 사업 분류 (도협회) =====
function showSettings() { vtok();
  if (!ME.can_review) { view(head('사업 분류') + '<div class="note warn">사업 분류는 도협회가 관리합니다.</div>'); return; }
  view(head('사업 분류', '모든 지회가 함께 쓰는 사업 분류입니다. 쓰는 사업이 있는 분류는 지울 수 없습니다.') +
    `<div class="card"><table><tbody>${ME.categories.map((c) => `<tr><td>${esc(c.name)}</td><td style="text-align:right"><button class="link" style="color:#c0392b" onclick="delCat(${c.id})">삭제</button></td></tr>`).join('') || '<tr><td class="muted">등록된 분류가 없습니다.</td></tr>'}</tbody></table>
      <div class="tools" style="margin-top:10px"><input id="catName" placeholder="새 분류 이름 (예: 교육·강좌)"><button class="main" onclick="addCat()">추가</button></div></div>
    <p class="muted">지회 목록은 통합 시스템의 지회 설정을, 직원·권한은 [직원·권한 관리]를 그대로 씁니다.</p>`);
}
async function addCat() { try { ME.categories = await rpc('perf_category_save', { p_name: $('catName').value }); showSettings(); flash('사업 분류를 추가했습니다.'); } catch (e) { flash(e.message, 'err'); } }
async function delCat(id) { if (!confirm('이 분류를 지울까요?')) return; try { ME.categories = await rpc('perf_category_delete', { p_id: id }); showSettings(); flash('사업 분류를 지웠습니다.'); } catch (e) { flash(e.message, 'err'); } }
</script>
</body>
</html>

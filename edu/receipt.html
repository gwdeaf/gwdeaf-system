<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>수강료 영수증</title>
<style>
:root { --pine:#1f4d3a; --pine-soft:#e6f0ea; --bg:#f4f7f5; --ink:#1b2b24; --muted:#5d6b64; --line:#d5ded9; --red:#b3261e; --red-soft:#fbe9e7; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
.wrap { max-width:480px; margin:0 auto; padding:0 16px 48px; }
header { background:var(--pine); color:#fff; padding:16px; }
header h1 { margin:0; font-size:20px; }
header p { margin:2px 0 0; font-size:14px; opacity:.9; }
.card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px; margin-top:14px; }
.sess { text-align:center; font-size:22px; font-weight:800; color:var(--pine); }
.sess small { display:block; font-size:14px; font-weight:400; color:var(--muted); }
label.f { display:block; font-weight:700; font-size:15px; margin:16px 0 4px; }
input { width:100%; padding:14px; border:1.5px solid var(--line); border-radius:10px; font:inherit; background:#fff; }
.btn { width:100%; margin-top:18px; border:0; background:var(--pine); color:#fff; padding:16px; border-radius:10px; font:inherit; font-weight:700; font-size:18px; cursor:pointer; }
.btn:disabled { opacity:.5; }
.hint { color:var(--muted); font-size:14px; }
.err { background:var(--red-soft); color:var(--red); border-radius:10px; padding:12px; margin-top:14px; font-size:15px; }
.center { text-align:center; padding:48px 20px; }
.ok { font-size:56px; }
.hp { position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
.rc { border:2px solid #222; padding:16px; margin-top:14px; background:#fff; }
.rc h2 { text-align:center; letter-spacing:.3em; margin:4px 0 0; font-size:24px; }
.rc .sub { text-align:center; margin:0 0 12px; font-size:14px; color:var(--muted); }
.rc table { width:100%; border-collapse:collapse; font-size:15px; }
.rc th, .rc td { border:1px solid #888; padding:8px; text-align:left; }
.rc th { background:#f1f1f1; width:32%; }
.rc .by { text-align:right; margin-top:14px; line-height:1.9; }
.rc .seal img { height:46px; vertical-align:middle; }
.btn.sec { background:#fff; color:var(--pine); border:1.5px solid var(--pine); }
.row { display:grid; grid-template-columns:1fr; gap:0; }
@media print { header, .noprint { display:none !important; } body { background:#fff; } .rc { border-width:2px; margin:0; } }
</style>
</head>
<body>
<div id="app"><div class="center hint">불러오는 중…</div></div>
<script>
const TOKEN = location.pathname.split('/').filter(Boolean).pop() || '';
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// 이 휴대폰(브라우저)을 구분하는 표시: 처음 한 번 만들어 저장해 둠
function deviceId() {
  const KEY = 'attendDevice';
  let v = '';
  try { v = localStorage.getItem(KEY) || ''; } catch (e) {}
  if (!v) { const m = document.cookie.match(/(?:^|; )attendDevice=([0-9a-zA-Z-]{16,64})/); if (m) v = m[1]; }
  if (!v) {
    v = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(16) + Math.random().toString(16).slice(2) + Math.random().toString(16).slice(2)).replace(/\./g, '').slice(0, 40);
  }
  try { localStorage.setItem(KEY, v); } catch (e) {}
  document.cookie = 'attendDevice=' + v + '; max-age=31536000; path=/; SameSite=Lax';
  return v;
}
async function api(fn, ...args) {
  let res;
  try { res = await (await fetch('/api/call', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fn: fn, args: [TOKEN, ...args] }) })).json(); }
  catch (e) { throw new Error('서버에 연결하지 못했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.'); }
  if (!res || !res.ok) { const e = new Error((res && res.error) || '처리하지 못했습니다.'); e.code = res && res.code; throw e; }
  return res.data;
}
function dead(msg) { $('#app').innerHTML = `<div class="center"><h2>열 수 없습니다</h2><p>${esc(msg)}</p></div>`; }
function won(n) { return (Number(n) || 0).toLocaleString('ko-KR') + '원'; }
function korMoney(n) {
  n = Math.floor(Number(n) || 0); if (!n) return '영';
  const d = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'], u = ['', '십', '백', '천'], big = ['', '만', '억', '조'];
  let out = '', g = 0;
  while (n > 0) { const part = n % 10000; n = Math.floor(n / 10000); let t = ''; for (let i = 0; i < 4; i++) { const x = Math.floor(part / Math.pow(10, i)) % 10; if (x) t = (x === 1 && i > 0 ? '' : d[x]) + u[i] + t; } if (t) out = t + big[g] + out; g++; }
  return out;
}
function kdate(s) { return String(s || '').replace(/^(\d{4})-(\d{2})-(\d{2})$/, (m, y, mo, d) => `${y}년 ${Number(mo)}월 ${Number(d)}일`); }
(async () => {
  let c;
  try { c = await api('payInfo'); } catch (e) { return dead(e.message); }
  const head = `<header><div class="wrap" style="padding:0"><h1>${esc(c.강좌명)}</h1><p>${esc(c.지회명)} · 수강료 영수증</p></div></header>`;
  $('#app').innerHTML = head + `<div class="wrap" id="w1"><div class="card">
    <p style="margin:0">수강료를 낸 분은 영수증(수강료 납입 확인서)을 받을 수 있습니다. 이름과 연락처 뒤 4자리를 넣어 주세요.</p>
    <form id="f" autocomplete="off">
      <label class="f" for="n">이름</label><input type="text" id="n" maxlength="30" required autocomplete="off">
      <label class="f" for="p">연락처 뒤 4자리</label><input type="tel" id="p" inputmode="numeric" maxlength="4" pattern="[0-9]*" placeholder="예: 5678" autocomplete="off">
      <p class="hint" style="margin:4px 0 0">명단에 연락처가 없는 분은 비워 두세요.</p>
      <div class="hp" aria-hidden="true"><label>웹사이트<input type="text" id="w" tabindex="-1" autocomplete="off"></label></div>
      <div id="e"></div><button class="btn" id="b">영수증 받기</button></form></div>
    <p class="hint" style="text-align:center">납부가 확인되지 않았다면 담당자에게 문의해 주세요.</p></div>`;
  $('#f').onsubmit = async ev => {
    ev.preventDefault();
    const b = $('#b'); b.disabled = true; $('#e').innerHTML = '';
    try {
      const r = await api('payReceipt', { 이름: $('#n').value, 뒤4자리: $('#p').value, 기기: deviceId(), website: $('#w').value });
      if (!r.done) { $('#e').innerHTML = `<div class="err">${esc(r.사유)}${r.남은횟수 != null ? `<br>(다시 시도할 수 있는 횟수: ${r.남은횟수}번)` : ''}</div>`; b.disabled = false; return; }
      const x = r.영수증, seal = x.직인 ? `<span class="seal"><img src="${esc(x.직인)}" alt="직인"></span>` : '(인)';
      $('#w1').innerHTML = `<div class="rc"><div style="text-align:right;font-size:13px">영수번호 ${esc(x.번호)}</div><h2>영 수 증</h2><p class="sub">수강료 납입 확인서</p>
        <table><tr><th>성 명</th><td>${esc(x.이름)}</td></tr><tr><th>강 좌</th><td>${esc(x.강좌명)}</td></tr><tr><th>교육 기간</th><td>${esc(x.시작일)} ~ ${esc(x.종료일)}</td></tr>
        <tr><th>납부 금액</th><td><b>일금 ${esc(korMoney(x.금액))}원정</b><br>(${won(x.금액)})</td></tr><tr><th>납부일 · 방법</th><td>${esc(x.납부일)} · ${esc(x.방법)}</td></tr></table>
        <p style="text-align:center;margin:14px 0 0">위 금액을 수강료로 정히 영수합니다.</p>
        <p class="by">${esc(kdate(x.발급일))}<br><b>${esc(x.지회명)}</b> ${seal}</p></div>
        <button class="btn noprint" onclick="window.print()">인쇄 / PDF로 저장</button>
        <p class="hint noprint" style="text-align:center">화면을 캡처해 두어도 됩니다.</p>`;
    } catch (e) {
      if (e.code === 'LINK') return dead(e.message);
      $('#e').innerHTML = `<div class="err">${esc(e.message)}</div>`; b.disabled = false;
    }
  };
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회원관리카드 · 회비납부증명서 출력</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --ink:#1b1b1b; --line:#1b1b1b; --soft:#f1f1ee; --mute:#6b6b66;
    --ui-bg:#e9e9e6; --accent:#2750c8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ui-bg);color:var(--ink);
    font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;font-size:14px}

  /* ---------- 화면용 컨트롤 ---------- */
  .toolbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #d4d4cf;
    display:flex;flex-wrap:wrap;gap:8px 20px;align-items:flex-end;padding:12px 20px}
  .toolbar .tabs{display:flex;gap:6px}
  .tab,.btn{font:inherit;border:1px solid #c9c9c4;background:#f6f6f3;padding:8px 14px;border-radius:6px;cursor:pointer}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}
  .field input{font:inherit;font-size:14px;color:var(--ink);padding:7px 9px;border:1px solid #c9c9c4;border-radius:6px;min-width:180px}
  .field.wide input{min-width:320px}
  .opts{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:flex-end;margin-left:auto}
  .opts[hidden]{display:none}

  /* ---------- A4 용지 ---------- */
  .stage{padding:24px 12px 60px;display:flex;justify-content:center;overflow-x:auto}
  .sheet{width:210mm;min-height:297mm;background:#fff;padding:16mm 15mm 14mm;
    box-shadow:0 2px 14px rgba(0,0,0,.18);display:none;position:relative;
    font-family:"Noto Serif KR","Batang","바탕",serif}
  .sheet.active{display:block}

  .doc-title{text-align:center;font-size:30px;font-weight:700;margin:0 0 14px}
  .doc-title.spaced{letter-spacing:.7em;padding-left:.7em}
  .meta{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}

  table.f{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
  table.f th,table.f td{border:1px solid var(--line);padding:7px 8px;height:34px;vertical-align:middle;word-break:keep-all}
  table.f th{background:var(--soft);font-weight:600;text-align:center}
  table.f td.c{text-align:center}
  table.f td.r{text-align:right;font-variant-numeric:tabular-nums}
  table.f + table.f{margin-top:-1px}
  .sec{margin:14px 0 6px;font-size:14px;font-weight:700}

  .photo{width:100%;height:100%;min-height:100px;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:12px}
  .photo img{max-width:100%;max-height:120px}
  .muted{color:#b4b4ae}
  .na{background:repeating-linear-gradient(135deg,#fff,#fff 5px,#f0f0ed 5px,#f0f0ed 6px)}

  .confirm-text{text-align:center;line-height:2.2;padding:36px 10px 24px;font-size:14px}
  .confirm-text .date{margin:26px 0;font-size:15px}
  .issuer{display:flex;justify-content:center;gap:18px;font-size:14px;margin-top:10px}
  .to{margin-top:22px;font-size:16px;font-weight:700;letter-spacing:.02em}
  .footer-org{position:absolute;right:15mm;bottom:12mm;font-size:12px}
  .check{display:inline-block;width:12px;height:12px;border:1px solid var(--line);margin-right:6px;vertical-align:-1px}
  .check.on::after{content:"✓";display:block;line-height:10px;font-size:11px;text-align:center}

  /* ---------- 인쇄 ---------- */
  @page{size:A4;margin:0}
  @media print{
    body{background:#fff}
    .toolbar{display:none}
    .stage{padding:0;display:block;overflow:visible}
    .sheet{box-shadow:none;margin:0;display:none}
    .sheet.active{display:block}
    .sheet{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
  @media (max-width:800px){.opts{margin-left:0}}
</style>
</head>
<body>

<!-- ===================== 컨트롤 ===================== -->
<div class="toolbar">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true"  data-doc="cert">회비납부증명서</button>
    <button class="tab" role="tab" aria-selected="false" data-doc="card">회원관리카드</button>
  </div>

  <!-- 증명서 전용 입력 -->
  <div class="opts" id="opts-cert">
    <label class="field">용도<input id="in-purpose" placeholder="예) 강원도협회 선거관리위원회 제출용"></label>
    <label class="field wide">제출처<input id="in-to" placeholder="예) 사)한국농아인협회강원도협회 선거관리위원회 위원장"></label>
    <label class="field">발급기관명<input id="in-org"></label>
    <label class="field">직책명<input id="in-role" placeholder="예) 지부장"></label>
    <label class="field">성명<input id="in-signer" placeholder="발급자 성명"></label>
  </div>
  <!-- 카드 전용 입력 -->
  <div class="opts" id="opts-card" hidden>
    <label class="field">장애등급<input id="in-grade" placeholder="예) 청각 2급"></label>
    <label class="field">한자 성명<input id="in-hanja"></label>
    <label class="field">사진<input id="in-photo" type="file" accept="image/*"></label>
  </div>

  <button class="btn primary" id="btn-print">인쇄 / PDF 저장</button>
</div>

<div class="stage">

<!-- ===================== 1. 회비납부증명서 ===================== -->
<section class="sheet active" id="doc-cert" aria-label="회비납부증명서">
  <h1 class="doc-title spaced">회비납부증명서</h1>
  <div class="meta"><span></span><span>발급번호 : <b id="c-no"></b></span></div>

  <table class="f">
    <colgroup><col style="width:17%"><col><col style="width:17%"><col></colgroup>
    <tr><th>성 명</th><td id="c-name"></td><th>생년월일</th><td id="c-birth"></td></tr>
    <tr><th>주 소</th><td colspan="3" id="c-addr"></td></tr>
  </table>

  <div class="sec">회비 납부 사실 (최근 5년)</div>
  <table class="f" id="c-years">
    <!-- JS 생성 -->
  </table>

  <table class="f" style="margin-top:14px">
    <colgroup><col style="width:34%"><col style="width:20%"><col style="width:14%"><col></colgroup>
    <tr><th>근거 자료</th><th>담당자 확인</th><th rowspan="5">용 도</th><td rowspan="5" class="c" id="c-purpose"></td></tr>
    <tr><td><span class="check on"></span>회원관리카드</td><td></td></tr>
    <tr><td><span class="check on"></span>회비징수대장</td><td></td></tr>
    <tr><td><span class="check on"></span>금전출납부</td><td></td></tr>
    <tr><td><span class="check on"></span>회비 입금 통장 사본</td><td></td></tr>
  </table>

  <table class="f" style="margin-top:14px">
    <tr><td>
      <div class="confirm-text">
        위와 같이 최근 <span id="c-span">5</span>년간의 회비 납부 사실을 확인함.
        <div class="date" id="c-date"></div>
        <div class="issuer">
          <span id="c-org"></span><img id="c-seal" alt="직인" style="display:none;width:58px;height:58px;object-fit:contain;margin:-18px -10px -18px -14px;vertical-align:middle">
          <span>(직책명) <span id="c-role" style="display:inline-block;min-width:70px;border-bottom:1px solid #999;text-align:center"></span></span>
          <span>(성명) <span id="c-signer" style="display:inline-block;min-width:70px;border-bottom:1px solid #999;text-align:center"></span></span>
          <span>(서명)</span>
        </div>
      </div>
    </td></tr>
  </table>

  <div class="to"><span id="c-to"></span> 귀하</div>
</section>

<!-- ===================== 2. 회원관리카드 ===================== -->
<section class="sheet" id="doc-card" aria-label="회원관리카드">
  <h1 class="doc-title">회원관리카드</h1>
  <div class="meta"><span>관리번호 : <b id="m-no"></b></span><span>작성일 : <b id="m-date"></b></span></div>

  <table class="f">
    <colgroup><col style="width:17%"><col style="width:15%"><col><col style="width:15%"><col style="width:22%"></colgroup>
    <tr>
      <td rowspan="5" class="c"><div class="photo" id="m-photo">사 진</div></td>
      <th rowspan="2">성 명</th>
      <td>(한글) <b id="m-name"></b></td>
      <th>장애등급</th><td id="m-grade"></td>
    </tr>
    <tr><td>(漢字) <span id="m-hanja"></span></td><th>성 별</th><td id="m-sex" class="c"></td></tr>
    <tr><th>생년월일</th><td colspan="3" id="m-birth"></td></tr>
    <tr><th>전화번호</th><td id="m-tel"></td><th>구 분</th><td id="m-type" class="c"></td></tr>
    <tr><th>상 태</th><td id="m-status"></td><th>탈퇴일</th><td id="m-leave"></td></tr>
    <tr><th colspan="2">현주소</th><td colspan="3" id="m-addr"></td></tr>
  </table>

  <table class="f" style="margin-top:-1px">
    <colgroup><col><col style="width:22%"></colgroup>
    <tr><th>주소 변경 사항</th><th>변경 일자</th></tr>
    <tr><td>&nbsp;</td><td></td></tr>
    <tr><td>&nbsp;</td><td></td></tr>
  </table>

  <div class="sec" style="margin-top:12px">최초가입일자 : <span id="m-join"></span> <span style="font-weight:400;color:var(--mute);margin-left:14px">비고 : <span id="m-memo"></span></span></div>

  <table class="f" id="m-fees">
    <!-- JS 생성 -->
  </table>

  <div class="footer-org" id="m-org"></div>
</section>

</div>

<script>
/* =========================================================
 * 1) 데이터  ─ 실제 시스템에서는 서버/DB 값으로 교체하세요.
 *    아래 형태의 객체 두 개만 넘기면 됩니다.
 * ========================================================= */
// 회원관리 화면이 이 창을 열면서 넘겨 준 자료 (member_doc_info 결과)
let SRC = null;
try { SRC = window.opener && window.opener.MEMBER_PRINT; } catch (e) { SRC = null; }
if (!SRC) { document.body.innerHTML = '<p style="padding:40px;text-align:center">회원관리 화면에서 [회비 납부 증명서] 또는 [회원관리카드] 버튼으로 열어 주세요.</p>'; throw new Error('no data'); }
const M = SRC.member || {};
const member = {
  no: M.member_no || "", name: M.name || "", birth: M.birth || "", sex: M.gender || "", tel: M.phone || "",
  addr: M.address || "", type: M.category || "", joinDate: M.join_date || "", status: M.status || "", leaveDate: M.leave_date || "", memo: M.note || ""
};
const payments = (SRC.fees || []).map(f => ({ date: String(f.paid_date || ""), kind: f.kind, year: f.year, amount: f.amount, method: f.method || "", memo: f.note || "", status: f.status }));
const ORG = SRC.org || {};
document.getElementById("in-org").value = ORG.name || "";
document.getElementById("in-signer").value = (SRC.issuer && SRC.issuer.name) || "";

/* =========================================================
 * 2) 유틸
 * ========================================================= */
const $ = id => document.getElementById(id);
const won = n => Number(n).toLocaleString("ko-KR") + "원";
const ymdK = d => { const m = String(d || "").match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[1]}. ${+m[2]}. ${+m[3]}` : String(d || ""); };
const todayStr = () => { if (SRC.today) return String(SRC.today).slice(0, 10); const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`; };
const setText = (id, v) => { $(id).textContent = v ?? ""; };

/** 해당 연도의 유효(납부 상태, 취소 아님) 회비 기록 */
function feeOfYear(y){
  return payments
    .filter(p => p.kind === "회비" && p.status === "납부" && Number(p.year) === y)
    .sort((a,b) => a.date.localeCompare(b.date));
}

/* =========================================================
 * 3) 회비납부증명서
 * ========================================================= */
function renderCert(){
  const thisYear = +todayStr().slice(0, 4), N = 5;
  const years = Array.from({length:N}, (_,i) => thisYear - N + 1 + i);
  const issued = todayStr();

  // 발급번호: 연도-회원번호 (필요 시 서버 채번 값으로 교체)
  setText("c-no", `${thisYear}-${member.no}`);
  setText("c-name", member.name);
  setText("c-birth", ymdK(member.birth));
  setText("c-addr", member.addr);
  setText("c-purpose", $("in-purpose").value);
  setText("c-to", $("in-to").value);
  setText("c-org", $("in-org").value);
  if (ORG.seal) { $("c-seal").src = ORG.seal; $("c-seal").style.display = "inline-block"; }
  setText("c-role", $("in-role").value);
  setText("c-signer", $("in-signer").value);
  setText("c-span", N);
  setText("c-date", `${issued.slice(0,4)}년 ${+issued.slice(5,7)}월 ${+issued.slice(8,10)}일`);

  const joinYear = +String(member.joinDate).slice(0,4) || 0;
  const cell = (y, fn) => {
    if (y < joinYear) return `<td class="c na">해당없음</td>`;
    const f = feeOfYear(y);
    return f.length ? `<td class="c">${fn(f)}</td>` : `<td class="c muted">미납</td>`;
  };

  $("c-years").innerHTML = `
    <colgroup><col style="width:17%">${years.map(()=>`<col>`).join("")}</colgroup>
    <tr><th>년 도</th>${years.map(y=>`<th>${y}</th>`).join("")}</tr>
    <tr><th>납입년월일</th>${years.map(y=>cell(y, f=>f.map(p=>ymdK(p.date)).join("<br>"))).join("")}</tr>
    <tr><th>금 액</th>${years.map(y=>cell(y, f=>won(f.reduce((s,p)=>s+Number(p.amount),0)))).join("")}</tr>`;
}

/* =========================================================
 * 4) 회원관리카드
 * ========================================================= */
function renderCard(){
  const thisYear = +todayStr().slice(0, 4);
  const joinYear = +String(member.joinDate).slice(0,4) || 0;
  const ROWS = 10;
  const years = Array.from({length:ROWS}, (_,i) => thisYear - ROWS + 1 + i);

  setText("m-no", member.no);
  setText("m-date", todayStr().replace(/-/g,". "));
  setText("m-name", member.name);
  setText("m-hanja", $("in-hanja").value);
  setText("m-grade", $("in-grade").value);
  setText("m-sex", member.sex);
  setText("m-birth", ymdK(member.birth));
  setText("m-tel", member.tel);
  setText("m-type", member.type);
  setText("m-status", member.status);
  setText("m-leave", member.leaveDate ? ymdK(member.leaveDate) : "");
  setText("m-addr", member.addr);
  setText("m-join", ymdK(member.joinDate));
  setText("m-memo", member.memo);
  setText("m-org", $("in-org").value);

  const rows = years.map(y => {
    if (y < joinYear) return `<tr><th>${y}년</th><td class="na"></td><td class="na"></td><td class="na"></td><td class="na"></td></tr>`;
    const f = feeOfYear(y);
    const date = f.map(p => ymdK(p.date)).join("<br>");
    const amt  = f.map(p => won(p.amount)).join("<br>");
    const note = f.map(p => [p.method,p.memo].filter(Boolean).join(" ")).join("<br>");
    return `<tr><th>${y}년</th><td class="c">${date}</td><td class="r">${amt}</td><td></td><td class="c">${note}</td></tr>`;
  }).join("");

  $("m-fees").innerHTML = `
    <colgroup><col style="width:14%"><col style="width:22%"><col style="width:22%"><col style="width:18%"><col></colgroup>
    <tr><th colspan="5" style="font-size:15px">회 비 현 황</th></tr>
    <tr><th>구분 / 년도</th><th>납일날짜</th><th>회비금액</th><th>확인날인</th><th>비고</th></tr>
    ${rows}`;
}

/* 사진 미리보기 */
$("in-photo").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = document.createElement("img");
    img.src = reader.result; img.alt = "회원 사진";
    $("m-photo").replaceChildren(img);
  };
  reader.readAsDataURL(file);
});

/* =========================================================
 * 5) 탭 / 인쇄
 * ========================================================= */
function show(doc){
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.doc === doc));
  $("doc-cert").classList.toggle("active", doc === "cert");
  $("doc-card").classList.toggle("active", doc === "card");
  $("opts-cert").hidden = doc !== "cert";
  $("opts-card").hidden = doc !== "card";
  render();
}
function render(){ renderCert(); renderCard(); }

document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => show(t.dataset.doc)));
document.querySelectorAll(".toolbar input").forEach(i => i.addEventListener("input", render));
$("btn-print").addEventListener("click", () => window.print());
document.title = (new URLSearchParams(location.search).get("doc") === "card" ? "회원관리카드" : "회비납부증명서") + " - " + member.name;

/* URL 파라미터로 바로 열기: member_print.html?doc=card */
show(new URLSearchParams(location.search).get("doc") === "card" ? "card" : "cert");
</script>
</body>
</html>

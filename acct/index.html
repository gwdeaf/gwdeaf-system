<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회계시스템</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

  body { font-family: 'Malgun Gothic', sans-serif; margin: 0; background: #f5f7fa; font-size: 16px; color: #222; }
  header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; background: #2f5bd6; color: #fff; padding: 12px 16px; }
  header h1 { font-size: 18px; margin: 0 0 4px; }
  #who { font-size: 13px; opacity: .9; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px; background: #fff; border-bottom: 1px solid #ddd; }
  button { font-size: 15px; padding: 10px 14px; border: 0; border-radius: 6px; background: #2f5bd6; color: #fff; cursor: pointer; }
  button.sub { background: #e6e9ef; color: #222; }
  button.danger { background: #c0392b; }
  main { padding: 12px 16px; }
  .card { background: #fff; border-radius: 8px; padding: 12px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.08); cursor: pointer; }
  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #e6e9ef; }
  .badge.ok { background: #d4efdf; }
  .badge.cancel { background: #f5b7b1; }
  label { display: block; margin-top: 10px; font-weight: bold; font-size: 14px; }
  input, select, textarea { width: 100%; box-sizing: border-box; font-size: 16px; padding: 10px; margin-top: 4px; border: 1px solid #bbb; border-radius: 6px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px dotted #ddd; }
  .row span:first-child { color: #666; white-space: nowrap; }
  .msg { padding: 10px; border-radius: 6px; margin: 10px 0; display: none; }
  .msg.err { background: #fdecea; color: #922; display: block; }
  .msg.ok { background: #e9f7ef; color: #1e6b3b; display: block; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

  body.embed header, body.embed #logoutBtn { display: none; }
  #printArea { display: none; }
  .binfo { background:#f1f5ff; border-radius:6px; padding:8px 10px; margin-top:6px; font-size:14px; color:#334; }
  .binfo.warn { background:#fff4e0; color:#8a4b00; }
  .sged { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:4px; }
  .sged .sgc { display:inline-flex; align-items:center; border:1px solid #ccd; border-radius:8px; background:#fff; overflow:hidden; }
  .sged .sgc input { width:86px; border:0; margin:0; padding:7px 8px; text-align:center; }
  .sged .sgc button, .sged > button { margin:0; padding:6px 10px; min-width:0; }
  .pdoc { font-family:'Batang','바탕',serif; color:#000; }
  .pdoc h1 { text-align:center; font-size:26px; letter-spacing:8px; margin:0 0 6mm; }
  .pdoc table { width:100%; border-collapse:collapse; font-size:13.5px; }
  .pdoc td, .pdoc th { border:1px solid #000; padding:6px 8px; vertical-align:middle; }
  .pdoc th { background:#f2f2f2; width:22%; font-weight:normal; }
  .pdoc .sign { width:auto; margin-left:auto; margin-bottom:6mm; }
  .pdoc .sign td, .pdoc .sign th { width:22mm; text-align:center; background:#fff; }
  .pdoc .sign td { height:18mm; }
  .pdoc .meta { display:flex; justify-content:space-between; font-size:13px; margin-bottom:3mm; }
  .pdoc .foot { text-align:center; font-size:18px; font-weight:bold; margin-top:10mm; }
  @page { size: A4; margin: 15mm; }
  @media print { body > *:not(#printArea) { display:none !important; } #printArea { display:block !important; } body { background:#fff; } }
  @media (max-width: 640px) { nav button { flex: 1 1 auto; } main { padding: 10px; } table { font-size: 12px; } }
</style>
<link rel="stylesheet" href="/ui.css?v=1">
</head>
<body>
<header>
  <div><h1 style="margin:0">회계시스템</h1><div id="who">불러오는 중…</div></div>
</header>
<nav id="topNav" style="display:none" onclick="if(event.target.closest('button')&&event.target.closest('button').id!=='logoutBtn'){this.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===event.target.closest('button')))}">
  <button class="on" onclick="showList()">품의 목록</button>
  <button id="btnNew" onclick="showForm()">품의 작성</button>
  <button onclick="showResList()">결의 목록</button>
  <button id="btnNewRes" onclick="showResForm()">결의 작성</button>
  <button onclick="showLedger()">출납부</button>
  <button onclick="showGL()">원장</button>
  <button onclick="showBank()">통장 내역</button>
  <button onclick="showStatus()">집행 현황</button>
  <button onclick="showSearch()">검색</button>
  <button id="btnSet" class="sub" onclick="showSettings()" style="display:none">설정</button>
  <button id="logoutBtn" class="sub" onclick="logout()">로그아웃</button>
</nav>
<main>
  <div id="msg" class="msg"></div>
  <div id="view"></div>
</main>
<div id="printArea"></div>
<script>
// 기관 전체 이름: 지회는 '강원특별자치도농아인협회○○지회'(띄어쓰기 없이), 도협회는 협회 이름, 센터 등은 그 이름 그대로
function fullOrg(n) { n = String(n || '').trim(); if (!n || n === '도협회') return '강원특별자치도농아인협회'; return /지회$/.test(n) && n.indexOf('농아인협회') < 0 ? '강원특별자치도농아인협회' + n : n; }

const SUPABASE_URL = 'https://uamlualqqcqmpdkprjfs.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhbWx1YWxxcWNxbXBka3ByamZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwNjE0OTMsImV4cCI6MjExMDYzNzQ5M30._f4p4pfcKaYbmjKRXOPpkMo7Ydcc26oVVI6lRFYsLkY';
const EMBED = new URLSearchParams(location.search).get('embed') === '1';
if (EMBED) document.body.classList.add('embed');
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
// ===== 공통 =====
let OPTS = null;   // 로그인 사용자, 회계연도, 목·자금원천 목록
let ME = null;
let RES = null;    // 결의 입력 선택지 (품의, 통장, 목, 자금원천)

// 서버(DB) 함수 연결: 화면에서 쓰는 이름 → Supabase 함수
const FN = {
  getFormOptions: () => ['acct_options', {}],
  listProposals: (y) => ['acct_prop_list', { p_year: y ? Number(y) : null }],
  getProposal: (no) => ['acct_prop_get', { p_no: no }],
  saveProposal: (d) => ['acct_prop_save', { p: d }],
  approveProposal: (no) => ['acct_prop_approve', { p_no: no }],
  cancelProposal: (no, r) => ['acct_prop_cancel', { p_no: no, p_reason: r }],
  getResolutionOptions: () => ['acct_res_options', {}],
  listResolutions: (y) => ['acct_res_list', { p_year: y ? Number(y) : null }],
  getResolution: (no) => ['acct_res_get', { p_no: no }],
  saveResolution: (d) => ['acct_res_save', { p: d }],
  approveResolution: (no) => ['acct_res_approve', { p_no: no }],
  cancelResolution: (no, r) => ['acct_res_cancel', { p_no: no, p_reason: r }],
  getLedger: (y, m) => ['acct_ledger', { p_year: y ? Number(y) : null, p_month: m ? Number(m) : null }],
  getAccountBalances: (y) => ['acct_balances', { p_year: y ? Number(y) : null }],
  createCarryOver: (y) => ['acct_carry', { p_from: Number(y) }],
  searchDocs: (p) => ['acct_search', { p: p }],
  getManage: () => ['acct_manage_get', {}],
  setYear: (y) => ['acct_year_set', { p_year: Number(y) }],
  saveCode: (k, c, n, u) => ['acct_code_save', { p_kind: k, p_code: c, p_name: n, p_use: u }],
  saveAccount: (i, b, n, h, u) => ['acct_account_save', { p_id: i, p_bank: b, p_number: n, p_holder: h, p_use: u }],
  budgetStatus: (y) => ['acct_budget_status', { p_year: y ? Number(y) : null }],
  saveBudget: (y, c, a) => ['acct_budget_save', { p_year: Number(y), p_src: c, p_amt: Number(a) }],
  check: (p) => ['acct_check', { p: p }],
  printCfg: () => ['acct_print_cfg', {}],
  saveSignline: (t) => ['acct_signline_save', { p_text: t }],
  docSign: (k, no, t) => ['acct_doc_sign', { p_kind: k, p_no: no, p_text: t }],
  bizList: (y) => ['acct_biz_list', { p_year: y ? Number(y) : null }],
  bizSave: (d) => ['acct_biz_save', { p: d }],
  bizCopy: (id, y) => ['acct_biz_copy', { p_biz: id, p_year: Number(y) }],
  itemsGet: (id) => ['acct_bitems_get', { p_biz: id }],
  itemSave: (d) => ['acct_bitem_save', { p: d }],
  itemDel: (id) => ['acct_bitem_delete', { p_id: id }],
  itemsBulk: (id, rows) => ['acct_bitems_bulk', { p_biz: id, p_rows: rows }],
  changes: (id) => ['acct_bchanges_get', { p_biz: id }],
  pickList: (y) => ['acct_bpick_list', { p_year: y ? Number(y) : null }],
  itemDocs: (id) => ['acct_bitem_docs', { p_id: id }],
  bcheck: (i, a, d, n) => ['acct_bcheck', { p_item: Number(i), p_amt: Number(String(a).replace(/[^0-9]/g, '')) || 0, p_doc: d, p_no: n || '' }],
  filesList: (d, n) => ['acct_files_list', { p_doc: d, p_no: n }],
  fileAdd: (d, n, k, path, name, size) => ['acct_file_add', { p_doc: d, p_no: n, p_kind: k, p_path: path, p_name: name, p_size: size }],
  fileDel: (id) => ['acct_file_del', { p_id: id }],
  filesCount: (d) => ['acct_files_count', { p_doc: d }]
};
async function api(fn, ...args) {
  const [name, a] = FN[fn](...args);
  const { data, error } = await sb.rpc(name, a);
  if (error) throw new Error(error.message || '오류가 났습니다.');
  return data;
}

const $ = id => document.getElementById(id);

// 화면 순서 지키기: 메뉴를 빨리 바꿔 누르면, 늦게 도착한 이전 화면이 지금 화면을 덮어쓰지 않게 함
let VTK = 0; function vtok() { return ++VTK; } function vw(t) { return t === VTK ? $('view') : document.createElement('div'); }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const won = n => Number(n || 0).toLocaleString('ko-KR') + '원';
// 결의 '결재완료' = 작성 즉시 확정 (결재완료 표시 없음, 종이로 수기 결재)
const badge = s => `<span class="badge ${s === '결재완료' ? 'ok' : (s === '취소' ? 'cancel' : '')}">${esc(s === '결재완료' ? '확정' : s)}</span>`;

function msg(text, type) {
  const m = $('msg');
  m.textContent = text || '';
  m.className = 'msg ' + (type || '');
  if (text) window.scrollTo(0, 0);
}

// 목·자금원천 코드를 '이름 (코드)'로 보여 줌
function nameOf(kind, code) {
  if (kind === '목' && String(code || '').startsWith('B#')) { const b = (OPTS['예산목'] || []).find(x => x['코드'] === code); return b ? b['이름'] : '예산 과목'; }
  const c = (OPTS[kind] || []).find(x => x['코드'] === code);
  return c ? `${c['이름']} (${code})` : (code || '');
}

function optHtml(list, cur) {
  return list.map(c => `<option value="${esc(c['코드'])}" ${c['코드'] === cur ? 'selected' : ''}>${esc(c['이름'])} (${esc(c['코드'])})</option>`).join('');
}

function monthOpts(cur) {
  let h = '<option value="">전체</option>';
  for (let m = 1; m <= 12; m++) {
    h += `<option value="${m}" ${String(m) === String(cur) ? 'selected' : ''}>${m}월</option>`;
  }
  return h;
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

async function loginGoogle() {
  const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname, queryParams: { hd: 'gwdeaf.or.kr', prompt: 'select_account' } } });
  if (error) alert(error.message);
}
async function logout() { await sb.auth.signOut(); location.href = location.origin + location.pathname; }
async function init() { const VT = vtok();
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    $('topNav').style.display = 'none';
    vw(VT).innerHTML = '<div class="card" style="cursor:default"><h2>로그인</h2><p>업무용 구글 계정(@gwdeaf.or.kr)으로 로그인하세요.</p><button onclick="loginGoogle()">구글 계정으로 로그인</button></div>';
    return;
  }
  try {
    OPTS = await api('getFormOptions');
    ME = OPTS.user;
    $('who').textContent = `${ME.chapter_name} · ${ME.name || ME.email} · ${OPTS.year}회계연도`;
    $('btnNew').style.display = ME.can_write ? '' : 'none'; $('btnNewRes').style.display = ME.can_write ? '' : 'none'; $('btnSet').style.display = ME.can_manage ? '' : 'none';
    $('topNav').style.display = 'flex';
    if (SUB.go) subGo(SUB.go); else showList();
    subReady();
  } catch (e) {
    $('topNav').style.display = 'none';
    $('who').textContent = '';
    vw(VT).innerHTML = `<div class="card" style="cursor:default"><h2>사용할 수 없습니다</h2><p>${esc(e.message)}</p><button class="sub" onclick="logout()">다른 계정으로 로그인</button></div>`;
  }
}
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_IN' && !ME) init(); });
// ===== 하위 메뉴 (업무 시스템 왼쪽 메뉴에서 이동) =====
const SUB = { go: new URLSearchParams(location.search).get('go') || '', ready: false };
function subTell(t) { if (EMBED && window.parent !== window) try { window.parent.postMessage({ type: 'sub-tab', tab: t }, location.origin); } catch (e) {} }
function subReady() { SUB.ready = true; if (EMBED && window.parent !== window) try { window.parent.postMessage({ type: 'sub-ready', tab: SUB.go }, location.origin); } catch (e) {} }
window.addEventListener('message', (e) => {
  if (e.origin !== location.origin || !e.data || e.data.type !== 'sub-go') return;
  SUB.go = e.data.tab; if (SUB.ready) subGo(SUB.go);
});
const SUB_FN = { prop: () => showList(), res: () => showResList(), cash: () => showLedger(), ledger: () => showGL(), bank: () => showBank(), budget: () => showBudgetEdit(), status: () => showStatus() };
function subGo(t) { (SUB_FN[t] || SUB_FN.prop)(); }


// ===== 4단계: 품의 =====
async function showList() { const VT = vtok();
  msg(''); subTell('prop');
  vw(VT).innerHTML = '<p>불러오는 중…</p>';
  try {
    const list = await api('listProposals', OPTS.year);
    if (!list.length) { vw(VT).innerHTML = '<p>등록된 품의가 없습니다.</p>'; return; }
    let FC = {}; if (EVIDENCE) try { FC = await api('filesCount', '품의'); } catch (e) {}
    vw(VT).innerHTML = list.map(p => `
      <div class="card" onclick="showDetail('${esc(p['품의번호'])}')">
        <div><b>${esc(p['품의번호'])}</b> ${badge(p['상태'])}${FC[p['품의번호']] ? ` <span class="badge">📎 ${FC[p['품의번호']]}</span>` : ''}</div>
        <div style="margin:4px 0">${esc(p['사업명'])}</div>
        <div style="color:#555;font-size:14px">${won(p['금액'])} · ${esc(p['거래처'])}</div>
      </div>`).join('');
  } catch (e) {
    vw(VT).innerHTML = `<p>${esc(e.message)}</p>`;
  }
}

async function showDetail(no) { const VT = vtok();
  try {
    const p = await api('getProposal', no);
    const mine = p['작성자'] === ME.email;
    let btns = '';
    if (p['상태'] === '작성' && mine) btns += `<button onclick="showForm('${esc(no)}')">수정</button>`;
    if (p['상태'] !== '취소' && ME.can_write) btns += `<button onclick="showResForm('', '지출', '${esc(no)}')">이 품의로 결의 쓰기</button>`;
    if (p['상태'] !== '취소') btns += `<button class="sub" onclick="printProp('${esc(no)}')">🖨 품의서 인쇄</button>`;
    if (mine && p['상태'] !== '취소') btns += `<button class="danger" onclick="showCancel('${esc(no)}')">취소</button>`;
    btns += `<button class="sub" onclick="showList()">목록</button>`;

    const rows = [
      ['회계연도', p['회계연도']],
      ['작성일', p['작성일']],
      ['작성자', p['작성자']],
      ['사업명', p['사업명']],
      ['사업기간', `${p['사업시작일']} ~ ${p['사업종료일']}`],
      [p['예산항목'] ? '예산 과목' : '목(계정)', nameOf('목', p['목코드'])],
      ['자금원천', nameOf('자금원천', p['자금원천코드'])],
      ['금액', won(p['금액'])],
      ['거래처', p['거래처']],
      ['첨부목록', p['첨부목록']],
      ['산출근거', p['산출근거']],
      ['결재자', p['결재자']],
      ['결재일', p['결재일']]
    ];
    if (p['상태'] === '취소') rows.push(['취소사유', p['취소사유']], ['취소일시', p['취소일시']]);

    vw(VT).innerHTML = `<h2>${esc(no)} ${badge(p['상태'])}</h2>` +
      rows.map(([k, v]) => `<div class="row"><span>${esc(k)}</span><span style="text-align:right">${esc(v)}</span></div>`).join('') +
      `<div class="actions">${btns}</div><div id="evid"></div>`;
    loadEvid('품의', no);
  } catch (e) {
    msg(e.message, 'err');
  }
}


function showCancel(no) {
  if ($('cancelBox')) return;
  $('view').insertAdjacentHTML('beforeend',
    `<div id="cancelBox" class="card" style="cursor:default">
       <label>취소 사유 (필수)</label>
       <textarea id="cReason" rows="2"></textarea>
       <div class="actions"><button class="danger" onclick="cancelDoc('${esc(no)}')">취소 확정</button></div>
     </div>`);
}

async function cancelDoc(no) {
  try {
    await api('cancelProposal', no, $('cReason').value);
    await showDetail(no);
    msg('품의를 취소했습니다. 기록은 남아 있습니다.', 'ok');
  } catch (e) {
    msg(e.message, 'err');
  }
}

async function showForm(no) { const VT = vtok();
  msg('');
  let p = {};
  if (no) {
    try { p = await api('getProposal', no); } catch (e) { msg(e.message, 'err'); return; }
  }
  const back = no ? `showDetail('${esc(no)}')` : 'showList()';
  let cfg = {}; try { cfg = await printCfg(); } catch (e) {}

  await loadPick();
  vw(VT).innerHTML = `
    <h2>${no ? '품의 수정 ' + esc(no) : '품의 작성'}</h2>
    <input type="hidden" id="f_no" value="${esc(no || '')}">
    <label>사업명</label>
    <input id="f_name" value="${esc(p['사업명'] || '')}">
    <label>사업 시작일</label>
    <input type="date" id="f_start" value="${esc(p['사업시작일'] || '')}">
    <label>사업 종료일</label>
    <input type="date" id="f_end" value="${esc(p['사업종료일'] || '')}">
    ${itemPicker('f_item', '세출', p['예산항목'], 'pickItem()')}
    <div id="f_oldbox">
    <label>목(계정과목)</label>

let BUD = null;
async function loadBudget() { BUD = await api('budgetStatus', OPTS.year); return BUD; }
function budLine(b) {
  if (!b) return '';
  if (!b['예산설정']) return `<div class="binfo">[${esc(b['이름'])}] 예산이 정해지지 않았습니다. (설정 → 재원별 예산)</div>`;
  const left = b['예산액'] - b['집행액'];
  return `<div class="binfo ${left < 0 ? 'warn' : ''}">[${esc(b['이름'])}] 예산 ${won(b['예산액'])} · 품의 ${won(b['품의액'])} · 집행 ${won(b['집행액'])}${b['대기액'] ? ' (결재 대기 ' + won(b['대기액']) + ')' : ''} · <b>남은 예산 ${won(left)}</b></div>`;
}
async function propBudgetInfo() {
  const box = $('f_binfo'); if (!box) return;
  const c = $('f_src').value; if (!c) { box.innerHTML = ''; return; }
  try { await loadBudget(); box.innerHTML = budLine(BUD.find(x => x['코드'] === c)); } catch (e) { box.innerHTML = ''; }
}
async function warnOk(p) {
  try { const w = await api('check', p); return !w.length || confirm('⚠️ 확인해 주세요\n\n' + w.join('\n') + '\n\n그래도 저장할까요?'); }
  catch (e) { return true; }
}

async function save() {
  const data = {
    품의번호: $('f_no').value,
    사업명: $('f_name').value.trim(),
    사업시작일: $('f_start').value,
    사업종료일: $('f_end').value,
    예산항목: ($('f_item') && $('f_item').value) || '',
    목코드: $('f_mok').value,
    자금원천코드: $('f_src').value,
    금액: $('f_amt').value,
    거래처: $('f_vendor').value.trim(),
    첨부목록: $('f_attach').value.trim(),
    산출근거: $('f_basis').value.trim()
  };
  if (!data.품의번호) delete data.품의번호;
  if (data.예산항목) { if (!(await itemWarnOk(data.예산항목, data.금액, '품의', data.품의번호))) return; }
  else if (!(await warnOk({ 문서: '품의', 문서번호: data.품의번호 || '', 자금원천코드: data.자금원천코드, 금액: data.금액 }))) return;
  try {
    const no = await api('saveProposal', data);
    await saveSign2('품의', no);
    await showDetail(no);
    msg('저장되었습니다. 품의번호: ' + no + ' — 🖨 품의서 인쇄로 출력하세요. 결의를 쓸 때 이 품의를 고를 수 있습니다.', 'ok');
  } catch (e) {
    msg(e.message, 'err');
  }
}

function resSrc() {

async function saveRes() {
  const kind = $('r_kind').value;
  const data = {
    결의번호: $('r_no').value,
    결의구분: kind,
    날짜: $('r_date').value,
    통장id: $('r_acc').value,
    적요: $('r_memo').value,
    금액: $('r_amt').value,
    거래처: $('r_vendor').value.trim(),
    품의번호: kind === '지출' ? $('r_proposal').value : '',
    예산항목: kind === '수입' && $('r_item') ? $('r_item').value : '',
    목코드: kind === '수입' ? $('r_mok').value : '',
    자금원천코드: kind === '수입' ? $('r_src').value : ''
  };
  if (!data.결의번호) delete data.결의번호;
  const pItem = kind === '지출' ? ((RES.품의 || []).find(x => x['품의번호'] === data.품의번호) || {})['예산항목'] : null;
  if (pItem && !(await itemWarnOk(pItem, data.금액, '결의', data.결의번호))) return;
  if (!data.예산항목 && !(await warnOk({ 문서: '결의', 문서번호: data.결의번호 || '', 결의구분: kind, 품의번호: data.품의번호, 자금원천코드: data.자금원천코드, 통장id: data.통장id, 금액: data.금액 }))) return;
  try {
    const src = resSrc();
    const no = await api('saveResolution', data);
    await saveSign2('결의', no);
    await showResDetail(no);
    msg('저장되었습니다. 결의번호: ' + no + ' — 출납부·잔고·예산에 바로 반영되었습니다. 인쇄해서 수기로 결재받으세요.', 'ok');
    try { await loadBudget(); const b = BUD.find(x => x['코드'] === src); if (b) $('view').insertAdjacentHTML('afterbegin', '<b>재원별 예산 현황</b>' + budLine(b)); } catch (e) {}
  } catch (e) {
    msg(e.message, 'err');
  }
}

async function showGL(mok) { const VT = vtok();
  msg(''); subTell('ledger');
  mok = mok || '';
  try {
    await loadRes();
    const rows = await api('getLedger', OPTS.year, null);
    const mokName = code => { const c = (RES.목 || []).find(x => x['코드'] === code) || (OPTS['목'] || []).find(x => x['코드'] === code); return c ? `${c['이름']} (${code})` : (code || '(목 정보 없음)'); };
    const by = {};
    rows.forEach(r => { const k = r['목코드'] || ''; const o = by[k] || (by[k] = { 수입: 0, 지출: 0, 건수: 0 }); o.수입 += Number(r['수입금액']) || 0; o.지출 += Number(r['지출금액']) || 0; o.건수++; });
    const keys = Object.keys(by).sort();
    const TD = 'padding:6px 4px;border-bottom:1px solid #ddd;font-size:13px;';
    const TH = 'text-align:left;font-size:13px;padding:6px 4px;border-bottom:2px solid #999;';
    const noMok = rows.length && rows.every(r => r['목코드'] === undefined);
    const sum = keys.map(k => `<tr style="cursor:pointer" onclick="showGL('${esc(k)}')">

// 하위 합계 계산
function rollup(items) {
  const by = {}; items.forEach(i => { i.kids = []; by[i.id] = i; });
  const roots = []; items.forEach(i => (i.parent_id && by[i.parent_id] ? by[i.parent_id].kids : roots).push(i));
  const sum = (i) => { if (!i.kids.length) { i.t예산 = +i['예산액']; i.t품의 = +i['품의액']; i.t집행 = +i['집행액']; return; }
    i.t예산 = i.t품의 = i.t집행 = 0; i.kids.forEach(k => { sum(k); i.t예산 += k.t예산; i.t품의 += k.t품의; i.t집행 += k.t집행; }); };
  roots.forEach(sum);
  return roots;
}
function flat(nodes, out) { nodes.forEach(n => { out.push(n); flat(n.kids, out); }); return out; }

        <td style="${T};text-align:right;white-space:nowrap">${i.leaf && W ? `<input type="number" min="0" id="am_${i.id}" value="${i['예산액']}" style="width:140px;margin:0;padding:6px;text-align:right" onchange="saveAmt(${i.id},${i['예산액']})">` : `<b>${won(i.t예산)}</b>`}</td>

      return `<div class="card" style="cursor:default"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px"><b>${gb} · 합계 ${won(tot)}</b>${W ? `<button class="sub" onclick="addItem('${gb}',null)">+ ${gb} 관 추가</button>` : ''}</div>

      <button id="ev_btn" onclick="upEvid()">올리기</button></div>
      <div style="color:#777;font-size:13px;margin-top:4px">휴대폰에서는 파일 고르기에서 바로 사진을 찍어 올릴 수 있어요. 파일 하나 20MB까지.</div>` : ''}</div>`;

async function upEvid() {
  const files = [...$('ev_files').files]; if (!files.length) return msg('올릴 파일을 고르세요.', 'err');
  const big = files.find(f => f.size > 20 * 1024 * 1024); if (big) return msg(big.name + ' 파일이 20MB보다 커요.', 'err');
  $('ev_btn').disabled = true; msg('올리는 중입니다…', 'ok');
  try {
    for (const f of files) {
      const ext = (f.name.match(/\.([A-Za-z0-9]{1,8})$/) || [, 'bin'])[1].toLowerCase();
      const path = `${ME.chapter_id}/${OPTS.year}/${crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2)}.${ext}`;
      const { error } = await sb.storage.from('acct-files').upload(path, f, { contentType: f.type || 'application/octet-stream' });
      if (error) throw new Error(f.name + ' 올리기 실패: ' + (error.message || ''));
      try { await api('fileAdd', EV.doc, EV.no, $('ev_kind').value, path, f.name, f.size); }
      catch (e) { sb.storage.from('acct-files').remove([path]).catch(() => {}); throw e; }
    }
    msg(files.length + '개를 올렸습니다.', 'ok');
  } catch (e) { msg(e.message, 'err'); }
  await loadEvid(EV.doc, EV.no);
}
async function openEvid(i) {
  const f = EV.list[i]; const w = window.open('', '_blank');
  const { data, error } = await sb.storage.from('acct-files').createSignedUrl(f.path, 600);
  if (error) { if (w) w.close(); return msg('파일을 열 수 없습니다: ' + (error.message || ''), 'err'); }
  if (w) w.location = data.signedUrl; else location.href = data.signedUrl;
}
async function delEvid(i) {
  const f = EV.list[i]; if (!confirm(f.name + ' 을(를) 지울까요?')) return;

}

      <div class="card" style="cursor:default"><b>자금원천</b>${codeRows('자금원천')}
        <div style="display:flex;gap:8px;margin-top:8px"><input id="st_fc" placeholder="코드 (예: F01)" style="max-width:130px"><input id="st_fn" placeholder="이름 (예: 보조금)"><button onclick="addCode('자금원천','st_fc','st_fn')">추가</button></div></div>
      <div class="card" style="cursor:default"><b>재원별 예산 (${esc(d.year)}회계연도)</b>
        <div style="color:#777;font-size:13px;margin-top:4px">재원(자금원천)마다 올해 예산액을 정하면, 품의·결의를 쓸 때 남은 예산이 보이고 넘으면 경고합니다.</div>${budRows}</div>
      <div class="card" style="cursor:default"><b>기본 결재칸</b> <span style="color:#777;font-size:13px">(품의서·결의서를 쓸 때 문서마다 바꿀 수 있어요)</span>
        <div style="display:flex;gap:8px;margin-top:6px"><input id="st_sign" value="${esc(cfg['결재란'])}" placeholder="예) 담당,사무국장,지회장"><button onclick="saveSign()">저장</button></div>
        <div style="color:#777;font-size:13px;margin-top:6px">품의서·결의서를 인쇄할 때 오른쪽 위 결재란에 들어갈 직위입니다. 쉼표로 구분 (최대 6칸)</div></div>
      <div class="card" style="cursor:default"><b>통장</b>${accRows}
        <div style="display:grid;gap:8px;margin-top:8px"><input id="st_ai" placeholder="통장 ID (예: BA01)"><input id="st_ab" placeholder="은행명"><input id="st_an" placeholder="계좌번호"><input id="st_ah" placeholder="예금주"><button onclick="addAcc()">통장 추가</button></div></div>`;
  } catch (e) { msg(e.message, 'err'); }
}
async function saveBud(c) { try { await api('saveBudget', (await api('getManage')).year, c, $('bd_' + c).value || 0); await showSettings(); msg('예산을 저장했습니다.', 'ok'); } catch (e) { msg(e.message, 'err'); } }
async function saveSign() { try { await api('saveSignline', $('st_sign').value); PCFG = null; await showSettings(); msg('결재란을 저장했습니다.', 'ok'); } catch (e) { msg(e.message, 'err'); } }

// ===== 예산 현황 =====
async function showBudget() { const VT = vtok();
  msg('');
  try {
    const list = await loadBudget();
    const T = 'padding:7px 5px;border-bottom:1px solid #ddd;font-size:13px;text-align:right;white-space:nowrap';
    const sum = k => list.reduce((a, b) => a + Number(b[k] || 0), 0);
    const row = (b, bold) => {
      const left = b['예산액'] - b['집행액'], rate = b['예산액'] ? Math.round(b['집행액'] / b['예산액'] * 1000) / 10 : null;
      return `<tr style="${bold ? 'font-weight:bold;background:#f6f8fc' : ''}"><td style="${T};text-align:left">${esc(b['이름'])}${!bold && !b['예산설정'] ? ' <span class="badge">예산 미설정</span>' : ''}</td>
        <td style="${T}">${won(b['예산액'])}</td><td style="${T}">${won(b['품의액'])}</td><td style="${T}">${won(b['집행액'])}</td>
<td style="${T};${left < 0 ? 'color:#c0392b' : ''}">${won(left)}</td>
        <td style="${T}">${rate == null ? '-' : rate + '%'}</td><td style="${T}">${won(b['수입액'])}</td></tr>`;
    };
    vw(VT).innerHTML = `<h2>재원별 예산 현황 (${esc(OPTS.year)}회계연도)</h2>
      <p style="color:#666;font-size:13px">집행 = 작성(확정)된 지출결의 · 남은 예산 = 예산 − 집행</p>
      <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;background:#fff"><tr>
        ${['재원','예산','품의','집행','남은 예산','집행률','수입'].map((h, i) => `<th style="${T};${i ? '' : 'text-align:left;'}border-bottom:2px solid #999">${h}</th>`).join('')}</tr>
        ${list.map(b => row(b)).join('')}
        ${list.length > 1 ? row({ 이름: '합계', 예산액: sum('예산액'), 품의액: sum('품의액'), 집행액: sum('집행액'), 대기액: sum('대기액'), 수입액: sum('수입액'), 예산설정: true }, true) : ''}
      </table></div>
      ${ME.can_manage ? '<div class="actions"><button class="sub" onclick="showSettings()">예산 정하기 (설정)</button></div>' : ''}`;
  } catch (e) { msg(e.message, 'err'); }
}

// ===== 인쇄 (품의서 · 결의서) =====
let PCFG = null;
async function printCfg() { if (!PCFG) PCFG = await api('printCfg'); return PCFG; }
// 결재칸: 문서마다 칸 수·직위를 바꿀 수 있음 (문서에 저장한 결재란 → 없으면 설정의 결재란)
function signEditor(v) {
  const a = String(v || '').split(',').map(x => x.trim()).filter(Boolean);
  return `<label>결재칸 <span style="color:#777;font-size:13px;font-weight:normal">이 문서만 · ＋로 칸 추가, ×로 빼기, 직위는 바로 고치기 (최대 6칸)</span></label>
    <div class="sged" id="sgEd">${a.map(sgCell).join('')}<button type="button" class="sub" onclick="sgAdd()">＋ 칸</button></div>`;
}
function sgCell(x) { return `<span class="sgc"><input value="${esc(x)}" placeholder="직위"><button type="button" class="sub" onclick="this.parentNode.remove()" aria-label="칸 빼기">×</button></span>`; }
function sgAdd() { const ed = $('sgEd'); if (ed.querySelectorAll('.sgc').length >= 6) return msg('결재칸은 6칸까지 가능합니다.', 'err'); ed.lastElementChild.insertAdjacentHTML('beforebegin', sgCell('')); ed.querySelector('.sgc:last-of-type input').focus(); }
function sgVal() { const ed = $('sgEd'); return ed ? [...ed.querySelectorAll('input')].map(i => i.value.trim()).filter(Boolean).join(',') : null; }
async function saveSign2(kind, no) {
  const v = sgVal(); if (v === null) return;
  const def = String((PCFG || {})['결재란'] || '').replace(/\s*,\s*/g, ',');
  try { await api('docSign', kind, no, v === def ? '' : v); } catch (e) { msg('결재칸 저장: ' + e.message, 'err'); }
}
function signTable(cfg, own) {
  const t = String(own || cfg['결재란'] || '').split(',').filter(Boolean);
  return `<table class="sign"><tr><th rowspan="2" style="width:8mm;writing-mode:vertical-rl;letter-spacing:4px">결재</th>${t.map(x => `<th>${esc(x)}</th>`).join('')}</tr><tr>${t.map(() => '<td></td>').join('')}</tr></table>`;
}
function hangulWon(n) {
  n = Math.floor(Number(n) || 0); if (!n) return '영원';
  const d = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'], u = ['', '십', '백', '천'], b = ['', '만', '억', '조'];
  let out = '', i = 0;
  while (n > 0) { const c = n % 10000; if (c) { let s = ''; String(c).split('').reverse().forEach((ch, j) => { const v = +ch; if (v) s = d[v] + u[j] + s; }); out = s + b[i] + out; } n = Math.floor(n / 10000); i++; }
  return '금 ' + out + '원정';
}
function doPrint(html) { $('printArea').innerHTML = html; setTimeout(() => window.print(), 50); }
async function printProp(no) {
  try {
    const [p, cfg] = await Promise.all([api('getProposal', no), printCfg()]);
    const R = (k, v) => `<tr><th>${k}</th><td>${v}</td></tr>`;
    doPrint(`<div class="pdoc"><h1>품 의 서</h1>${signTable(cfg, p['결재란'])}
      <div class="meta"><span>품의번호: ${esc(p['품의번호'])}</span><span>작성일: ${esc(p['작성일'])}</span></div>
      <table>${R('사 업 명', esc(p['사업명']))}${R('사업기간', esc(p['사업시작일']) + ' ~ ' + esc(p['사업종료일']))}
      ${R('목(계정과목)', esc(nameOf('목', p['목코드'])))}${R('자금원천(재원)', esc(nameOf('자금원천', p['자금원천코드'])))}
      ${R('금 액', `<b>${won(p['금액'])}</b> (${hangulWon(p['금액'])})`)}${R('거 래 처', esc(p['거래처']))}
      ${R('산출근거', `<div style="white-space:pre-wrap;min-height:40mm">${esc(p['산출근거'] || '')}</div>`)}
      ${R('첨부목록', `<div style="white-space:pre-wrap">${esc(p['첨부목록'] || '')}</div>`)}
      ${R('작 성 자', esc(p['작성자']))}</table>
      <p style="margin-top:8mm;text-align:center">위와 같이 품의하오니 결재하여 주시기 바랍니다.</p>
      <div class="foot">${esc(cfg.org_name || fullOrg(cfg.chapter_name))}</div></div>`);
  } catch (e) { msg(e.message, 'err'); }
}
async function printRes(no) {
  try {
    await loadRes();
    const [r, cfg] = await Promise.all([api('getResolution', no), printCfg()]);
    const R = (k, v) => `<tr><th>${k}</th><td>${v}</td></tr>`;
    const title = r['결의구분'] === '수입' ? '수 입 결 의 서' : '지 출 결 의 서';
    doPrint(`<div class="pdoc"><h1>${title}</h1>${signTable(cfg, r['결재란'])}
      <div class="meta"><span>결의번호: ${esc(r['결의번호'])}</span><span>회계연도: ${esc(r['회계연도'])}</span></div>
      <table>${R('결의일자', esc(r['날짜']))}${r['결의구분'] === '지출' ? R('관련 품의', esc(r['품의번호'] || '')) : ''}
      ${R('목(계정과목)', esc(nameOf('목', r['목코드'])))}${R('자금원천(재원)', esc(nameOf('자금원천', r['자금원천코드'])))}
      ${R('통 장', esc(accName(r['통장id'])))}${R('적 요', `<div style="white-space:pre-wrap;min-height:25mm">${esc(r['적요'])}</div>`)}
      ${R('금 액', `<b>${won(r['금액'])}</b> (${hangulWon(r['금액'])})`)}${R(r['결의구분'] === '수입' ? '납 부 자' : '거 래 처', esc(r['거래처']))}
      ${R('작 성 자', esc(r['작성자']))}</table>
      <p style="margin-top:8mm;text-align:center">위와 같이 ${r['결의구분'] === '수입' ? '수입' : '지출'}을 결의합니다.</p>
      <div class="foot">${esc(cfg.org_name || fullOrg(cfg.chapter_name))}</div></div>`);
  } catch (e) { msg(e.message, 'err'); }
}

async function setYear() { try { await api('setYear', $('st_year').value); OPTS = await api('getFormOptions'); ME = OPTS.user; $('who').textContent = `${ME.chapter_name} · ${ME.name || ME.email} · ${OPTS.year}회계연도`; await showSettings(); msg('회계연도를 바꿨습니다.', 'ok'); } catch (e) { msg(e.message, 'err'); } }
async function addCode(k, ci, ni) { try { await api('saveCode', k, $(ci).value, $(ni).value, true); OPTS = await api('getFormOptions'); ME = OPTS.user; await showSettings(); msg('저장했습니다.', 'ok'); } catch (e) { msg(e.message, 'err'); } }
async function toggleCode(k, c, n, use) { try { await api('saveCode', k, c, n, use); OPTS = await api('getFormOptions'); ME = OPTS.user; await showSettings(); } catch (e) { msg(e.message, 'err'); } }
async function addAcc() { try { await api('saveAccount', $('st_ai').value, $('st_ab').value, $('st_an').value, $('st_ah').value, true); await showSettings(); msg('저장했습니다.', 'ok'); } catch (e) { msg(e.message, 'err'); } }
async function toggleAcc(id, use) {
  try { const d = await api('getManage'); const a = d.accounts.find(x => x['통장id'] === id);
    await api('saveAccount', a['통장id'], a['은행명'], a['계좌번호'], a['예금주'], use); await showSettings(); } catch (e) { msg(e.message, 'err'); }
}

init();
</script>

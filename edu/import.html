<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>자료 가져오기</title>
<style>body{font:15px/1.6 system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px}input,button{font:inherit;padding:8px;margin:4px 0}button{cursor:pointer}pre{background:#f3f3f3;padding:12px;white-space:pre-wrap}</style></head><body>
<h2>자료 가져오기 (1회용)</h2>
<p>구글 시트의 <b>③ Supabase 이전용 내보내기</b>로 만든 JSON 파일을 올립니다.</p>
<label>가져오기 키 <input id="key" type="password" size="30"></label><br>
<input id="file" type="file" accept=".json,application/json"><br>
<p>또는 파일 대신 내용을 복사해서 아래 칸에 붙여넣어도 됩니다.</p>
<textarea id="paste" rows="5" style="width:100%" placeholder="여기에 붙여넣기 (파일을 골랐다면 비워 두세요)"></textarea><br>
<label><input id="clear" type="checkbox" checked> 기존 자료를 지우고 새로 넣기</label><br>
<button id="go">가져오기</button>
<pre id="out"></pre>
<script>
document.getElementById('go').onclick = async () => {
  const out = document.getElementById('out'), f = document.getElementById('file').files[0], pasted = document.getElementById('paste').value.trim();
  if (!f && !pasted) { out.textContent = '파일을 선택하거나 내용을 붙여넣어 주세요.'; return; }
  out.textContent = '올리는 중…';
  try {
    const text = f ? await f.text() : pasted;
    if (!text.trim()) { out.textContent = '실패: 파일이 비어 있습니다(0바이트). 시트에서 내보내기를 다시 해 주세요.'; return; }
    const tables = JSON.parse(text);
    const r = await fetch('/api/import', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: document.getElementById('key').value, clear: document.getElementById('clear').checked, tables: tables.tables || tables }) });
    const j = await r.json();
    out.textContent = j.ok ? '완료!\n' + Object.entries(j.report).map(([k, v]) => k + ': ' + v + '줄').join('\n') : '실패: ' + j.error;
  } catch (e) { out.textContent = '실패: ' + e.message; }
};
</script></body></html>

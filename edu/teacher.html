<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>강사 입력</title>
<style>
:root { --pine:#1f4d3a; --pine-soft:#e6f0ea; --bg:#f4f7f5; --ink:#1b2b24; --muted:#5d6b64; --line:#d5ded9; --red:#b3261e; --red-soft:#fbe9e7; --amber:#8a5a00; --amber-soft:#fff3d6; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
.wrap { max-width:640px; margin:0 auto; padding:0 16px 96px; }
header { background:var(--pine); color:#fff; padding:14px 16px; }
header h1 { margin:0; font-size:19px; }
header p { margin:2px 0 0; font-size:13px; opacity:.85; }
.tabs { display:flex; gap:4px; margin:14px 0; background:#fff; border:1px solid var(--line); border-radius:12px; padding:4px; }
.tabs button { flex:1; border:0; background:none; padding:11px 4px; border-radius:9px; font:inherit; font-weight:700; color:var(--muted); cursor:pointer; }
.tabs button[aria-selected=true] { background:var(--pine); color:#fff; }
.card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
.chips { display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 12px; }
.chip { min-width:48px; padding:9px 12px; border:1.5px solid var(--line); border-radius:999px; background:#fff; font:inherit; font-weight:700; cursor:pointer; }
.chip.done { border-color:var(--pine); color:var(--pine); background:var(--pine-soft); }
.chip.sel { background:var(--pine); border-color:var(--pine); color:#fff; }
label.f { display:block; font-weight:700; font-size:14px; margin:12px 0 4px; }
input, textarea, select { width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:10px; font:inherit; background:#fff; }
textarea { min-height:96px; resize:vertical; }
.row { display:flex; align-items:center; gap:10px; }
.spacer { flex:1; }
.btn { border:1.5px solid var(--pine); background:#fff; color:var(--pine); padding:11px 16px; border-radius:10px; font:inherit; font-weight:700; cursor:pointer; }
.btn.primary { background:var(--pine); color:#fff; }
.btn.small { padding:7px 12px; font-size:14px; }
.btn:disabled { opacity:.5; }
.person { display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:14px; margin:0 0 8px; border:1.5px solid var(--line); border-radius:12px; background:#fff; font:inherit; cursor:pointer; }
.person .box { width:28px; height:28px; border-radius:8px; border:2px solid #9bb0a5; display:grid; place-items:center; font-weight:900; color:#fff; flex:none; }
.person.on { border-color:var(--pine); background:var(--pine-soft); }
.person.on .box { background:var(--pine); border-color:var(--pine); }
.person:disabled { opacity:.6; }
.notice { border-radius:10px; padding:11px 13px; margin-bottom:12px; font-size:14px; }
.notice.warn { background:var(--amber-soft); color:var(--amber); }
.notice.err { background:var(--red-soft); color:var(--red); }
.notice.info { background:var(--pine-soft); color:var(--pine); }
.hint { color:var(--muted); font-size:13px; }
.savebar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); padding:10px 16px; }
.savebar .in { max-width:640px; margin:0 auto; display:flex; gap:10px; align-items:center; }
.toast { position:fixed; left:50%; top:16px; transform:translateX(-50%); background:#1b2b24; color:#fff; padding:11px 18px; border-radius:10px; z-index:9; max-width:90%; }
.toast.err { background:var(--red); }
.center { text-align:center; padding:64px 20px; }
.sig { border:1.5px dashed var(--line); border-radius:10px; background:#fff; touch-action:none; width:100%; height:150px; display:block; }
.sigimg { max-height:90px; max-width:100%; display:block; margin:6px 0; border-bottom:1px solid var(--line); }
table.cf { width:100%; border-collapse:collapse; font-size:14px; }
table.cf th, table.cf td { border:1px solid var(--line); padding:6px; vertical-align:top; }
table.cf th { background:var(--pine-soft); }
table.cf textarea { min-height:56px; border-width:1px; padding:6px 8px; }
.sum { display:flex; gap:8px; margin:0 0 10px; flex-wrap:wrap; }
.sum span { background:var(--pine-soft); color:var(--pine); padding:6px 12px; border-radius:999px; font-size:13px; font-weight:700; }
.tbox { background:#fff; border:1px solid var(--line); border-radius:12px; overflow-x:auto; margin-bottom:12px; }
table.at { width:100%; border-collapse:collapse; }
table.at thead th { background:var(--pine); color:#fff; font-size:13px; font-weight:600; padding:11px 12px; text-align:left; white-space:nowrap; }
table.at tbody td { padding:10px 12px; border-top:1px solid var(--line); font-size:14px; vertical-align:middle; }
table.at .c { text-align:center; }
table.at tbody tr.on { background:#eef4f0; }
table.at td.no { width:48px; color:var(--muted); }
table.at td.nm { font-size:17px; font-weight:700; white-space:nowrap; }
table.at input[type=checkbox] { width:24px; height:24px; accent-color:var(--pine); cursor:pointer; padding:0; }
table.at input[type=number] { width:72px; padding:7px 8px; text-align:center; }
table.at select { width:auto; padding:7px 8px; font-size:14px; }
.badge.in { background:var(--pine-soft); color:var(--pine); min-width:52px; text-align:center; }
.badge.out { background:#f0f1f0; color:var(--muted); min-width:52px; text-align:center; }
.badge { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:700; background:var(--pine-soft); color:var(--pine); }
</style>
</head>
<body>
<div id="app"><div class="center hint">불러오는 중…</div></div>
<script>
// 기관 전체 이름: 지회는 '강원특별자치도농아인협회○○지회'(띄어쓰기 없이), 도협회는 협회 이름, 센터 등은 그 이름 그대로
function fullOrg(n) { n = String(n || '').trim(); if (!n || n === '도협회') return '강원특별자치도농아인협회'; return /지회$/.test(n) && n.indexOf('농아인협회') < 0 ? '강원특별자치도농아인협회' + n : n; }

const TOKEN = location.pathname.split('/').filter(Boolean).pop() || '';
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const S = { cf: null, tab: 'att', info: null, sess: 1, draft: null, draftDate: '', draftCount: '', dirty: false, journal: null, jsess: 1, tasks: null, edit: null };

async function api(fn, ...args) {
  let res;
  try {
    res = await (await fetch('/api/call', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fn: fn, args: [TOKEN, ...args] }) })).json();
  } catch (e) { throw new Error('서버에 연결하지 못했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.'); }
  if (!res || !res.ok) { const e = new Error((res && res.error) || '처리하지 못했습니다.'); e.code = res && res.code; throw e; }
  return res.data;
}
let tt;
function toast(msg, err) {
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; document.body.appendChild(t);
  clearTimeout(tt); setTimeout(() => t.remove(), err ? 4500 : 2200);
}
async function act(btn, fn) {
  if (btn) btn.disabled = true;
  try { await fn(); } catch (e) { if (e.code === 'LINK') showDead(e.message); else toast(e.message, true); }
  finally { if (btn) btn.disabled = false; }
}
function showDead(msg) {
  $('#app').innerHTML = `<div class="center"><h2>사용할 수 없는 링크입니다</h2><p>${esc(msg)}</p></div>`;
}
function confirmLeave() { return !S.dirty || confirm('저장하지 않은 내용이 있습니다. 저장하지 않고 이동할까요?'); }

/* ---------- 틀 ---------- */
function shell() {
  const c = S.info.course;
  $('#app').innerHTML = `<header><div class="wrap" style="padding:0"><h1>${esc(c.강좌명)}</h1>
    <p>${esc(fullOrg(c.지회명))} · ${esc(c.시작일)} ~ ${esc(c.종료일)} · 총 ${c.총회차}회${c.강사 ? ' · ' + esc(c.강사) + ' 강사님' : ''}${c.보조강사 ? ' · 보조 ' + esc(c.보조강사) : ''}</p></div></header>
    <div class="wrap">
      <div class="tabs" role="tablist">
        <button role="tab" data-t="att" aria-selected="${S.tab === 'att'}">${c.인원만입력 ? '인원' : '출석'}</button>
        <button role="tab" data-t="jr" aria-selected="${S.tab === 'jr'}">교육일지</button>
        ${c.인원만입력 ? '' : `<button role="tab" data-t="tk" aria-selected="${S.tab === 'tk'}">과제</button>`}
        ${c.수료집계 && !c.인원만입력 ? `<button role="tab" data-t="cp" aria-selected="${S.tab === 'cp'}">수료</button>` : ''}
        ${c.확인서필요 ? `<button role="tab" data-t="cf" aria-selected="${S.tab === 'cf'}">확인서</button>` : ''}
      </div>
      ${S.info.locked ? `<div class="notice warn">${esc(S.info.lockedBy || '')} 보고가 제출되어 출석은 더 이상 고칠 수 없습니다. 교육일지와 과제는 계속 쓸 수 있습니다.</div>` : ''}
      <div id="body"></div>
      <p class="hint" style="margin-top:20px">이 링크는 ${esc(c.만료일)}까지 사용할 수 있습니다. 링크를 다른 사람에게 알려 주지 마세요.</p>
    </div><div id="bar"></div>`;
  document.querySelectorAll('[data-t]').forEach(b => b.onclick = async () => {
    if (b.dataset.t === S.tab) return;
    if (!confirmLeave()) return;
    S.tab = b.dataset.t; S.dirty = false; shell(); render();
  });
}
function render() {
  $('#bar').innerHTML = '';
  if (S.tab === 'att') renderAtt(); else if (S.tab === 'jr') renderJournal(); else if (S.tab === 'cf') renderConfirm(); else if (S.tab === 'cp') renderComplete(); else renderTasks();
}
function chips(total, sel, doneFn, attr) {
  return '<div class="chips">' + Array.from({ length: total }, (_, i) => i + 1).map(n =>
    `<button class="chip ${doneFn(n) ? 'done' : ''} ${n === sel ? 'sel' : ''}" ${attr}="${n}">${n}회${doneFn(n) ? ' ✓' : ''}</button>`).join('') + '</div>';
}
function savebar(label, id) { $('#bar').innerHTML = `<div class="savebar"><div class="in"><span class="hint" id="sbInfo" style="flex:1"></span><button class="btn primary" id="${id}">${label}</button></div></div>`; }

/* ---------- 출석 ---------- */
function heldSession(n) { const i = S.info; return i.dates[n] !== undefined || i.headcounts[n] !== undefined || i.participants.some(p => (i.attendance[p.참여자ID] || {})[n] !== undefined); }
function loadDraft() {
  const i = S.info, n = S.sess;
  S.draft = new Set(i.participants.filter(p => (i.attendance[p.참여자ID] || {})[n] === 'O').map(p => p.참여자ID));
  S.draftDate = i.dates[n] || i.today;
  S.draftCount = i.headcounts[n] !== undefined ? String(i.headcounts[n]) : '';
  S.draftContent = S.cf ? (S.cf.내용[n - 1] || '') : '';
  S.dirty = false;
}
function cfNeed() { return !!(S.info && S.info.course.확인서필요); }
function cfDone() { return !!(S.cf && S.cf.제출); }
function cfBox(n, last) {   // 강의확인서 강좌: 마지막 회차면 강사 서명 (교육내용은 [확인서] 탭의 표에서 적음)
  if (!cfNeed() || cfDone()) return '';
  return `${last ? `<div class="card" style="border-color:var(--pine)"><b>✍️ 강사 서명 후 제출</b><p class="hint" style="margin:4px 0 8px">마지막 회차입니다. 서명하고 <b>제출</b>하면 지회 담당자에게 알림이 가고, 학교(기관) 담당자 서명 링크가 만들어집니다. 제출 후에는 고칠 수 없습니다.</p><div id="padT"></div><div class="row" style="margin-top:8px"><button class="btn small" id="padTclr">지우기</button></div></div>` : ''}`;
}
function cfStatus() {
  if (!cfNeed() || !cfDone()) return '';
  const d = S.cf;
  return `<div class="notice info"><b>✅ 강의확인서를 제출했습니다</b> (${esc(d.제출일시)})<br>${d.기관서명 ? '학교(기관) 담당자 서명까지 끝났습니다. (' + esc(d.기관담당자) + ' · ' + esc(d.기관서명일시) + ')' : '지회 담당자가 학교(기관)에 서명 링크를 보내면 학교 담당자가 서명합니다.'}<br><span class="hint">고쳐야 하면 지회 담당자에게 요청해 주세요.</span></div>`;
}
function pinfo(p) { return [p.성별, p.연락처, p.비고].filter(x => x).join(' · '); }
function renderAtt() {
  const i = S.info, c = i.course;
  const body = $('#body');
  const last = S.sess === c.총회차, lockAll = i.locked || (cfNeed() && cfDone());
  const head = chips(c.총회차, S.sess, n => heldSession(n) && (!cfNeed() || !!(S.cf && String(S.cf.내용[n - 1] || '').trim())), 'data-s');
  const dateIn = `<label class="f" for="dt">수업일</label><input type="date" id="dt" value="${esc(S.draftDate)}" ${lockAll ? 'disabled' : ''}>`;
  if (c.인원만입력) {
    body.innerHTML = `${cfStatus()}<div class="card"><b>회차 선택</b>${head}${dateIn}
      <label class="f" for="hc">참석 인원 (명)</label><input type="number" inputmode="numeric" id="hc" min="0" max="10000" value="${esc(S.draftCount)}" ${lockAll ? 'disabled' : ''}></div>${cfBox(S.sess, last)}`;
    $('#dt').onchange = e => { S.draftDate = e.target.value; S.dirty = true; };
    $('#hc').oninput = e => { S.draftCount = e.target.value; S.dirty = true; };
  } else {
    body.innerHTML = `${cfStatus()}<div class="card"><b>회차 선택</b>${head}${dateIn}</div>
      <div class="row" style="margin:6px 0 10px"><b>${S.sess}회차 출석 체크</b><span class="spacer"></span>
        <button class="btn small" id="allOn" ${lockAll ? 'disabled' : ''}>전체 출석</button> <button class="btn small" id="allOff" ${lockAll ? 'disabled' : ''}>전체 해제</button></div>
      ${i.participants.length ? `<div class="sum" id="cnt"></div><div class="tbox"><table class="at"><thead><tr><th>번호</th><th>이름</th><th class="c">출석 체크</th><th class="c">출결</th></tr></thead><tbody>
        ${i.participants.map((p, k) => { const on = S.draft.has(p.참여자ID); return `<tr class="${on ? 'on' : ''}" data-row="${esc(p.참여자ID)}"><td class="no">${k + 1}</td><td class="nm">${esc(p.이름)}</td>
          <td class="c"><input type="checkbox" data-p="${esc(p.참여자ID)}" aria-label="${esc(p.이름)} 출석" ${on ? 'checked' : ''} ${lockAll ? 'disabled' : ''}></td>
          <td class="c"><span class="badge ${on ? 'in' : 'out'}">${on ? '출석' : '결석'}</span></td></tr>`; }).join('')}</tbody></table></div>`
        : '<div class="notice info">등록된 수강생이 없습니다. 지회 담당자에게 명단 등록을 요청하세요.</div>'}${cfBox(S.sess, last)}`;
    const upd = () => { const n = i.participants.length, on = S.draft.size; if ($('#cnt')) $('#cnt').innerHTML = `<span>전체 ${n}명</span><span>출석 ${on}명</span><span>결석 ${n - on}명</span>`; };
    upd();
    $('#dt').onchange = e => { S.draftDate = e.target.value; S.dirty = true; };
    document.querySelectorAll('[data-p]').forEach(b => b.onchange = () => {
      const id = b.dataset.p; b.checked ? S.draft.add(id) : S.draft.delete(id); S.dirty = true;
      const tr = b.closest('tr'), bd = tr.querySelector('.badge'); tr.classList.toggle('on', b.checked);
      bd.className = 'badge ' + (b.checked ? 'in' : 'out'); bd.textContent = b.checked ? '출석' : '결석'; upd();
    });
    $('#allOn').onclick = () => { i.participants.forEach(p => S.draft.add(p.참여자ID)); S.dirty = true; renderAtt(); };
    $('#allOff').onclick = () => { S.draft.clear(); S.dirty = true; renderAtt(); };
  }
  document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { if (!confirmLeave()) return; S.sess = Number(b.dataset.s); loadDraft(); renderAtt(); });
  if ($('#cfc')) $('#cfc').oninput = e => { S.draftContent = e.target.value; S.dirty = true; };
  let padT = null;
  if ($('#padT')) { padT = sigPad($('#padT')); $('#padTclr').onclick = () => padT.clear(); }
  if (cfNeed() && cfDone()) return;            // 제출한 뒤에는 고칠 수 없음 (지회 담당자가 풀어 줘야 함)
  if (cfNeed() && (c.인원만입력 || i.participants.length)) {   // 강의확인서 강좌: 출석 + 교육내용을 함께 [저장], 마지막 회차는 서명하고 [제출]
    const data = () => ({ present: [...S.draft], count: S.draftCount, date: S.draftDate, content: (S.cf && S.cf.내용[S.sess - 1]) || '' });   // 교육내용은 [확인서] 탭에서 저장한 값 그대로
    if (last) {
      savebar(`${S.sess}회차 저장하고 제출`, 'save');
      $('#save').onclick = () => act($('#save'), async () => {
        const empty = S.cf.내용.map((x, k) => String(x || '').trim() ? 0 : k + 1).filter(n => n && n <= c.총회차);
        if (empty.length) throw new Error('[확인서] 탭에서 교육내용을 먼저 적어 주세요. (비어 있는 회차: ' + empty.join(', ') + '회)');
        if (!padT || padT.empty()) throw new Error('강사 서명란에 서명해 주세요.');
        if (!confirm('출석을 저장하고 강의확인서를 제출할까요? 제출 후에는 고칠 수 없습니다.')) return;
        const r = await api('tSubmitConfirm', S.sess, data(), padT.png());
        S.info = r.info; S.cf = r.cf; loadDraft(); renderAtt(); toast('강의확인서를 제출했습니다. 지회 담당자에게 알렸어요.');
      });
    } else {
      savebar(`${S.sess}회차 저장`, 'save');
      $('#save').onclick = () => act($('#save'), async () => {
        const r = await api('tSaveSession', S.sess, data());
        S.info = r.info; S.cf = r.cf || S.cf; loadDraft(); renderAtt(); toast(`${S.sess}회차 출석을 저장했습니다.`);
      });
    }
    return;
  }
  if (!i.locked && (c.인원만입력 || i.participants.length)) {
    savebar(`${S.sess}회차 저장`, 'save');
    $('#save').onclick = () => act($('#save'), async () => {
      S.info = c.인원만입력 ? await api('tSaveHeadcount', S.sess, S.draftCount, S.draftDate) : await api('tSaveAttendance', S.sess, [...S.draft], S.draftDate);
      loadDraft(); renderAtt(); toast(`${S.sess}회차를 저장했습니다.`);
    });
  }
}

/* ---------- 교육일지 ---------- */
/* 서명 칸: 화면에서 서명하거나, 비워 두고 인쇄 후 직접 서명. value(): 그대로면 undefined, 지움/비움이면 '', 새로 그리면 그림 */
function sigArea(host, existing, onDraw) {
  let cur = existing || '', pad = null;
  const draw = () => {
    if (cur) {
      pad = null;
      host.innerHTML = `<img src="${esc(cur)}" alt="저장된 서명" style="height:70px;max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;display:block"><button type="button" class="btn small" data-sc style="margin-top:6px">서명 지우기</button>`;
      host.querySelector('[data-sc]').onclick = () => { cur = ''; if (onDraw) onDraw(); draw(); };
    } else {

/* 사진: 화면에서 줄여서(긴 쪽 1000px, JPG) 올립니다 */
async function photoDataUrl(file) {
  if (!file || !/^image\//.test(file.type || 'image/')) throw new Error('사진 파일(JPG, PNG)만 올릴 수 있습니다.');
  let img;
  try { img = await new Promise((ok, no) => { const u = URL.createObjectURL(file), i = new Image(); i.onload = () => { URL.revokeObjectURL(u); ok(i); }; i.onerror = () => { URL.revokeObjectURL(u); no(); }; i.src = u; }); }
  catch (e) { throw new Error('이 사진을 읽을 수 없습니다. JPG 또는 PNG 사진을 올려 주세요.'); }
  const k = Math.min(1, 1000 / Math.max(img.naturalWidth, img.naturalHeight)), w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
  let q = 0.78, out = cv.toDataURL('image/jpeg', q);
  while (out.length > 240000 && q > 0.35) { q -= 0.1; out = cv.toDataURL('image/jpeg', q); }
  if (out.length > 240000) throw new Error('사진이 너무 큽니다. 더 작은 사진으로 올려 주세요.');
  return out;
}

function sigPad(host) {

  cv.addEventListener('pointerdown', e => { e.preventDefault(); down = true; last = pos(e); cv.setPointerCapture(e.pointerId); g.beginPath(); g.moveTo(last.x, last.y); g.lineTo(last.x + .1, last.y + .1); g.stroke(); drawn = true; });
  cv.addEventListener('pointermove', e => { if (!down) return; e.preventDefault(); const p = pos(e); g.beginPath(); g.moveTo(last.x, last.y); g.lineTo(p.x, p.y); g.stroke(); last = p; });

  return { clear() { g.clearRect(0, 0, W, H); drawn = false; }, empty() { return !drawn; }, png() { return cv.toDataURL('image/png'); } };
}

    <td>${done ? esc(d.내용[k]).replace(/\n/g, '<br>') : `<textarea data-c="${k}" maxlength="200" rows="2" placeholder="예: 인사 표현 익히기">${esc(d.내용[k])}</textarea>`}</td></tr>`; }).join('');
  body.innerHTML = `<div class="card"><b>진행 상황</b><div style="margin-top:6px">${step(filled > 0, '① 매회 저장 ' + filled + '/' + total + '회')}${step(done, '② 강사 서명·제출')}${step(done && d.링크발송일시, '③ 학교에 링크 보냄')}${step(!!d.기관서명, '④ 학교 서명')}</div>
      <p class="hint" style="margin:8px 0 0">${done ? (d.기관서명 ? '학교(기관) 담당자 서명까지 끝났습니다. 지회 담당자가 인쇄합니다.' : '제출했습니다. 지회 담당자가 학교에 서명 링크를 보냅니다.') : '회차마다 <b>출석</b> 탭에서 출석을 저장하고, 교육내용은 아래 표에 적어 [교육내용 저장]을 누르세요. 마지막 ' + total + '회차 <b>출석</b> 탭에서 서명하고 <b>제출</b>합니다.'}</p></div>
    <div class="card" style="padding:8px"><table class="cf"><tr><th style="width:42px">회차</th><th style="width:84px">수업일</th><th style="width:44px">인원</th><th>교육내용</th></tr>${rows}</table>
    ${done ? '' : '<div class="row" style="margin-top:10px"><span class="spacer"></span><button class="btn primary" id="cfSave">교육내용 저장</button></div>'}</div>
    ${d.강사서명 ? `<div class="card"><b>강사 서명</b><img class="sigimg" src="${esc(d.강사서명)}" alt="강사 서명"><div class="hint">${esc(c.강사 || '')} · ${esc(d.강사서명일시)}</div></div>` : ''}
    ${d.기관서명 ? `<div class="card"><b>학교(기관) 담당자 서명</b><img class="sigimg" src="${esc(d.기관서명)}" alt="기관 담당자 서명"><div class="hint">${esc(d.기관소속)} ${esc(d.기관담당자)} · ${esc(d.기관서명일시)}</div></div>` : ''}`;
  body.oninput = e => { if (e.target.matches && e.target.matches('[data-c]')) S.dirty = true; };
  if ($('#cfSave')) $('#cfSave').onclick = () => act($('#cfSave'), async () => {
    S.cf = await api('tSaveConfirm', [...document.querySelectorAll('[data-c]')].map(t => t.value)); S.dirty = false; renderConfirm(); toast('교육내용을 저장했습니다.');
  });
}

/* ---------- 시작 ---------- */
(async function () {
  if (!/^[0-9a-f]{40}$/.test(TOKEN)) return showDead('링크 주소가 올바르지 않습니다. 받은 링크 전체를 다시 열어 주세요.');
  try { S.info = await api('tInfo'); } catch (e) { return showDead(e.message); }
  const i = S.info;
  if (i.course.확인서필요) { try { S.cf = await api('tGetConfirm'); } catch (e) { S.cf = null; } }
  S.sess = (Array.from({ length: i.course.총회차 }, (_, k) => k + 1).find(n => !heldSession(n))) || i.course.총회차;
  loadDraft(); shell(); render();
})();
</script>
</body>
</html>
